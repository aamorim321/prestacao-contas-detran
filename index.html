// Input/textarea que preserva a posição do cursor mesmo quando o valor é ajustado
// no onChange (ex.: se algum dia precisarmos aplicar uma máscara/formatação). Hoje
// não aplicamos nenhuma transformação — o texto fica exatamente como a pessoa digitou.
function CampoTexto({ as: Tag = "input", value, onChange, ...props }) {
  const ref = useRef(null);
  const posicaoPendente = useRef(null);

  useLayoutEffect(() => {
    if (posicaoPendente.current !== null && ref.current) {
      const { inicio, fim } = posicaoPendente.current;
      ref.current.setSelectionRange(inicio, fim);
      posicaoPendente.current = null;
    }
  });

  function handleChange(e) {
    const campo = e.target;
    posicaoPendente.current = { inicio: campo.selectionStart, fim: campo.selectionEnd };
    onChange(campo.value);
  }

  return <Tag ref={ref} value={value} onChange={handleChange} {...props} />;
}

function FieldGuide({ show = true, children, className = "" }) {
  if (!show) return null;
  return <div className={("char-hint field-guidance " + className).trim()}>{children}</div>;
}

function LocalidadeSelect({ value, onChange, estados, estadosErro, municipiosCache, garantirMunicipios }) {
  const partes = (value || "").split(" - ");
  const municipioDoValor = partes.length === 2 ? partes[0] : "";
  const ufDoValor = partes.length === 2 ? partes[1] : "";

  const [uf, setUf] = useState(ufDoValor);
  const [carregandoMunicipios, setCarregandoMunicipios] = useState(false);
  const [erroMunicipios, setErroMunicipios] = useState(false);

  useEffect(() => {
    if (ufDoValor && ufDoValor !== uf) setUf(ufDoValor);
  }, [ufDoValor]);

  useEffect(() => {
    if (!uf || municipiosCache[uf]) return;
    let cancelado = false;
    setCarregandoMunicipios(true);
    setErroMunicipios(false);
    garantirMunicipios(uf).then(ok => {
      if (cancelado) return;
      setCarregandoMunicipios(false);
      if (!ok) setErroMunicipios(true);
    });
    return () => { cancelado = true; };
  }, [uf]);

  function selecionarUF(novaUF) {
    setUf(novaUF);
    onChange("");
  }

  function selecionarMunicipio(nomeMunicipio) {
    if (!nomeMunicipio) { onChange(""); return; }
    onChange(`${nomeMunicipio} - ${uf}`);
  }

  const municipios = municipiosCache[uf] || [];
  const municipioSelecionado = municipioDoValor ? (municipios.find(m => m.toUpperCase() === municipioDoValor.toUpperCase()) || "") : "";

  if (estadosErro) {
    return <CampoTexto type="text" value={value} onChange={onChange} placeholder="Ex: Curitiba - PR" />;
  }

  return (
    <div className="localidade-select">
      <select value={uf} onChange={e => selecionarUF(e.target.value)} disabled={!estados.length}>
        <option value="">{estados.length ? "Estado (UF)" : "Carregando estados..."}</option>
        {estados.map(e => <option key={e.sigla} value={e.sigla}>{e.nome}</option>)}
      </select>
      <select
        value={municipioSelecionado}
        onChange={e => selecionarMunicipio(e.target.value)}
        disabled={!uf || carregandoMunicipios || erroMunicipios}
      >
        <option value="">
          {!uf ? "Selecione o estado primeiro" : carregandoMunicipios ? "Carregando municípios..." : erroMunicipios ? "Falha ao carregar" : "Município"}
        </option>
        {municipios.map(m => <option key={m} value={m}>{m}</option>)}
      </select>
      {erroMunicipios && (
        <button type="button" className="file-btn" style={{ marginTop: 8 }} onClick={() => selecionarUF(uf)}>Tentar novamente</button>
      )}
    </div>
  );
}

function dadosRelatorioPreview(form, numeracaoAnexos) {
  const periodo = form.dataSaida && form.dataRetorno
    ? `${formatDateBR(form.dataSaida)} a ${formatDateBR(form.dataRetorno)}`
    : (formatDateBR(form.dataSaida) || formatDateBR(form.dataRetorno) || "—");
  const tipoViagem = form.tipoPrestacao === "viagem_nao_realizada"
    ? "Viagem não realizada"
    : (TRANSPORTES.find(t => t.id === form.transporte)?.label || "—");
  const cargoLinha = [form.cargoFuncao, form.siglaSetor].filter(Boolean).join(" — ");
  const tipoPrestacao = form.tipoPrestacao === "roteiro_reduzido" ? "ROTEIRO REDUZIDO" : form.tipoPrestacao === "roteiro_sem_alteracao" ? "ROTEIRO SEM ALTERAÇÃO" : form.tipoPrestacao === "viagem_nao_realizada" ? "VIAGEM NÃO REALIZADA" : "—";
  const transladosComArquivo = (form.translados || []).filter(t => t.arquivo);
  const totalTranslados = transladosComArquivo.reduce((a, t) => a + parseMoeda(t.valor), 0);
  const liberadoTranslado = parseMoeda(form.valorTransladoLiberado);
  const valorRetiradoTranslado = form.usouTranslado === "sim"
    ? (form.retiradaTransladoIntegral === "sim" ? liberadoTranslado : parseMoeda(form.valorTransladoRetirado))
    : form.usouTranslado === "nao"
      ? (form.movimentacaoTransladoSemUso === "integral" ? liberadoTranslado : form.movimentacaoTransladoSemUso === "parcial" ? parseMoeda(form.valorTransladoRetirado) : 0)
      : 0;
  const saldoTransladoDevolver = form.usouTranslado && form.valorTransladoLiberado
    ? Math.max(0, valorRetiradoTranslado - (form.usouTranslado === "sim" ? totalTranslados : 0))
    : 0;
  const resumoTranslado = form.usouTranslado && form.valorTransladoLiberado
    ? `${form.usouTranslado === "sim" ? "Utilizado" : "Não utilizado"} · Liberado: ${moedaBR(liberadoTranslado)} · Sacado/transferido: ${moedaBR(valorRetiradoTranslado)}${form.usouTranslado === "sim" ? ` · Comprovado: ${moedaBR(totalTranslados)}` : ""} · A devolver: ${moedaBR(saldoTransladoDevolver)}`
    : "";
  const comPag = (nome, docId, idx = 0) => {
    const p = numeracaoAnexos?.paginaPorDocId?.[docId]?.[idx];
    return p ? `${nome} — pág. ${p}` : nome;
  };
  const docsPreview = [];
  if (form.anexos?.solicitacao_veiculo?.length) docsPreview.push({ nome: comPag("Solicitação de veículo", "solicitacao_veiculo") });
  if (form.anexos?.diario_bordo?.length) docsPreview.push({ nome: comPag("Diário de bordo", "diario_bordo") });
  if (form.anexos?.embarque?.length) docsPreview.push({ nome: comPag("Cartão de embarque ou declaração de embarque", "embarque") });
  if (form.anexos?.bilhete?.length) docsPreview.push({ nome: comPag("Bilhete, BPE ou declaração de embarque", "bilhete") });
  if (form.anexos?.termo_ciencia?.length) docsPreview.push({ nome: comPag("Termo de Ciência e Responsabilidade", "termo_ciencia") });
  if (form.anexos?.saque?.length) docsPreview.push({ nome: comPag("Comprovante de saque ou transferência", "saque") });
  else if (form.saqueComprovante === "nao" && form.justificativas?.saque) docsPreview.push({ nome: "Justificativa registrada por não ter inserido o comprovante de saque/transferência", detalhe: form.justificativas.saque });
  if (respostaPossuiDoc(form, "solicitacao_veiculo") === "nao" && form.justificativas?.solicitacao_veiculo) docsPreview.push({ nome: "Justificativa registrada por não ter inserido a solicitação de veículo", detalhe: form.justificativas.solicitacao_veiculo });
  if (respostaPossuiDoc(form, "diario_bordo") === "nao" && form.justificativas?.diario_bordo) docsPreview.push({ nome: "Justificativa registrada por não ter inserido o diário de bordo", detalhe: form.justificativas.diario_bordo });
  if (form.anexos?.devolucao_roteiro?.length) docsPreview.push({ nome: comPag("Devolução de diária — roteiro reduzido", "devolucao_roteiro") });
  if (form.anexos?.devolucao_nao_realizada?.length) docsPreview.push({ nome: comPag("Comprovante de devolução do valor sacado ou transferido", "devolucao_nao_realizada") });
  if (transladosComArquivo.length) {
    const pSintese = numeracaoAnexos?.paginaSinteseTranslado;
    docsPreview.push({ nome: pSintese ? `Comprovantes de translado — pág. ${pSintese}` : "Comprovantes de translado", detalhe: `${transladosComArquivo.length} comprovante(s) — Total: ${moedaBR(totalTranslados)}` });
  }
  if (saldoTransladoDevolver > 0.009 && form.anexos?.devolucao_translado?.length) docsPreview.push({ nome: comPag("Devolução do saldo de translado", "devolucao_translado") });
  if (form.anexos?.comprobatorio?.length) docsPreview.push({ nome: comPag("Outros documentos comprobatórios", "comprobatorio") });
  const totalTransladoGasto = (form.translados || []).reduce((a, t) => a + parseMoeda(t.valor), 0);
  const saldoRoteiroDevolver = (form.tipoPrestacao === "roteiro_reduzido" && form.precisaDevolucao === "sim") ? parseMoeda(form.valorDevolucao) : 0;
  const valorNaoRealizadaDevolver = form.tipoPrestacao === "viagem_nao_realizada" ? parseMoeda(form.valorMovimentadoDiaria) : 0;
  const saldoADevolver = saldoRoteiroDevolver + saldoTransladoDevolver + valorNaoRealizadaDevolver;
  const atestoPreview = form.tipoPrestacao === "viagem_nao_realizada"
    ? "Atesto e certifico que a viagem autorizada não foi realizada, que a justificativa registrada neste documento corresponde aos fatos e que o valor sacado ou transferido da conta corporativa foi devolvido ao Estado, conforme os documentos anexados a esta prestação de contas, nos termos do Decreto Estadual n.º 6.358/2024."
    : "Atesto e certifico que as informações constantes no presente documento demonstram efetivamente a realização e a efetividade da viagem, e que os comprovantes de despesa anexos a esta prestação de contas foram efetivamente realizados no estrito interesse da administração pública, conforme o Decreto Estadual n.º 6.358/2024.";
  return { periodo, tipoViagem, cargoLinha, tipoPrestacao, docsPreview, atestoPreview, saldoADevolver, resumoTranslado };
}

// Converte o texto digitado pelo viajante em blocos semânticos.
// Linhas com marcador viram itens de lista; linhas comuns consecutivas
// formam um parágrafo. A mesma estrutura é usada na prévia e no PDF.
function criarBlocosTextoRelatorio(textoOriginal) {
  const texto = String(textoOriginal ?? "").replace(/\r/g, "").trim();
  if (!texto) return [{ tipo: "paragrafo", texto: "—" }];

  const blocos = [];
  let paragrafo = [];
  const descarregarParagrafo = () => {
    if (!paragrafo.length) return;
    blocos.push({ tipo: "paragrafo", texto: paragrafo.join(" ").replace(/\s+/g, " ").trim() });
    paragrafo = [];
  };

  texto.split("\n").forEach(linhaOriginal => {
    const linha = linhaOriginal.trim();
    if (!linha) {
      descarregarParagrafo();
      return;
    }

    const item = linha.match(/^([•●▪◦‣⁃*\-–—]|\d+[.)])\s*(.+)$/);
    if (item) {
      descarregarParagrafo();
      blocos.push({ tipo: "lista", marcador: item[1], texto: item[2].replace(/\s+/g, " ").trim() });
      return;
    }

    paragrafo.push(linha);
  });
  descarregarParagrafo();

  return blocos.length ? blocos : [{ tipo: "paragrafo", texto: "—" }];
}

          <div className="rp-resumo-item"><span className="rp-ri-icon"><Icon name="pin" size={15} /></span><span>Origem:</span><strong>{form.origem || "—"}</strong></div>
          <div className="rp-resumo-item rp-resumo-situacao">
            <div className="rp-situacao-head"><span className="rp-ri-icon"><Icon name="alvo" size={15} /></span><span>Situação do roteiro:</span></div>
            <span className={"rp-selo " + (form.tipoPrestacao === "roteiro_sem_alteracao" ? "ok" : "warn")}><Icon name="check" size={12} /> {d.tipoPrestacao}</span>
          </div>
          <div className="rp-resumo-item"><span className="rp-ri-icon"><Icon name="pin" size={15} /></span><span>Destino:</span><strong>{form.destino || "—"}</strong></div>
          <div className="rp-resumo-item"><span className="rp-ri-icon"><Icon name="calendario" size={15} /></span><span>Período:</span><strong>{d.periodo}</strong></div>
          {d.saldoADevolver > 0.009 && (
            <div className="rp-resumo-item"><span className="rp-ri-icon"><Icon name="doc" size={15} /></span><span>Saldo a devolver:</span><strong>{moedaBR(d.saldoADevolver)}</strong></div>
          )}
          {d.resumoTranslado && (
            <div className="rp-resumo-item" style={{ gridColumn: "1 / -1" }}><span className="rp-ri-icon"><Icon name="car" size={15} /></span><span>Translado:</span><strong>{d.resumoTranslado}</strong></div>
          )}
        </div>
      </div>

      {form.tipoPrestacao === "viagem_nao_realizada" ? (
        <>
          {secaoTexto("1", "JUSTIFICATIVA DA NÃO REALIZAÇÃO DA VIAGEM", "alert", form.justificativaNaoRealizada, "justificativaNaoRealizada")}
          {String(form.infoComplementares || "").trim() && secaoTexto("2", "INFORMAÇÕES COMPLEMENTARES", "info", form.infoComplementares, "infoComplementares")}
        </>

    </>

}

// ---- Lista de rascunhos deste navegador (tela "Minhas prestações") ----
const CHAVE_LISTA_RASCUNHOS = "prestacao:listaRascunhos";
function lerListaRascunhos() {
  try { return JSON.parse(localStorage.getItem(CHAVE_LISTA_RASCUNHOS)) || []; } catch (e) { return []; }
}
function gravarListaRascunhos(lista) {
  try { localStorage.setItem(CHAVE_LISTA_RASCUNHOS, JSON.stringify(lista)); } catch (e) {}
}
function atualizarRascunhoNaLista(tokenRascunho, dados) {
  if (!tokenRascunho) return;
  const lista = lerListaRascunhos();
  const i = lista.findIndex(r => r.token === tokenRascunho);
  const item = { ...(i >= 0 ? lista[i] : { token: tokenRascunho }), ...dados };
  if (i >= 0) lista[i] = item; else lista.unshift(item);
  lista.sort((a, b) => String(b.atualizadoEm || "").localeCompare(String(a.atualizadoEm || "")));
  gravarListaRascunhos(lista);
}

  gravarListaRascunhos(lerListaRascunhos().filter(r => r.token !== tokenRascunho));

  const url = new URL(window.location.href);
  url.searchParams.set("rascunho", tokenRascunho);
  window.location.href = url.toString();
}

function distanciaEntreToques(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

function PinchZoomViewer({ children, baseWidth = 700, ariaLabel = "Visualização do documento" }) {
  const viewportRef = useRef(null);
  const contentRef = useRef(null);
  const gestureRef = useRef(null);
  const fitScaleRef = useRef(1);
  const scaleRef = useRef(1);
  const [fitScale, setFitScale] = useState(1);
  const [scale, setScale] = useState(1);
  const [baseHeight, setBaseHeight] = useState(900);

  const aplicarEscala = useCallback((valor) => {
    const minimo = fitScaleRef.current;
    const proximo = Math.min(3, Math.max(minimo, valor));
    scaleRef.current = proximo;
    setScale(proximo);
  }, []);

  useLayoutEffect(() => {
    const viewport = viewportRef.current;
    const content = contentRef.current;
    if (!viewport || !content) return;

    const medir = () => {
      const estavaAjustado = Math.abs(scaleRef.current - fitScaleRef.current) < 0.04;
      const larguraDisponivel = Math.max(220, viewport.clientWidth - 12);
      const novoFit = Math.min(1, Math.max(0.28, larguraDisponivel / baseWidth));
      fitScaleRef.current = novoFit;
      setFitScale(novoFit);
      if (estavaAjustado) {
        scaleRef.current = novoFit;
        setScale(novoFit);
      } else if (scaleRef.current < novoFit) {
        scaleRef.current = novoFit;
        setScale(novoFit);
      }
      setBaseHeight(Math.max(200, content.scrollHeight || content.offsetHeight || 900));
    };

    medir();
    const observer = new ResizeObserver(medir);
    observer.observe(viewport);
    observer.observe(content);
    return () => observer.disconnect();
  }, [baseWidth]);

  const iniciarToque = (event) => {
    const viewport = viewportRef.current;
    if (!viewport) return;
    if (event.touches.length === 2) {
      event.preventDefault();
      gestureRef.current = {
        tipo: "pinch",
        distancia: distanciaEntreToques(event.touches),
        escala: scaleRef.current,
      };
    } else if (event.touches.length === 1) {
      gestureRef.current = {
        tipo: "pan",
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        left: viewport.scrollLeft,
        top: viewport.scrollTop,
      };
    }
  };

  const moverToque = (event) => {
    const viewport = viewportRef.current;
    const gesto = gestureRef.current;
    if (!viewport || !gesto) return;
    if (gesto.tipo === "pinch" && event.touches.length === 2) {
      event.preventDefault();
      const atual = distanciaEntreToques(event.touches);
      aplicarEscala(gesto.escala * (atual / Math.max(1, gesto.distancia)));
    } else if (gesto.tipo === "pan" && event.touches.length === 1) {
      event.preventDefault();
      viewport.scrollLeft = gesto.left - (event.touches[0].clientX - gesto.x);
      viewport.scrollTop = gesto.top - (event.touches[0].clientY - gesto.y);
    }
  };

  const encerrarToque = () => { gestureRef.current = null; };
  const ajustar = () => aplicarEscala(fitScaleRef.current);
  const percentual = Math.round((scale / Math.max(0.01, fitScale)) * 100);

  return (
    <div className="pinch-viewer">
      <div className="pinch-toolbar">
        <span className="pinch-hint">Use dois dedos para ampliar e arraste para navegar.</span>
        <div className="pinch-controls" aria-label="Controles de zoom">
          <button type="button" onClick={() => aplicarEscala(scaleRef.current - 0.18)} disabled={scale <= fitScale + 0.01} aria-label="Diminuir zoom">−</button>
          <button type="button" className="pinch-fit" onClick={ajustar}>Ajustar · {percentual}%</button>
          <button type="button" onClick={() => aplicarEscala(scaleRef.current + 0.18)} disabled={scale >= 2.99} aria-label="Aumentar zoom">+</button>
        </div>
      </div>
      <div
        ref={viewportRef}
        className="pinch-viewport"
        role="region"
        aria-label={ariaLabel}
        onTouchStart={iniciarToque}
        onTouchMove={moverToque}
        onTouchEnd={encerrarToque}
        onTouchCancel={encerrarToque}
      >
        <div className="pinch-stage" style={{ width: baseWidth * scale, height: baseHeight * scale }}>
          <div ref={contentRef} className="pinch-content" style={{ width: baseWidth, transform: `scale(${scale})` }}>
            {children}
          </div>
        </div>
      </div>
    </div>
  );
}

          try {

  const MAX_ANEXO_BYTES = 8 * 1024 * 1024;

  async function persistFile(fileId, dataUrl) {
    if (!key || !storageDisponivel) return { sucesso: false, motivo: "armazenamento_indisponivel" };
    try {
      await DraftDB.set(`${key}:arquivo:${fileId}`, dataUrl);
      return { sucesso: true };
    } catch (e) {
      return { sucesso: false, motivo: "falha_armazenamento" };
    }
  }
  async function persistFileComAviso(fileId, dataUrl) {
    const resultado = await persistFile(fileId, dataUrl);
    if (!resultado.sucesso) {
      setAvisoArmazenamento("Não foi possível salvar um arquivo anexado neste navegador. Ele continua visível nesta sessão, mas pode se perder se a página for fechada. Baixe o rascunho (arquivo .json) como segurança antes de continuar.");
    }
    return resultado;
  }
  async function deleteFileContent(fileId) {
    if (key && storageDisponivel) {
      try { await DraftDB.delete(`${key}:arquivo:${fileId}`); } catch (e) { /* ignora */ }
    }
  }
  async function excluirConteudosArquivos(ids) {
    const idsValidos = [...new Set((ids || []).filter(Boolean))];
    if (!idsValidos.length) return;
    await Promise.allSettled(idsValidos.map(id => deleteFileContent(id)));
    setAnexosContent(atual => {
      const novo = { ...atual };
      idsValidos.forEach(id => delete novo[id]);
      return novo;
    });
  }
  function coletarIdsAnexos(anexos, translados) {
    const ids = [];
    Object.values(anexos || {}).forEach(lista => (lista || []).forEach(f => f && f.id && ids.push(f.id)));
    (translados || []).forEach(t => { if (t && t.arquivo && t.arquivo.id) ids.push(t.arquivo.id); });
    return ids;
  }

  async function attachFiles(docId, fileList) {
    setFileWarnings(w => ({ ...w, [docId]: null }));
    const files = Array.from(fileList || []);
    const paraFila = [];
    for (const file of files) {
      try {
        const resultado = await lerArquivoCorrigido(file);
        if (resultado.tamanho > MAX_ANEXO_BYTES) {
          setFileWarnings(w => ({ ...w, [docId]: `"${file.name}" continua muito grande mesmo após o ajuste automático (máx. ~8 MB). Tente tirar a foto com menos zoom ou em melhor iluminação.` }));
          continue;
        }
        const dataUrl = resultado.dataUrl;
        const fileId = uid();
        setAnexosContent(prev => ({ ...prev, [fileId]: dataUrl }));
        const metaBase = { id: fileId, nome: file.name, tamanho: resultado.tamanho, tipo: resultado.comprimida ? "image/jpeg" : file.type };
        // O arquivo só é gravado no rascunho e entra em form.anexos quando a
        // pessoa clicar em "Concluir e aplicar" no editor. Se cancelar, some
        // sem deixar vestígio — nem no relatório, nem no armazenamento local.
        paraFila.push({
          meta: metaBase, dataUrl,
          applySave: (newDataUrl, newMeta) => {
            const metaFinal = { ...metaBase, ...newMeta };
            setAnexosContent(prev => ({ ...prev, [fileId]: newDataUrl }));
            persistFileComAviso(fileId, newDataUrl);
            setForm(f => ({ ...f, anexos: { ...f.anexos, [docId]: [...(f.anexos[docId] || []), metaFinal] } }));
          },
          applyCancel: () => {
            setAnexosContent(prev => { const n = { ...prev }; delete n[fileId]; return n; });
          },
        });
      } catch (e) {
        setFileWarnings(w => ({ ...w, [docId]: `Não foi possível ler "${file.name}".` }));
      }
    }
    if (paraFila.length) {
      setEditQueue(q => [...q, ...paraFila]);
    }
  }

  function dataBRparaISO(valor) {
    const m = String(valor || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : "";
  }

  function limparTextoExtraido(texto) {
    return String(texto || "").replace(/\s+/g, " ").trim();
  }

  function extrairEntre(texto, inicio, fim) {
    const i = texto.toUpperCase().indexOf(inicio.toUpperCase());
    if (i < 0) return "";
    const parte = texto.slice(i + inicio.length);
    const f = fim ? parte.toUpperCase().indexOf(fim.toUpperCase()) : -1;
    return limparTextoExtraido(f >= 0 ? parte.slice(0, f) : parte);
  }

  function mapearTransporteSCV(texto) {
    const t = texto.toUpperCase();
    if (t.includes("AÉREO") || t.includes("AEREO")) return "aereo";
    if (t.includes("ÔNIBUS") || t.includes("ONIBUS") || t.includes("BPE")) return "onibus";
    if (t.includes("VEÍCULO") && t.includes("OFICIAL") || t.includes("VEICULO") && t.includes("OFICIAL")) return "veiculo_oficial";
    if (t.includes("MEIOS PRÓPRIOS") || t.includes("MEIOS PROPRIOS")) return "meios_proprios";
    return "";
  }

  function reconstruirLinhasPdf(items) {
    const linhas = [];
    const toleranciaY = 3.5;
    (items || []).forEach(item => {
      const str = String(item.str || "").trim();
      if (!str) return;
      const transform = item.transform || [];
      const x = Number(transform[4] || 0);
      const y = Number(transform[5] || 0);
      let linha = linhas.find(l => Math.abs(l.y - y) <= toleranciaY);
      if (!linha) {
        linha = { y, itens: [] };
        linhas.push(linha);
      }
      linha.itens.push({ x, str });
    });
    return linhas
      .sort((a, b) => b.y - a.y)
      .map(l => l.itens.sort((a, b) => a.x - b.x).map(i => i.str).join(" ").replace(/\s+/g, " ").trim())
      .filter(Boolean)
      .join("\n");
  }

  function interpretarTextoSCV(textoOriginal) {
    const bruto = String(textoOriginal || "");
    const linhas = bruto.split(/\r?\n/).map(limparTextoExtraido).filter(Boolean);
    const texto = linhas.join(" ");

    const secaoViajante = (texto.match(/(?:^|\s)Viajante\s+([\s\S]*?)(?:\s+Planejamento da Viagem\s+|$)/i) || [])[1] || texto;
    const planejamento = (texto.match(/Planejamento da Viagem\s+([\s\S]*?)(?:\s+Roteiro\s+|$)/i) || [])[1] || texto;
    const roteiro = (texto.match(/Roteiro\s+([\s\S]*?)(?:\s+Informações Adicionais\s+|$)/i) || [])[1] || "";

    const numero = (texto.match(/Número:\s*([0-9./-]+)/i) || [])[1] || "";
    const nome = (secaoViajante.match(/(?:^|\s)Nome:\s*(.*?)\s+RG:/i) || [])[1] || "";
    const cargo = (secaoViajante.match(/(?:^|\s)Cargo:\s*(.*?)\s+Órgão:/i) || [])[1] || "";
    const chefia = (secaoViajante.match(/Chefia imediata:\s*(.*?)(?:\s+Planejamento da Viagem|$)/i) || [])[1] || "";

    const tipoViagemScv = (planejamento.match(/Tipo:\s*(.*?)\s+Período do evento:/i) || [])[1] || "";
    const periodoEvento = planejamento.match(/Período do evento:\s*(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})\s+a\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/i) || [];
    const nomeAtividade = (planejamento.match(/Nome:\s*(.*?)\s+Descrição:/i) || [])[1] || "";
    const descricao = (planejamento.match(/Descrição:\s*(.*?)\s+Local:/i) || [])[1] || "";
    const localEvento = (planejamento.match(/Local:\s*(.*?)\s+Telefone:/i) || [])[1] || "";

    function limparCidadeCandidata(valor) {
      let cidade = limparTextoExtraido(valor);
      const partes = cidade.split(/\s+/);
      const primeiroComMinuscula = partes.findIndex(p => /[a-zà-ÿ]/.test(p));
      if (primeiroComMinuscula >= 0) cidade = partes.slice(primeiroComMinuscula).join(" ");
      for (let i = 0; i < 3; i++) {
        cidade = cidade.replace(/^(?:SAÍDA|SAIDA|CHEGADA|CIDADE|DATA(?:\/HORA)?|HORA|ROTEIRO|MEIO|DE|TRANSPORTE)\s+/i, "");
      }
      return cidade.trim();
    }

    const regexCidade = /((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]*|(?:de|do|da|dos|das|e))(?:\s+(?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]*|de|do|da|dos|das|e))*)\/([A-Z]{2})\b/g;
    const candidatosCidade = [...roteiro.matchAll(regexCidade)]
      .map(m => limparCidadeCandidata(`${m[1]}/${m[2]}`))
      .filter(v => /^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]*\/[A-Z]{2}$/.test(v));
    const cidades = candidatosCidade.filter((v, i, a) => a.findIndex(x => x.toUpperCase() === v.toUpperCase()) === i);

    // No roteiro do SCV, o primeiro município é a saída inicial. Os demais (podem ser várias paradas)
    // formam o destino — juntamos todos, já que escolher "a mais longe" seria ambíguo e pouco confiável.
    const origem = cidades[0] ? paraNomeProprio(cidades[0].replace("/", " - ").toUpperCase()) : "";
    const destinoRoteiro = cidades.length > 1
      ? cidades.slice(1).map(c => paraNomeProprio(c.replace("/", " - ").toUpperCase())).join(", ")
      : "";
    const destinoLocal = localEvento ? paraNomeProprio(limparTextoExtraido(localEvento).toUpperCase()) : "";

    // A primeira data do roteiro é a saída; a última é o retorno ao município de origem.
    const datasRoteiro = [...roteiro.matchAll(/\b(\d{2}\/\d{2}\/\d{4})\b/g)].map(m => m[1]);
    const dataSaidaRoteiro = datasRoteiro[0] || "";
    const dataRetornoRoteiro = datasRoteiro[datasRoteiro.length - 1] || "";

    return {
      numeroSolicitacao: numero,
      nomeViajante: paraNomeProprio(limparTextoExtraido(nome).toUpperCase()),
      cargoFuncao: "",
      chefiaImediataScv: paraNomeProprio(limparTextoExtraido(chefia).toUpperCase()),
      origem,
      destino: destinoRoteiro || destinoLocal,
      dataSaida: dataBRparaISO(dataSaidaRoteiro || periodoEvento[1]),
      dataRetorno: dataBRparaISO(dataRetornoRoteiro || periodoEvento[3]),
      nomeEvento: paraFrase(limparTextoExtraido(descricao || nomeAtividade).toUpperCase()),
      nomeAtividadeScv: paraFrase(limparTextoExtraido(nomeAtividade).toUpperCase()),
      tipoViagemScv: paraFrase(limparTextoExtraido(tipoViagemScv).toUpperCase()),
      localEventoScv: paraNomeProprio(limparTextoExtraido(localEvento).toUpperCase()),
      periodoEventoScv: periodoEvento.length ? `${periodoEvento[1]} ${periodoEvento[2]} a ${periodoEvento[3]} ${periodoEvento[4]}` : "",
      transporte: mapearTransporteSCV(roteiro || texto),
    };
  }

  async function importarSolicitacaoSCV(origem) {
    const recebidoComoArquivo = typeof File !== "undefined" && origem instanceof File;
    const input = recebidoComoArquivo ? null : origem?.target;
    const file = recebidoComoArquivo ? origem : (input?.files && input.files[0]);
    if (input) input.value = "";
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") {
      setScvErro("Selecione o PDF gerado pelo Sistema da Central de Viagens.");
      return;
    }
    setScvExtraindo(true);
    setScvErro("");
    setScvNaoRealizada(false);
    try {
      const dataUrl = await readFileAsDataURL(file);
      const fileId = uid();
      setAnexosContent(prev => ({ ...prev, [fileId]: dataUrl }));
      persistFileComAviso(fileId, dataUrl);
      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await window.pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
      const partes = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        partes.push(reconstruirLinhasPdf(content.items));
      }
      const extraidos = interpretarTextoSCV(partes.join("\n"));
      setDadosScv(extraidos);
      const idAnterior = form.scvArquivo?.id;
      if (idAnterior && idAnterior !== fileId) excluirConteudosArquivos([idAnterior]);
      setForm(f => ({ ...f, scvArquivo: { id:fileId, nome:file.name, tipo:file.type, tamanho:file.size }, scvImportado:true, dadosScvConfirmados:false }));
      setScvEtapaModal(1);
      setScvModal(true);
    } catch (e) {
      setScvErro("Não foi possível ler o PDF. Tente novamente com o arquivo original do Sistema da Central de Viagens.");
    } finally {
      setScvExtraindo(false);
    }
  }

  function soltarPdfScv(event) {
    event.preventDefault();
    event.stopPropagation();
    setScvDragAtivo(false);
    const arquivos = Array.from(event.dataTransfer?.files || []);
    const arquivo = arquivos.find(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    if (!arquivo) {
      setScvErro("Arraste o PDF da solicitação de viagem gerado pelo Sistema da Central de Viagens.");
      return;
    }
    importarSolicitacaoSCV(arquivo);
  }

  function aplicarDadosScv(confirmados) {
    if (!dadosScv || !form.tipoPrestacao) return;
    // Se a viagem não ocorreu e não houve saque/recebimento da diária, este
    // sistema não deve abrir uma prestação: o caso é finalizado no SCV.
    if (form.tipoPrestacao === "viagem_nao_realizada" && form.sacouDiaria !== "sim") return;
    setForm(f => ({
      ...f,
      ...Object.fromEntries(Object.entries(dadosScv).filter(([,v]) => !!v)),
      scvImportado:true,
      dadosScvConfirmados:confirmados,
      precisaDevolucao: form.tipoPrestacao === "roteiro_reduzido" ? "" : "nao",
    }));
    setScvModal(false);
