  async function gerarPDF(opcoes = {}) {
    const modoPreview = !!opcoes.modoPreview;
    if (modoPreview) {
      setPreviewErro("");
      setPreviewGerando(true);
    } else {
      setPdfErro(null);
      setPdfAviso(null);
      setGerando(true);
    }
    if (!(window.jspdf && window.jspdf.jsPDF)) {
      const mensagem = "A biblioteca de geração de PDF ainda não carregou. Verifique sua conexão e tente novamente em instantes.";
      if (modoPreview) setPreviewErro(mensagem);
      else setPdfErro(mensagem);
      if (modoPreview) setPreviewGerando(false);
      else setGerando(false);
      return;
    }
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });

      // Assets institucionais ficam em arquivos separados para reduzir o HTML.
      // O jsPDF recebe os elementos de imagem já carregados, preservando a geração
      // do PDF sem voltar a embutir as imagens em Base64 no código-fonte.
      const [detranLogoPdf, paranaLogoPdf] = await Promise.all([
        loadImageEl(DETRAN_LOGO).catch(() => null),
        loadImageEl(PARANA_LOGO).catch(() => null),
      ]);
      const avisosPdf = []; // qualquer coisa aqui vira aviso visível — nada falha calado
      function registrarAvisoPdf(mensagem) {
        if (!avisosPdf.includes(mensagem)) avisosPdf.push(mensagem);
      }
      const PAGE_W = 595.28, PAGE_H = 841.89;
      const margin = 48;
      const contentW = PAGE_W - margin * 2;

      // Paleta institucional (DETRAN/PR)
      let y = 0;

      if (!window.html2canvas) throw new Error("Gerador visual indisponível");

      // ---- Páginas de comprovante (uma para cada arquivo anexado) ----
      async function obterPaginasComoImagens(meta, contentDataUrl) {
        const nomeArquivo = (meta.nome || "").toLowerCase();
        const isPdf = meta.tipo === "application/pdf" || nomeArquivo.endsWith(".pdf");
        if (!isPdf) {
          // Fotos de celular podem ter 10+ MB; reduzimos para no máx. 1600px e JPEG
          // comprimido — qualidade mais que suficiente para leitura, arquivo muito menor.
          try {
            const img = await loadImageEl(contentDataUrl);
            const maxDim = 1600;
            const escala = Math.min(1, maxDim / Math.max(img.width, img.height));
            const cnv = document.createElement("canvas");
            cnv.width = Math.round(img.width * escala);
            cnv.height = Math.round(img.height * escala);
            const ctx = cnv.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, cnv.width, cnv.height);
            ctx.drawImage(img, 0, 0, cnv.width, cnv.height);
            return [cnv.toDataURL("image/jpeg", 0.85)];
          } catch (e) {
            return [contentDataUrl];
          }
        }
        if (!window.pdfjsLib) throw new Error("Leitor de PDF indisponível");
        const bytes = dataUrlToBytes(contentDataUrl);
        const pdfDoc = await window.pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
        const paginas = [];
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const pagina = await pdfDoc.getPage(i);
          const viewport = pagina.getViewport({ scale: 1.5 });
          const cnv = document.createElement("canvas");
          cnv.width = viewport.width;
          cnv.height = viewport.height;
          const ctx = cnv.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, cnv.width, cnv.height);
          await pagina.render({ canvasContext: ctx, viewport }).promise;
          paginas.push(cnv.toDataURL("image/jpeg", 0.85));
        }
        return paginas;
      }

      // ---- Preparar anexos (converte cada arquivo em imagens de página) ----
      const anexosPreparados = [];
      async function prepararDocs(listaDocs) {
        for (const d of listaDocs) {
          const arquivos = form.anexos[d.id] || [];
          for (let i = 0; i < arquivos.length; i++) {
            const meta = arquivos[i];
            const titulo = arquivos.length > 1 ? `${d.nome} (${i + 1}/${arquivos.length})` : d.nome;
            let imagens = [];
            if (anexosContent[meta.id]) {
              try { imagens = await obterPaginasComoImagens(meta, anexosContent[meta.id]); } catch (e) { imagens = []; }
            }
            anexosPreparados.push({ tipo: "doc", docId: d.id, titulo, imagens, redigido: !!meta.redigido });
          }
        }
      }
      await prepararDocs(docs.filter(d => d.id !== "comprobatorio" && d.id !== "devolucao_translado"));
      const transladosParaAnexar = (mostraTranslado && form.usouTranslado === "sim") ? translados.filter(t => t.arquivo) : [];
      if (transladosParaAnexar.length) {
        const itens = [];
        for (const t of transladosParaAnexar) {
          let imgs = [];
          if (anexosContent[t.arquivo.id]) {
            try { imgs = await obterPaginasComoImagens(t.arquivo, anexosContent[t.arquivo.id]); } catch (e) { imgs = []; }
          }
          itens.push({ de: rotuloLocalTranslado(t, "de"), para: rotuloLocalTranslado(t, "para"), data: t.data, valor: t.valor, imagens: imgs, redigido: !!t.arquivo.redigido });
        }
        // Mais antigo primeiro — mesma ordem no relatório sintético e nas páginas físicas
        itens.sort((a, b) => (a.data || "9999") < (b.data || "9999") ? -1 : (a.data || "9999") > (b.data || "9999") ? 1 : 0);
        anexosPreparados.push({ tipo: "translados", itens });
      }
      await prepararDocs(docs.filter(d => d.id === "devolucao_translado"));
      await prepararDocs(docs.filter(d => d.id === "comprobatorio"));

      const totalAnexosPdf = anexosPreparados.length;
      let totalPaginasAnexos = 0;
      anexosPreparados.forEach(a => {
        if (a.tipo === "doc") totalPaginasAnexos += Math.max(1, a.imagens.length);
        else totalPaginasAnexos += a.itens.reduce((acc, t) => acc + Math.max(1, Math.ceil((t.imagens.length || 1) / 2)), 0) + 1;
      });

      // Em que página cada anexo começa, para a página 1 poder mostrar "pág. X"
      // no checklist e no relatório sintético do translado. Como só sabemos
      // quantas páginas o relatório técnico vai ocupar DEPOIS de montá-lo, essa
      // função é chamada de novo (rápido — é só contagem) se a suposição inicial
      // de 1 página não se confirmar.
      // Quantas linhas de tabela cabem numa página do relatório sintético —
      // usada tanto para desenhar quanto para numerar (mesma conta nos dois
      // lugares, pra nunca desalinhar o número de página mostrado na página 1).
      const ALTURA_LINHA_SINTESE = 22;
      const OFFSET_TABELA_SINTESE = 101.5 + 56 + 20 + 24 + 6; // cabeçalho + card de totais + espaço + cabeçalho da tabela
      function linhasPorPaginaSintese(primeira) {
        const disponivel = (primeira ? PAGE_H - OFFSET_TABELA_SINTESE : PAGE_H - 101.5 - 24 - 6) - 76;
        return Math.max(1, Math.floor(disponivel / ALTURA_LINHA_SINTESE));
      }
      function paginasNecessariasSintese(qtdItens) {
        const primeira = linhasPorPaginaSintese(true);
        if (qtdItens <= primeira) return 1;
        const seguintes = linhasPorPaginaSintese(false);
        return 1 + Math.ceil((qtdItens - primeira) / seguintes);
      }

      function calcularNumeracaoAnexos(paginaInicialAnexos) {
        let pagina = paginaInicialAnexos;
        const paginaPorDocId = {};
        let paginaSinteseTranslado = null;
        let paginasTranslado = [];
        anexosPreparados.forEach(a => {
          if (a.tipo === "doc") {
            if (!paginaPorDocId[a.docId]) paginaPorDocId[a.docId] = [];
            paginaPorDocId[a.docId].push(pagina);
            pagina += Math.max(1, a.imagens.length);
          } else {
            paginaSinteseTranslado = pagina;
            pagina += paginasNecessariasSintese(a.itens.length);
            paginasTranslado = a.itens.map(() => 0);
            a.itens.forEach((t, i) => {
              paginasTranslado[i] = pagina;
              pagina += Math.max(1, Math.ceil((t.imagens.length || 1) / 2));
            });
          }
        });
        return { paginaPorDocId, paginaSinteseTranslado, paginasTranslado };
      }

      // ---- Moldura única (cabeçalho/rodapé) usada em toda página do PDF ----
      let paginaPdfAtual = 0; // incrementado a cada cabecalhoAnexo()
      let totalPaginasPdf = 0; // definido mais abaixo, depois de medir o relatório

      // Paleta aproximada do layout aprovado
      const MX = {
        navy: [2, 53, 110],
        verdeIcone: [63, 155, 47],
        verdeVivo: [100, 183, 69],
        verdeClaro: [243, 250, 238],
        verdeBorda: [191, 224, 174],
        verdeTexto: [44, 110, 28],
        verdeValor: [44, 138, 18],
        cinzaFundo: [242, 244, 246],
        cinzaBorda: [227, 232, 236],
        texto: [49, 66, 79],
        cinzaTxt: [106, 119, 130],
        azulPill: [0, 81, 134],
        azulPillFundo: [238, 244, 250],
        azulPillBorda: [216, 230, 242],
      };

      function desenharBarraMesclada(x, yBarra, largura, altura, azulAte = 0.74, verdeDesde = 0.86) {
        const azul = MX.navy;
        const verde = MX.verdeVivo;
        const inicio = x + largura * azulAte;
        const fim = x + largura * verdeDesde;
        const raio = altura / 2;

        doc.setFillColor(...azul);
        doc.roundedRect(x, yBarra, largura, altura, raio, raio, "F");

        const passos = 28;
        const passoW = Math.max(0.3, (fim - inicio) / passos);
        for (let i = 0; i < passos; i++) {
          const t = i / Math.max(1, passos - 1);
          const cor = azul.map((valor, indice) => Math.round(valor + (verde[indice] - valor) * t));
          doc.setFillColor(...cor);
          doc.rect(inicio + i * passoW, yBarra, passoW + 0.35, altura, "F");
        }

        doc.setFillColor(...verde);
        doc.rect(fim, yBarra, Math.max(0, x + largura - fim - raio), altura, "F");
        doc.circle(x + largura - raio, yBarra + raio, raio, "F");
      }

      function cabecalhoAnexo(criarNovaPagina = true) {
        if (criarNovaPagina) doc.addPage();
        paginaPdfAtual += 1;
        const logoY = 30;
        const detranH = 30, detranW = detranH / (575 / 2123);
        const paranaH = 33, paranaW = paranaH * (273 / 320); // proporção real da logo atual (273x320px)
        try {
          if (!detranLogoPdf) throw new Error("Logo DETRAN indisponível");
          doc.addImage(detranLogoPdf, "PNG", margin, logoY, detranW, detranH);
        } catch (e) {
          registrarAvisoPdf("A logo do DetranPR não pôde ser inserida no cabeçalho.");
        }
        try {
          if (!paranaLogoPdf) throw new Error("Logo Paraná indisponível");
          doc.addImage(paranaLogoPdf, "PNG", PAGE_W - margin - paranaW, logoY + (detranH - paranaH) / 2, paranaW, paranaH);
        } catch (e) {
          registrarAvisoPdf("A logo do Governo do Paraná não pôde ser inserida no cabeçalho.");
        }
        const barY = logoY + detranH + 14;
        desenharBarraMesclada(margin, barY, contentW, 3.5, 0.74, 0.86);
        y = barY + 3.5 + 24;
      }

      function desenharIconeCarroBranco(cx, cy, s) {
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cx - s * 0.30, cy - s * 0.28, s * 0.60, s * 0.26, s * 0.07, s * 0.07, "F");
        doc.roundedRect(cx - s * 0.46, cy - s * 0.10, s * 0.92, s * 0.30, s * 0.07, s * 0.07, "F");
        doc.circle(cx - s * 0.24, cy + s * 0.30, s * 0.10, "F");
        doc.circle(cx + s * 0.24, cy + s * 0.30, s * 0.10, "F");
      }

      function desenharIconeDocBranco(cx, cy, s) {
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cx - s * 0.26, cy - s * 0.36, s * 0.52, s * 0.72, s * 0.05, s * 0.05, "F");
        doc.setDrawColor(...MX.verdeIcone);
        doc.setLineWidth(1.3);
        for (let li = -1; li <= 1; li++) doc.line(cx - s * 0.14, cy + li * s * 0.15, cx + s * 0.14, cy + li * s * 0.15);
      }

      function tituloAnexo(numero, titulo, tipoIcone) {
        const boxS = 38;
        doc.setFillColor(...MX.verdeIcone);
        doc.roundedRect(margin, y, boxS, boxS, 10, 10, "F");
        if (tipoIcone === "carro") desenharIconeCarroBranco(margin + boxS / 2, y + boxS / 2, 22);
        else desenharIconeDocBranco(margin + boxS / 2, y + boxS / 2, 21);
        const tx = margin + boxS + 13;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(...MX.verdeIcone);
        doc.text(`ANEXO ${String(numero).padStart(2, "0")}`, tx, y + 14);
        doc.setTextColor(...MX.navy);
        const larguraDisponivel = contentW - boxS - 13;
        const textoTitulo = String(titulo || "").toUpperCase();
        const tamanhoFonte = 14; // tamanho fixo — igual em todos os anexos, nunca encolhe
        doc.setFont("helvetica", "bold");
        doc.setFontSize(tamanhoFonte);
        // Se não couber numa linha só, quebra em quantas linhas forem
        // necessárias (em vez de diminuir a fonte) — assim todo título de
        // anexo sai do mesmo tamanho, curto ou longo.
        const linhasTitulo = doc.getTextWidth(textoTitulo) > larguraDisponivel
          ? doc.splitTextToSize(textoTitulo, larguraDisponivel)
          : [textoTitulo];
        const linhaAltura = tamanhoFonte + 3;
        linhasTitulo.forEach((linha, i) => doc.text(linha, tx, y + 32 + i * linhaAltura));
        const alturaConteudo = linhasTitulo.length > 1 ? (32 + (linhasTitulo.length - 1) * linhaAltura + 10) : boxS;
        y += Math.max(boxS, alturaConteudo) + 16;
      }

      function pilulaDadosOcultados(baseY) {
        const txt = "Documento com dados pessoais ocultados para publicação.";
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        const tw = doc.getTextWidth(txt);
        const pw = tw + 48, ph = 24;
        const px = (PAGE_W - pw) / 2;
        doc.setFillColor(...MX.azulPillFundo);
        doc.setDrawColor(...MX.azulPillBorda);
        doc.setLineWidth(1);
        doc.roundedRect(px, baseY, pw, ph, 9, 9, "FD");
        doc.setDrawColor(...MX.azulPill);
        doc.setLineWidth(1.1);
        doc.circle(px + 17, baseY + ph / 2, 6, "S");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(...MX.azulPill);
        doc.text("i", px + 17, baseY + ph / 2 + 2.6, { align: "center" });
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.text(txt, px + 30, baseY + ph / 2 + 3.2);
      }

      function rodapePaginaAnexo() {
        const linhaY = PAGE_H - 40;
        desenharBarraMesclada(margin, linhaY - 17, contentW, 2.2, 0.74, 0.86);

        const segmentos = [
          "DETRAN/PR",
          "Sistema de Prestação de Contas de Viagem",
          `Solicitação: ${form.numeroSolicitacao || "—"}`,
          `Página ${paginaPdfAtual} de ${totalPaginasPdf}`,
        ];
        const pesos = [0.7, 2.6, 1.5, 0.9];
        const somaPesos = pesos.reduce((a, b) => a + b, 0);
        doc.setFontSize(8);
        let xAtual = margin;
        segmentos.forEach((texto, i) => {
          const colW = (contentW * pesos[i]) / somaPesos;
          if (i > 0) {
            doc.setTextColor(...MX.cinzaTxt);
            doc.text("|", xAtual, linhaY);
          }
          doc.setFont("helvetica", i === 0 ? "bold" : "normal");
          doc.setTextColor(...(i === 0 ? MX.texto : MX.cinzaTxt));
          doc.text(texto, xAtual + colW / 2, linhaY, { align: "center" });
          xAtual += colW;
        });
        // (a barra grossa de baixo foi removida — a faixa fina acima do texto já identifica a página)
      }
      // ---- Corpo do relatório técnico: modelo HÍBRIDO. ----
      // O visual (RESUMO DA VIAGEM e DECLARAÇÃO DO VIAJANTE, com todos os
      // ícones e cores originais) é uma foto fiel da tela, exatamente como
      // sempre foi — porque esses trechos não precisam ser copiados.
      // Só os 4 campos que o solicitante realmente precisa copiar
      // (Descrição, Objetivo, Conclusão, Informações complementares) são
      // desenhados como texto de verdade (jsPDF), dentro de um card com
      // borda cinza igual ao design original — título em cima, texto
      // justificado embaixo, sem nunca ultrapassar a borda.
      const PX_POR_PT = 794 / PAGE_W;

      // Captura, uma única vez, as duas peças que continuam sendo "foto":
      // RESUMO DA VIAGEM e DECLARAÇÃO DO VIAJANTE + assinatura.
      async function capturarPecasVisuais() {
        const larguraCorpoPx = Math.round(contentW * PX_POR_PT);
        const container = document.createElement("div");
        container.style.cssText = `position:fixed;left:-12000px;top:0;width:${larguraCorpoPx}px;background:#ffffff;z-index:-1;`;
        document.body.appendChild(container);
        const raiz = ReactDOM.createRoot(container);
        raiz.render(<div className="rp-captura"><RelatorioBlocos form={form} numeracaoAnexos={numeracaoAnexos} /></div>);
        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 70)));
        const imagensImg = Array.from(container.querySelectorAll("img"));
        await Promise.all(imagensImg.map(im => im.complete ? Promise.resolve() : new Promise(res => { im.onload = im.onerror = res; })));

        const resumoEl = container.querySelectorAll(".rp-card")[0];
        const declEl = container.querySelector(".rp-decl-assin");

        async function capturar(el) {
          if (!el) return null;
          const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
          return { dataUrl: canvas.toDataURL("image/jpeg", 0.94), alturaPt: contentW * (canvas.height / canvas.width) };
        }
        const [resumo, declaracao] = await Promise.all([capturar(resumoEl), capturar(declEl)]);
        raiz.unmount();
        container.remove();
        return { resumo, declaracao };
      }

      function desenharCorpoRelatorio(numeracaoAnexos, somenteContar, pecasVisuais) {
        const d = dadosRelatorioPreview(form, numeracaoAnexos);
        const Y_TOPO_PAGINA = 101.5; // mesmo valor que cabecalhoAnexo() produz
        const RODAPE_RESERVA = 72;
        let paginasRelatorio = 1;
        const corTexto = MX.texto; // #31424f — mesma cor do corpo de texto na tela
        const corTitulo = [1, 58, 97]; // --azul-escuro — mesma cor exata da aba "RESUMO DA VIAGEM"
        const corAzulNum = [0, 81, 134]; // --azul — cor da numeração da lista de documentos
        const corVerdeTint = [238, 246, 234]; // --verde-tint — fundo claro do selo de check
        const corVerdeSecao = [44, 90, 28]; // --verde
        const corKicker = [58, 163, 53]; // verde do "PRESTAÇÃO DE CONTAS"
        const corLinha = [215, 222, 220]; // --linha (borda cinza dos cards)

        function espacoRestante() { return (PAGE_H - RODAPE_RESERVA) - y; }

        function novaPagina() {
          if (!somenteContar) {
            rodapePaginaAnexo();
            cabecalhoAnexo(true);
          } else {
            y = Y_TOPO_PAGINA;
          }
          paginasRelatorio += 1;
        }

        function garantirEspacoBloco(altura) {
          if (espacoRestante() < altura) novaPagina();
        }

        function colocarImagem(peca) {
          if (!peca) return;
          garantirEspacoBloco(Math.min(peca.alturaPt, PAGE_H - RODAPE_RESERVA - Y_TOPO_PAGINA));
          if (!somenteContar) doc.addImage(peca.dataUrl, "JPEG", margin, y, contentW, peca.alturaPt);
          y += peca.alturaPt;
        }

        // ---- Texto copiável do relatório: justificação nativa e segura ----
        // Parágrafos narrativos usam o alinhamento nativo do jsPDF, com recuo
        // de primeira linha. A última linha e linhas muito curtas ficam à esquerda.
        // Listas nunca são justificadas e mantêm recuo suspenso.
        function quebrarParagrafoComRecuo(texto, largura, recuo, justificar) {
          const palavras = String(texto || "—").trim().split(/\s+/).filter(Boolean);
          if (!palavras.length) return [{ texto: "—", xOffset: recuo, justificar: false }];

          let linhas = [];
          if (!recuo) {
            linhas = doc.splitTextToSize(palavras.join(" "), largura).map(textoLinha => ({ texto: textoLinha, xOffset: 0 }));
          } else {
            const larguraPrimeira = Math.max(40, largura - recuo);
            let primeira = "";
            let indice = 0;
            while (indice < palavras.length) {
              const tentativa = primeira ? `${primeira} ${palavras[indice]}` : palavras[indice];
              if (primeira && doc.getTextWidth(tentativa) > larguraPrimeira) break;
              primeira = tentativa;
              indice += 1;
            }
            if (!primeira) {
              primeira = palavras[0];
              indice = 1;
            }
            linhas.push({ texto: primeira, xOffset: recuo });
            const restante = palavras.slice(indice).join(" ");
            if (restante) doc.splitTextToSize(restante, largura).forEach(textoLinha => linhas.push({ texto: textoLinha, xOffset: 0 }));
          }

          return linhas.map((linha, indiceLinha) => ({
            ...linha,
            justificar: !!justificar
              && indiceLinha < linhas.length - 1
              && String(linha.texto).trim().split(/\s+/).length >= 3,
            maxWidth: Math.max(40, largura - linha.xOffset)
          }));
        }

        function montarLinhasSecao(texto, largura, usarRecuo, justificarParagrafos) {
          const blocos = criarBlocosTextoRelatorio(texto);
          const linhas = [];
          const recuoParagrafo = usarRecuo ? 18 : 0;
          const recuoLista = 16;

          blocos.forEach((bloco, indiceBloco) => {
            const espacoAntes = indiceBloco === 0 ? 0 : 9;
            if (bloco.tipo === "lista") {
              const quebradas = doc.splitTextToSize(bloco.texto, Math.max(40, largura - recuoLista));
              quebradas.forEach((linha, indiceLinha) => linhas.push({
                texto: linha,
                xOffset: recuoLista,
                marcador: indiceLinha === 0 ? bloco.marcador : "",
                espacoAntes: indiceLinha === 0 ? espacoAntes : 0,
                justificar: false,
                maxWidth: Math.max(40, largura - recuoLista)
              }));
            } else {
              quebrarParagrafoComRecuo(bloco.texto, largura, recuoParagrafo, justificarParagrafos).forEach((linha, indiceLinha) => linhas.push({
                texto: linha.texto,
                xOffset: linha.xOffset,
                marcador: "",
                espacoAntes: indiceLinha === 0 ? espacoAntes : 0,
                justificar: linha.justificar,
                maxWidth: linha.maxWidth
              }));
            }
          });
          return linhas;
        }

        function desenharSecaoCard(numero, titulo, texto, opcoes = {}) {
          const padH = 16, padV = 14;
          const larguraInterna = contentW - padH * 2;
          const tamanhoTitulo = 12.5;
          const tamanhoTexto = 10.8;
          const alturaLinha = tamanhoTexto * 1.5;
          const alturaHeaderPrimeiraPagina = 36;
          const alturaHeaderContinuacao = 30;
          const usarRecuo = opcoes.recuoPrimeiraLinha !== false;
          const justificarParagrafos = opcoes.justificar !== false;

          doc.setFont("helvetica", "normal");
          doc.setFontSize(tamanhoTexto);
          const linhas = montarLinhasSecao(texto, larguraInterna, usarRecuo, justificarParagrafos);

          let indice = 0;
          let primeiraPagina = true;
          while (indice < linhas.length) {
            const alturaHeaderAtual = primeiraPagina ? alturaHeaderPrimeiraPagina : alturaHeaderContinuacao;
            const espacoParaTexto = espacoRestante() - padV * 2 - alturaHeaderAtual;
            let usado = 0;
            let fim = indice;

            while (fim < linhas.length) {
              const linha = linhas[fim];
              const espacoAntes = fim === indice ? 0 : linha.espacoAntes;
              const alturaNecessaria = espacoAntes + alturaLinha;
              if (usado + alturaNecessaria > espacoParaTexto) break;
              usado += alturaNecessaria;
              fim += 1;
            }

            if (fim === indice) {
              novaPagina();
              continue;
            }

            const topoCard = y;
            const alturaCard = padV * 2 + alturaHeaderAtual + usado;
            if (!somenteContar) {
              doc.setDrawColor(...corLinha);
              doc.setFillColor(255, 255, 255);
              doc.setLineWidth(1);
              doc.roundedRect(margin, topoCard, contentW, alturaCard, 10, 10, "FD");

              let yy = topoCard + padV;
              if (primeiraPagina) {
                doc.setFont("helvetica", "bold");
                doc.setFontSize(tamanhoTitulo);
                doc.setTextColor(...corTitulo);
                doc.text(`${numero}. ${String(titulo).toUpperCase()}`, margin + padH, yy + 11);
              } else {
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10.5);
                doc.setTextColor(...corTitulo);
                doc.text(String(titulo).toUpperCase() + " (CONTINUAÇÃO)", margin + padH, yy + 8);
              }

              yy += alturaHeaderAtual;
              doc.setFont("helvetica", "normal");
              doc.setFontSize(tamanhoTexto);
              doc.setTextColor(...corTexto);

              for (let k = indice; k < fim; k++) {
                const linha = linhas[k];
                yy += k === indice ? 0 : linha.espacoAntes;
                if (linha.marcador) {
                  doc.text(linha.marcador, margin + padH, yy);
                }
                const xTexto = margin + padH + linha.xOffset;
                if (linha.justificar) {
                  doc.text(linha.texto, xTexto, yy, { align: "justify", maxWidth: linha.maxWidth });
                } else {
                  doc.text(linha.texto, xTexto, yy);
                }
                yy += alturaLinha;
              }
            }

            y = topoCard + alturaCard;
            indice = fim;
            primeiraPagina = false;
            if (indice < linhas.length) {
              y += 14;
              novaPagina();
            }
          }
          y += 16;
        }

        // ---- Bloco de título (centralizado, só na primeira página) ----
        if (!somenteContar) {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(15.75);
          doc.setTextColor(...corTitulo);
          doc.text("RELATÓRIO TÉCNICO DE VIAGEM", PAGE_W / 2, y, { align: "center" });
        }
        y += 22;
        if (!somenteContar) {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(9.4);
          doc.setTextColor(...corKicker);
          doc.text("— PRESTAÇÃO DE CONTAS —", PAGE_W / 2, y, { align: "center" });
        }
        y += 22;
        if (!somenteContar) {
          const svTexto = `S.V. Nº ${form.numeroSolicitacao || "________"}`;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(9.4);
          const tw = doc.getTextWidth(svTexto);
          doc.setDrawColor(...corLinha);
          doc.setLineWidth(1);
          doc.roundedRect(PAGE_W / 2 - (tw + 32) / 2, y - 12, tw + 32, 20, 6, 6, "S");
          doc.setTextColor(...MX.cinzaTxt);
          doc.text(svTexto, PAGE_W / 2, y + 2, { align: "center" });
        }
        y += 32;

        // ---- RESUMO DA VIAGEM (imagem — mesmo visual de sempre) ----
        colocarImagem(pecasVisuais.resumo);
        y += 20;

        // ---- As seções de texto copiáveis, em card com borda (numeração sequencial) ----
        let numeroSecao = 1;
        if (form.tipoPrestacao === "viagem_nao_realizada") {
          // Viagem não realizada: a justificativa substitui as quatro seções
          // narrativas, que não fazem sentido quando não houve deslocamento.
          desenharSecaoCard(numeroSecao++, "JUSTIFICATIVA DA NÃO REALIZAÇÃO DA VIAGEM", form.justificativaNaoRealizada, { recuoPrimeiraLinha: false });
          if (String(form.infoComplementares || "").trim()) {
            desenharSecaoCard(numeroSecao++, "INFORMAÇÕES COMPLEMENTARES", form.infoComplementares, { recuoPrimeiraLinha: false });
          }
        } else {
          desenharSecaoCard(numeroSecao++, "DESCRIÇÃO DO EVENTO", form.nomeEvento, { recuoPrimeiraLinha: false });
          desenharSecaoCard(numeroSecao++, "OBJETIVO DA PARTICIPAÇÃO", form.motivo, { recuoPrimeiraLinha: false });
          desenharSecaoCard(numeroSecao++, "CONCLUSÃO", form.conclusao, { recuoPrimeiraLinha: false });
          if (String(form.infoComplementares || "").trim()) {
            desenharSecaoCard(numeroSecao++, "INFORMAÇÕES COMPLEMENTARES", form.infoComplementares, { recuoPrimeiraLinha: false });
          }
        }

        // ---- DOCUMENTOS ANEXADOS — mesmo card (borda cinza, título "N. NOME"), sem faixa azul ----
        const itensDoc = d.docsPreview.length ? d.docsPreview : [{ nome: "—" }];
        const padCardH = 16, padCardV = 14;
        const alturaHeaderDocPrimeiraPagina = 36, alturaHeaderDocContinuacao = 30;
        function alturaItemDoc(item) { return item.detalhe ? 30 : 16; }
        let indiceItem = 0;
        let primeiraPaginaDoc = true;
        while (indiceItem < itensDoc.length) {
          const alturaHeaderAtual = primeiraPaginaDoc ? alturaHeaderDocPrimeiraPagina : alturaHeaderDocContinuacao;
          garantirEspacoBloco(alturaHeaderAtual + padCardV * 2 + 24);
          const topoCard = y;
          const yInicioItens = topoCard + padCardV + alturaHeaderAtual;
          let yy = yInicioItens;
          let fimIndice = indiceItem;
          while (fimIndice < itensDoc.length) {
            const h = alturaItemDoc(itensDoc[fimIndice]);
            if (yy + h > PAGE_H - RODAPE_RESERVA - padCardV) break;
            yy += h;
            fimIndice += 1;
          }
          if (fimIndice === indiceItem) { novaPagina(); continue; }
          const alturaCard = (yy - topoCard) + padCardV;
          if (!somenteContar) {
            doc.setDrawColor(...corLinha);
            doc.setFillColor(255, 255, 255);
            doc.setLineWidth(1);
            doc.roundedRect(margin, topoCard, contentW, alturaCard, 10, 10, "FD");
            doc.setFont("helvetica", "bold");
            if (primeiraPaginaDoc) {
              doc.setFontSize(12.5);
              doc.setTextColor(...corTitulo);
              doc.text(`${numeroSecao}. DOCUMENTOS ANEXADOS`, margin + padCardH, topoCard + padCardV + 11);
            } else {
              doc.setFontSize(10.5);
              doc.setTextColor(...corTitulo);
              doc.text("DOCUMENTOS ANEXADOS (CONTINUAÇÃO)", margin + padCardH, topoCard + padCardV + 8);
            }
            let yLinha = yInicioItens;
            for (let k = indiceItem; k < fimIndice; k++) {
              const item = itensDoc[k];
              const numTxt = `${k + 1}.`;
              doc.setFont("helvetica", "bold");
              doc.setFontSize(10);
              doc.setTextColor(...corAzulNum);
              doc.text(numTxt, margin + padCardH, yLinha);
              const numW = doc.getTextWidth(numTxt);
              const selo = margin + padCardH + numW + 12;
              doc.setFillColor(...corVerdeTint);
              doc.circle(selo, yLinha - 3, 7, "F");
              doc.setDrawColor(...corVerdeSecao);
              doc.setLineWidth(1.2);
              doc.line(selo - 3.2, yLinha - 3, selo - 0.8, yLinha - 0.4);
              doc.line(selo - 0.8, yLinha - 0.4, selo + 3.6, yLinha - 6.2);
              doc.setFont("helvetica", "normal");
              doc.setFontSize(10);
              doc.setTextColor(...corTexto);
              doc.text(item.nome, selo + 14, yLinha);
              yLinha += 16;
              if (item.detalhe) {
                doc.setFont("helvetica", "italic");
                doc.setFontSize(9);
                doc.setTextColor(...MX.cinzaTxt);
                doc.text(String(item.detalhe), selo + 14, yLinha);
                yLinha += 14;
              }
            }
          }
          y = topoCard + alturaCard;
          indiceItem = fimIndice;
          primeiraPaginaDoc = false;
          if (indiceItem < itensDoc.length) { y += 14; novaPagina(); }
        }
        numeroSecao += 1;
        y += 18;

        // ---- DECLARAÇÃO DO VIAJANTE + assinatura (imagem) ----
        colocarImagem(pecasVisuais.declaracao);

        return { paginas: paginasRelatorio };
      }

      // Supõe relatório = 1 página; se der errado (textos longos empurrando
      // para uma 2ª+ página), corrige a numeração e refaz só a contagem
      // (o desenho de verdade só acontece uma vez, no final, já com a
      // numeração de anexos correta).
      let numeracaoAnexos = calcularNumeracaoAnexos(2);
      const pecasVisuais = await capturarPecasVisuais();
      y = 101.5;
      let contagemRelatorio = desenharCorpoRelatorio(numeracaoAnexos, true, pecasVisuais);
      if (contagemRelatorio.paginas !== 1) {
        numeracaoAnexos = calcularNumeracaoAnexos(contagemRelatorio.paginas + 1);
        y = 101.5;
        contagemRelatorio = desenharCorpoRelatorio(numeracaoAnexos, true, pecasVisuais);
      }
      totalPaginasPdf = contagemRelatorio.paginas + totalPaginasAnexos;
      cabecalhoAnexo(false); // a 1ª página do PDF já existe — só desenha o cabeçalho nela
      desenharCorpoRelatorio(numeracaoAnexos, false, pecasVisuais);
      rodapePaginaAnexo(); // rodapé da última página do relatório

      function paginaAnexoDoc(numero, titulo, imagem, continuacao, redigido, tipoIcone) {
        cabecalhoAnexo();
        tituloAnexo(numero, titulo + (continuacao ? " (CONTINUAÇÃO)" : ""), tipoIcone);
        const pilulaH = redigido ? 34 : 0;
        const frameTop = y;
        const frameBottom = PAGE_H - 72 - pilulaH;
        const frameH = frameBottom - frameTop;
        doc.setDrawColor(...MX.cinzaBorda);
        doc.setLineWidth(1);
        doc.roundedRect(margin, frameTop, contentW, frameH, 10, 10, "S");
        if (!imagem) {
          doc.setFont("helvetica", "italic");
          doc.setFontSize(10.5);
          doc.setTextColor(...MX.cinzaTxt);
          doc.text("Conteúdo do arquivo não disponível nesta sessão — reanexe o documento.", PAGE_W / 2, frameTop + frameH / 2, { align: "center" });
        } else {
          try {
            const props = doc.getImageProperties(imagem);
            const maxW = contentW - 28, maxH = frameH - 28;
            const esc = Math.min(maxW / props.width, maxH / props.height);
            const w = props.width * esc, h = props.height * esc;
            doc.addImage(imagem, margin + (contentW - w) / 2, frameTop + (frameH - h) / 2, w, h);
          } catch (e) {
            registrarAvisoPdf(`Não foi possível inserir a imagem do documento "${meta && meta.nome ? meta.nome : ""}" no PDF.`);
          }
        }
        if (redigido) pilulaDadosOcultados(frameBottom + 6);
        rodapePaginaAnexo();
      }

      function camposDoTranslado(t, topoY) {
        const camposT = [["Origem", t.de], ["Destino", t.para], ["Data do translado", formatDateBR(t.data)], ["Valor do comprovante", t.valor]];
        const colW = (contentW - 28) / 4;
        camposT.forEach(([rotulo, valor], i) => {
          const x0 = margin + 14 + colW * i;
          if (i > 0) { doc.setDrawColor(...MX.cinzaBorda); doc.line(x0, topoY, x0, topoY + 25); }
          const tx = i > 0 ? x0 + 10 : x0;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.setTextColor(...MX.texto);
          doc.text(rotulo, tx, topoY + 8);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(...MX.cinzaTxt);
          const vv = doc.splitTextToSize(String(valor || "—"), colW - 14)[0] || "—";
          doc.text(vv, tx, topoY + 20);
        });
        doc.setDrawColor(...MX.cinzaBorda);
        doc.line(margin + 14, topoY + 31, PAGE_W - margin - 14, topoY + 31);
        return topoY + 39;
      }

      function desenharPaginaTranslado(numeroAnexo, seqTranslado, t, imagensPar, indicePrimeira, totalPaginasArquivo) {
        const continuacao = indicePrimeira > 0;
        cabecalhoAnexo();
        tituloAnexo(numeroAnexo, "COMPROVANTE DE TRANSLADO" + (continuacao ? " (CONTINUAÇÃO)" : ""), "carro");
        const pilulaH = t.redigido ? 34 : 0;
        const areaBottom = PAGE_H - 72 - pilulaH;
        // Card único do translado ocupando a área útil da página
        doc.setDrawColor(...MX.cinzaBorda);
        doc.setLineWidth(1);
        doc.roundedRect(margin, y, contentW, areaBottom - y, 10, 10, "S");
        const seq = String(seqTranslado + 1).padStart(2, "0");
        const hx = margin + 14, hy = y + 13;
        doc.setFillColor(...MX.verdeIcone);
        doc.roundedRect(hx, hy, 20, 20, 5, 5, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(255, 255, 255);
        doc.text(seq, hx + 10, hy + 13.5, { align: "center" });
        doc.setFontSize(11.5);
        doc.setTextColor(...MX.navy);
        doc.text(`TRANSLADO ${seq}`, hx + 28, hy + 14);
        const imgTop = continuacao ? y + 44 : camposDoTranslado(t, y + 44);
        const imgBottom = areaBottom - 26; // reserva espaço para a legenda "Página X de Y"
        const areaH = imgBottom - imgTop;
        const validas = imagensPar.filter(Boolean);
        if (!validas.length) {
          doc.setFont("helvetica", "italic");
          doc.setFontSize(9.5);
          doc.setTextColor(...MX.cinzaTxt);
          doc.text("Comprovante não disponível nesta sessão — reanexe o documento.", PAGE_W / 2, (imgTop + imgBottom) / 2, { align: "center" });
        } else {
          const lado = validas.length; // 1 ou 2 imagens lado a lado
          const gapImg = 16;
          const larguraCol = lado === 1 ? contentW * 0.62 : (contentW - 28 - gapImg) / 2;
          validas.forEach((img, i) => {
            try {
              const props = doc.getImageProperties(img);
              const esc = Math.min(larguraCol / props.width, areaH / props.height);
              const w = props.width * esc, h = props.height * esc;
              const cx = lado === 1
                ? margin + contentW / 2
                : margin + 14 + larguraCol * i + gapImg * i + larguraCol / 2;
              const ix = cx - w / 2;
              const iy = imgTop + (areaH - h) / 2;
              doc.addImage(img, ix, iy, w, h);
              if (totalPaginasArquivo > 1) {
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8.5);
                doc.setTextColor(...MX.cinzaTxt);
                doc.text(`Página ${indicePrimeira + i + 1} de ${totalPaginasArquivo}`, cx, areaBottom - 10, { align: "center" });
              }
            } catch (e) {
              registrarAvisoPdf("Não foi possível inserir uma imagem de comprovante de translado no PDF.");
            }
          });
        }
        if (t.redigido) pilulaDadosOcultados(areaBottom + 6);
        rodapePaginaAnexo();
      }

      function desenharRelatorioSinteticoTranslado(numeroAnexo, itens, valorLiberado, valorRetirado) {
        const valorComprovado = itens.reduce((acc, t) => acc + parseMoeda(t.valor), 0);
        const valorPermaneceuConta = Math.max(0, valorLiberado - valorRetirado);
        const valorDevolverViajante = Math.max(0, valorRetirado - valorComprovado);

        cabecalhoAnexo();
        tituloAnexo(numeroAnexo, "RELATÓRIO SINTÉTICO — TRANSLADO", "carro");

        const hResumo = 56;
        doc.setFillColor(...MX.verdeClaro);
        doc.setDrawColor(...MX.verdeBorda);
        doc.setLineWidth(1.2);
        doc.roundedRect(margin, y, contentW, hResumo, 10, 10, "FD");
        const colunasResumo = [
          ["Valor liberado", valorLiberado, MX.texto],
          ["Sacado ou transferido", valorRetirado, MX.texto],
          ["Permaneceu na conta", valorPermaneceuConta, MX.texto],
          ["A devolver pelo viajante", valorDevolverViajante, valorDevolverViajante > 0.009 ? MX.verdeValor : MX.texto],
        ];
        const colW3 = contentW / 4;
        colunasResumo.forEach(([label, valor, cor], i) => {
          const cx = margin + colW3 * i + colW3 / 2;
          if (i > 0) { doc.setDrawColor(...MX.verdeBorda); doc.line(margin + colW3 * i, y + 12, margin + colW3 * i, y + hResumo - 12); }
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(...MX.texto);
          doc.text(label, cx, y + 20, { align: "center" });
          doc.setFont("helvetica", "bold");
          doc.setFontSize(13);
          doc.setTextColor(...cor);
          doc.text(moedaBR(valor), cx, y + 40, { align: "center" });
        });
        y += hResumo + 20;

        const colunasTabela = [
          { label: "Data", w: 0.15 },
          { label: "Origem", w: 0.27 },
          { label: "Destino", w: 0.27 },
          { label: "Valor", w: 0.16 },
          { label: "Pág.", w: 0.15 },
        ];
        function cabecalhoTabela() {
          doc.setFillColor(...MX.cinzaFundo);
          doc.roundedRect(margin, y, contentW, 24, 6, 6, "F");
          let cx = margin + 10;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.setTextColor(...MX.texto);
          colunasTabela.forEach(c => { doc.text(c.label.toUpperCase(), cx, y + 16); cx += contentW * c.w; });
          y += 24 + 6;
        }
        cabecalhoTabela();
        const alturaLinha = ALTURA_LINHA_SINTESE;
        itens.forEach((t, i) => {
          if (y + alturaLinha > PAGE_H - 76) {
            rodapePaginaAnexo();
            cabecalhoAnexo();
            tituloAnexo(numeroAnexo, "RELATÓRIO SINTÉTICO — TRANSLADO (CONTINUAÇÃO)", "carro");
            cabecalhoTabela();
          }
          if (i % 2 === 1) { doc.setFillColor(250, 251, 251); doc.rect(margin, y - 4, contentW, alturaLinha, "F"); }
          let cx = margin + 10;
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(...MX.texto);
          const valoresLinha = [formatDateBR(t.data) || "—", t.de || "—", t.para || "—", t.valor || "—", t.pagina ? String(t.pagina) : "—"];
          valoresLinha.forEach((v, ci) => {
            const c = colunasTabela[ci];
            const vv = doc.splitTextToSize(String(v), contentW * c.w - 14)[0] || "—";
            doc.text(vv, cx, y + 12);
            cx += contentW * c.w;
          });
          doc.setDrawColor(...MX.cinzaBorda);
          doc.line(margin, y + alturaLinha - 4, PAGE_W - margin, y + alturaLinha - 4);
          y += alturaLinha;
        });
        rodapePaginaAnexo();
      }

      for (let n = 0; n < anexosPreparados.length; n++) {
        const a = anexosPreparados[n];
        const numero = n + 1;
        if (a.tipo === "doc") {
          const tipoIcone = /ve[íi]cul|di[áa]rio/i.test(a.titulo) ? "carro" : "doc";
          const paginas = a.imagens.length ? a.imagens : [null];
          for (let pi = 0; pi < paginas.length; pi++) {
            paginaAnexoDoc(numero, a.titulo, paginas[pi], pi > 0, a.redigido, tipoIcone);
          }
        } else {
          const paginasItens = numeracaoAnexos.paginasTranslado;
          const itensComPagina = a.itens.map((t, i) => ({ ...t, pagina: paginasItens[i] }));
          desenharRelatorioSinteticoTranslado(numero, itensComPagina, parseMoeda(form.valorTransladoLiberado), valorRetiradoTranslado);
          for (let i = 0; i < a.itens.length; i++) {
            const t = a.itens[i];
            const imgs = t.imagens.length ? t.imagens : [null];
            for (let p = 0; p < imgs.length; p += 2) {
              desenharPaginaTranslado(numero, i, t, imgs.slice(p, p + 2), p, t.imagens.length);
            }
          }
        }
      }

      if (avisosPdf.length) {
        setPdfAviso("O sistema detectou algo inesperado ao montar o PDF (" + avisosPdf.join(" ") + "). O PDF foi gerado mesmo assim, mas confira com atenção antes de assinar — e se possível, avise quem cuida do sistema.");
      }
      const finalBytes = doc.output("arraybuffer");
      if (modoPreview) {
        const blob = new Blob([finalBytes], { type: "application/pdf" });
        previewPdfBlobRef.current = blob;

        const novaUrl = URL.createObjectURL(blob);
        if (previewPdfUrlRef.current) URL.revokeObjectURL(previewPdfUrlRef.current);
        previewPdfUrlRef.current = novaUrl;
        setPreviewPdfUrl(novaUrl);
      } else {
        downloadBytes(new Uint8Array(finalBytes), `prestacao_contas_${form.numeroSolicitacao || "sem_numero"}.pdf`);
        setPdfGeradoUmaVez(true);
        setPdfConcluido(true);
      }
    } catch (e) {
      const mensagem = "Não foi possível gerar o PDF (" + (e && e.message ? e.message : "erro desconhecido") + "). Tente novamente ou reduza o tamanho dos anexos.";
      if (modoPreview) setPreviewErro(mensagem);
      else setPdfErro(mensagem);
    } finally {
      if (modoPreview) setPreviewGerando(false);
      else setGerando(false);
    }
  }

  async function abrirPreviewPdf() {
    setPreviewErro("");
    setMostrarPreview(true);
    await gerarPDF({ modoPreview: true });
  }

  function abrirPreviewEmNovaGuia() {
    const blob = previewPdfBlobRef.current;
    if (!blob) {
      setPreviewErro("O PDF ainda não está disponível. Feche esta mensagem e tente abrir a pré-visualização novamente.");
      return;
    }

    // A guia precisa ser aberta durante o clique para não ser bloqueada pelo navegador.
    const novaGuia = window.open("about:blank", "_blank");
    if (!novaGuia) {
      setPreviewErro("O navegador bloqueou a nova guia. Autorize pop-ups para este site ou use a pré-visualização desta janela.");
      return;
    }

    try {
      novaGuia.document.title = "Relatório técnico de viagem";
      novaGuia.document.body.innerHTML = '<div style="font-family:Arial,sans-serif;padding:24px;color:#334155">Abrindo o relatório...</div>';

      // Cria a URL no contexto da própria nova guia. Assim ela não depende
      // da URL temporária usada pelo iframe da janela principal.
      const urlDaNovaGuia = novaGuia.URL.createObjectURL(blob);
      novaGuia.location.replace(urlDaNovaGuia);
    } catch (erro) {
      novaGuia.close();
      setPreviewErro("Não foi possível abrir o PDF em outra guia. Use a pré-visualização desta janela ou tente novamente.");
    }
  }

  const steps = [
    { title: "Solicitação e dados", desc: "Informações da viagem e do solicitante", icon: "pessoa" },
    { title: "Transporte e comprovantes", desc: "Detalhes dos gastos e anexos", icon: "maleta" },
    { title: "Revisão e PDF", desc: "Confira e gere seu relatório final", icon: "doc" },
  ];
  const totalArquivos = Object.values(form.anexos).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0) + translados.filter(t => t.arquivo).length;
  const arquivosRevisao = [];
  docs.filter(d => d.id !== "comprobatorio").forEach(d => {
    const arquivos = form.anexos[d.id] || [];
    arquivos.forEach(f => arquivosRevisao.push({ categoria: d.nome, nome: f.nome }));
    if (DOCS_COM_JUSTIFICATIVA.includes(d.id) && !arquivos.length && respostaPossuiDoc(form, d.id) === "nao" && form.justificativas[d.id]) {
      arquivosRevisao.push({ categoria: d.nome, nome: "Justificativa registrada no sistema" });
    }
  });
  translados.forEach((t, i) => {
    if (mostraTranslado && t.arquivo) arquivosRevisao.push({ categoria: `Comprovante de translado ${i + 1}: ${rotuloLocalTranslado(t, "de") || "origem"} → ${rotuloLocalTranslado(t, "para") || "destino"}`, nome: t.arquivo.nome });
  });
  docs.filter(d => d.id === "comprobatorio").forEach(d => (form.anexos[d.id] || []).forEach(f => arquivosRevisao.push({ categoria: d.nome, nome: f.nome })));

  function irParaMinhasPrestacoes() {
    const url = new URL(window.location.href);
    url.searchParams.delete("rascunho");
    window.location.href = url.toString();
  }

  async function encerrarSemPrestacaoEVoltarParaInicio() {
    // Neste caminho não existe prestação de contas a manter. Limpamos o rascunho
    // criado apenas para a tentativa de importação e voltamos ao painel principal.
    if (saveTimer.current) {
      clearTimeout(saveTimer.current);
      saveTimer.current = null;
    }
    const ids = coletarIdsAnexos(form.anexos, form.translados);
    if (form.scvArquivo?.id) ids.push(form.scvArquivo.id);
    try {
      if (key) {
        await Promise.all([
          DraftDB.delete(key),
          ...[...new Set(ids.filter(Boolean))].map(id => DraftDB.delete(`${key}:arquivo:${id}`))
        ]);
      }
    } catch (e) { /* a navegação continua mesmo se a limpeza local falhar */ }
    removerRascunhoDaLista(token);
    irParaMinhasPrestacoes();
  }

  function salvarRascunhoLocal({ silencioso = false } = {}) {
    try {
      const conteudo = JSON.stringify({ versao: 3, salvoEm: new Date().toISOString(), form, anexosContent });
      const blob = new Blob([conteudo], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `prestacao_contas_${form.numeroSolicitacao || "sem_numero"}_editavel.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1800);
      if (!silencioso) setDraftMessage("Arquivo de edição baixado com sucesso.");
      return true;
    } catch (e) {
      if (!silencioso) setDraftMessage("Não foi possível criar o arquivo para edição. Tente novamente.");
      return false;
    }
  }

  function carregarRascunhoLocal(event) {
    const arquivo = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!arquivo) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const dados = JSON.parse(reader.result);
        if (!dados || !dados.form) throw new Error("inválido");
        const anexosImportados = dados.anexosContent || {};
        await Promise.all(Object.entries(anexosImportados).map(([id, conteudo]) => persistFile(id, conteudo)));
        setForm({ ...emptyForm, ...dados.form });
        setAnexosContent(anexosImportados);
        setConferencia({ dados: false, transporte: false, documentos: false, privacidade: false, atesto: false });
        setStep(1);
        setModoInicio("editar");
        setArquivoEdicaoCarregado(true);
        setDraftMessage("Prestação aberta para edição. Confira as informações antes de continuar.");
      } catch (e) {
        setDraftMessage("Este não é um arquivo de edição válido do Sistema de Prestação de Contas.");
      }
    };
    reader.readAsText(arquivo);
  }

  function iniciarNovaPrestacaoComArquivo(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    const possuiDados = !!(
      form.scvImportado || form.numeroSolicitacao || form.nomeViajante || form.transporte ||
      Object.values(form.anexos || {}).some(lista => (lista || []).length) ||
      (form.translados || []).length
    );
    if (possuiDados) {
      const continuar = window.confirm("Ao começar uma nova prestação, os dados atuais serão apagados. Deseja continuar?");
      if (!continuar) return;
    }
    const idsAntigos = coletarIdsAnexos(form.anexos, form.translados);
    if (form.scvArquivo?.id) idsAntigos.push(form.scvArquivo.id);
    excluirConteudosArquivos(idsAntigos);
    setForm(emptyForm);
    setAnexosContent({});
    setFileWarnings({});
    setDadosScv(null);
    setScvErro("");
    setScvNaoRealizada(false);
    setConferencia({ dados: false, transporte: false, documentos: false, privacidade: false, atesto: false });
    setArquivoEdicaoCarregado(false);
    setDraftMessage("");
    setStep(1);
    setModoInicio("nova");
    importarSolicitacaoSCV(file);
  }

  function soltarArquivoInicio(event, tipo) {
    event.preventDefault();
    event.stopPropagation();
    setInicioDragTipo("");
    const arquivos = Array.from(event.dataTransfer?.files || []);
    if (!arquivos.length) return;
    if (tipo === "pdf") {
      const arquivo = arquivos.find(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
      if (!arquivo) { setDraftMessage("Arraste o PDF da solicitação de viagem."); return; }
      iniciarNovaPrestacaoComArquivo({ target: { files: [arquivo], value: "" } });
      return;
    }
    const arquivo = arquivos.find(f => f.type === "application/json" || /\.json$/i.test(f.name));
    if (!arquivo) { setDraftMessage("Arraste o arquivo de rascunho .json gerado por este sistema."); return; }
    carregarRascunhoLocal({ target: { files: [arquivo], value: "" } });
  }

  const podeExibirFormularioInicial =
    (modoInicio === "nova" && !!form.dadosScvConfirmados) ||
    (modoInicio === "editar" && arquivoEdicaoCarregado);

  function abrirConferencia() {
    setForm(f => ({ ...f, atesto: false }));

        <div className="redact-overlay" onClick={e => { if (e.target === e.currentTarget) setMostrarConferencia(false); }}>
          <div className="redact-modal" style={{ width: "min(650px, 100%)" }}>
            <div className="redact-head"><h3>Conferência rápida antes do atesto</h3><button className="redact-close" onClick={() => setMostrarConferencia(false)}><Icon name="close" size={18} /></button></div>
            <div style={{ padding: "18px 24px 4px", color: "var(--cinza)", fontSize: 14.5 }}>Confirme cada declaração. Leia com atenção antes de marcar.</div>
            <div style={{ padding: "0 24px 20px", overflowY: "auto" }}>
              <div className="conference-list">
                {viagemNaoRealizada ? (
                  <>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.dados} onChange={e => setConferencia(c => ({ ...c, dados: e.target.checked }))} /><span>Conferi os dados da solicitação, as datas previstas, a origem, o destino e a justificativa da não realização da viagem.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.transporte} onChange={e => setConferencia(c => ({ ...c, transporte: e.target.checked }))} /><span>Conferi o valor sacado ou transferido da conta corporativa e a devolução correspondente ao Estado.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.documentos} onChange={e => setConferencia(c => ({ ...c, documentos: e.target.checked }))} /><span>Conferi o comprovante de saque ou transferência e o comprovante da devolução do valor sacado ou transferido anexados a esta prestação de contas.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.privacidade} onChange={e => setConferencia(c => ({ ...c, privacidade: e.target.checked }))} /><span>Revisei os documentos e comprovantes anexados e confirmei que os dados pessoais sujeitos à proteção foram devidamente ocultados antes da geração do PDF.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.atesto} onChange={e => setConferencia(c => ({ ...c, atesto: e.target.checked }))} /><span>Atesto que a viagem autorizada não foi realizada, que a justificativa informada corresponde aos fatos e que o valor sacado ou transferido da conta corporativa foi devolvido ao Estado, conforme os documentos apresentados.</span></label>
                  </>
                ) : (
                  <>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.dados} onChange={e => setConferencia(c => ({ ...c, dados: e.target.checked }))} /><span>Conferi os dados da viagem, as datas, a origem, o destino e as informações do relatório técnico.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.transporte} onChange={e => setConferencia(c => ({ ...c, transporte: e.target.checked }))} /><span>Conferi o meio de transporte, os deslocamentos de translado e os valores informados.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.documentos} onChange={e => setConferencia(c => ({ ...c, documentos: e.target.checked }))} /><span>Conferi os nomes dos arquivos e confirmo que os comprovantes correspondem a esta viagem.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.privacidade} onChange={e => setConferencia(c => ({ ...c, privacidade: e.target.checked }))} /><span>Revisei os documentos e comprovantes anexados e confirmei que os dados pessoais sujeitos à proteção foram devidamente ocultados antes da geração do PDF.</span></label>
                    <label className="conference-item"><input type="checkbox" checked={conferencia.atesto} onChange={e => setConferencia(c => ({ ...c, atesto: e.target.checked }))} /><span>Atesto que as informações demonstram a realização da viagem e que os documentos apresentados são verdadeiros e pertinentes à prestação de contas.</span></label>
                  </>
                )}
              </div>
            </div>
            <div className="redact-actions" style={{ justifyContent: "flex-end" }}><button className="btn btn-ghost" onClick={() => setMostrarConferencia(false)}>Voltar</button><button className="btn btn-primary" disabled={!Object.values(conferencia).every(Boolean)} onClick={confirmarConferencia}>Confirmar atesto</button></div>
          </div>
        </div>
      )}

      {redactTarget && (
        <RedactModal
          meta={redactTarget.meta}
          dataUrl={redactTarget.dataUrl}
          onSave={redactTarget.onSave}
          onClose={redactTarget.onClose}
        />
      )}

      {mostrarPreview && (
        <div className="redact-overlay report-preview-overlay" onClick={e => { if (e.target === e.currentTarget) setMostrarPreview(false); }}>
          <div className="preview-modal report-preview-modal" role="dialog" aria-modal="true" aria-label="Pré-visualização do relatório técnico">
            <div className="redact-head">
              <div>
                <h3>Pré-visualização do relatório técnico</h3>
                <div className="file-view-name">Confira a folha completa antes de continuar.</div>
              </div>
              <button className="redact-close" onClick={() => setMostrarPreview(false)} aria-label="Fechar pré-visualização"><Icon name="close" size={20} /></button>
            </div>
            <div className="preview-modal-body report-preview-modal-body pdf-oficial-body">
              {previewGerando ? (
                <div className="pdf-preview-loading" role="status" aria-live="polite">
                  <span className="pdf-preview-spinner" aria-hidden="true"></span>
                  <strong>Montando o mesmo PDF que será baixado...</strong>
                  <span>Os anexos podem levar alguns segundos para serem processados.</span>
                </div>
              ) : previewErro ? (
                <div className="pdf-preview-error" role="alert">
                  <strong>Não foi possível abrir a pré-visualização.</strong>
                  <span>{previewErro}</span>
                  <button className="btn btn-ghost" onClick={abrirPreviewPdf}>Tentar novamente</button>
                </div>
              ) : previewPdfUrl ? (
                <iframe
                  className="pdf-oficial-frame"
                  src={`${previewPdfUrl}#view=FitH&toolbar=1&navpanes=0`}
                  title="PDF final da prestação de contas"
                />
              ) : null}
            </div>
            <div className="redact-actions report-preview-actions">
              <span className="preview-accessibility-note">Esta é a versão real do PDF final. No celular, use a pinça para ampliar.</span>
              {previewPdfUrl && !previewGerando && (
                <button type="button" className="btn btn-ghost pdf-preview-open-link" onClick={abrirPreviewEmNovaGuia}>
                  <Icon name="doc" size={16} /> Abrir em nova guia
                </button>
              )}
              <button className="btn btn-primary" onClick={() => setMostrarPreview(false)}>Fechar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);



</script>
</body>
</html>
