  function dataBRparaISO(valor) {
    const m = String(valor || "").match(/(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? `${m[3]}-${m[2]}-${m[1]}` : "";
  }

  function limparTextoExtraido(texto) {
    return String(texto || "").replace(/\s+/g, " ").trim();
  }

  function extrairEntre(texto, inicio, fim) {
    const i = texto.toUpperCase().indexOf(inicio.toUpperCase());
    if (i < 0) return "";
    const parte = texto.slice(i + inicio.length);
    const f = fim ? parte.toUpperCase().indexOf(fim.toUpperCase()) : -1;
    return limparTextoExtraido(f >= 0 ? parte.slice(0, f) : parte);
  }

  function mapearTransporteSCV(texto) {
    const t = texto.toUpperCase();
    if (t.includes("AÉREO") || t.includes("AEREO")) return "aereo";
    if (t.includes("ÔNIBUS") || t.includes("ONIBUS") || t.includes("BPE")) return "onibus";
    if (t.includes("VEÍCULO") && t.includes("OFICIAL") || t.includes("VEICULO") && t.includes("OFICIAL")) return "veiculo_oficial";
    if (t.includes("MEIOS PRÓPRIOS") || t.includes("MEIOS PROPRIOS")) return "meios_proprios";
    return "";
  }

  function reconstruirLinhasPdf(items) {
    const linhas = [];
    const toleranciaY = 3.5;
    (items || []).forEach(item => {
      const str = String(item.str || "").trim();
      if (!str) return;
      const transform = item.transform || [];
      const x = Number(transform[4] || 0);
      const y = Number(transform[5] || 0);
      let linha = linhas.find(l => Math.abs(l.y - y) <= toleranciaY);
      if (!linha) {
        linha = { y, itens: [] };
        linhas.push(linha);
      }
      linha.itens.push({ x, str });
    });
    return linhas
      .sort((a, b) => b.y - a.y)
      .map(l => l.itens.sort((a, b) => a.x - b.x).map(i => i.str).join(" ").replace(/\s+/g, " ").trim())
      .filter(Boolean)
      .join("\n");
  }

  function interpretarTextoSCV(textoOriginal) {
    const bruto = String(textoOriginal || "");
    const linhas = bruto.split(/\r?\n/).map(limparTextoExtraido).filter(Boolean);
    const texto = linhas.join(" ");

    const secaoViajante = (texto.match(/(?:^|\s)Viajante\s+([\s\S]*?)(?:\s+Planejamento da Viagem\s+|$)/i) || [])[1] || texto;
    const planejamento = (texto.match(/Planejamento da Viagem\s+([\s\S]*?)(?:\s+Roteiro\s+|$)/i) || [])[1] || texto;
    const roteiro = (texto.match(/Roteiro\s+([\s\S]*?)(?:\s+Informações Adicionais\s+|$)/i) || [])[1] || "";

    const numero = (texto.match(/Número:\s*([0-9./-]+)/i) || [])[1] || "";
    const nome = (secaoViajante.match(/(?:^|\s)Nome:\s*(.*?)\s+RG:/i) || [])[1] || "";
    const cargo = (secaoViajante.match(/(?:^|\s)Cargo:\s*(.*?)\s+Órgão:/i) || [])[1] || "";
    const chefia = (secaoViajante.match(/Chefia imediata:\s*(.*?)(?:\s+Planejamento da Viagem|$)/i) || [])[1] || "";

    const tipoViagemScv = (planejamento.match(/Tipo:\s*(.*?)\s+Período do evento:/i) || [])[1] || "";
    const periodoEvento = planejamento.match(/Período do evento:\s*(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})\s+a\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/i) || [];
    const nomeAtividade = (planejamento.match(/Nome:\s*(.*?)\s+Descrição:/i) || [])[1] || "";
    const descricao = (planejamento.match(/Descrição:\s*(.*?)\s+Local:/i) || [])[1] || "";
    const localEvento = (planejamento.match(/Local:\s*(.*?)\s+Telefone:/i) || [])[1] || "";

    function limparCidadeCandidata(valor) {
      let cidade = limparTextoExtraido(valor);
      const partes = cidade.split(/\s+/);
      const primeiroComMinuscula = partes.findIndex(p => /[a-zà-ÿ]/.test(p));
      if (primeiroComMinuscula >= 0) cidade = partes.slice(primeiroComMinuscula).join(" ");
      for (let i = 0; i < 3; i++) {
        cidade = cidade.replace(/^(?:SAÍDA|SAIDA|CHEGADA|CIDADE|DATA(?:\/HORA)?|HORA|ROTEIRO|MEIO|DE|TRANSPORTE)\s+/i, "");
      }
      return cidade.trim();
    }

    const regexCidade = /((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]*|(?:de|do|da|dos|das|e))(?:\s+(?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]*|de|do|da|dos|das|e))*)\/([A-Z]{2})\b/g;
    const candidatosCidade = [...roteiro.matchAll(regexCidade)]
      .map(m => limparCidadeCandidata(`${m[1]}/${m[2]}`))
      .filter(v => /^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]*\/[A-Z]{2}$/.test(v));
    const cidades = candidatosCidade.filter((v, i, a) => a.findIndex(x => x.toUpperCase() === v.toUpperCase()) === i);

    // No roteiro do SCV, o primeiro município é a saída inicial. Os demais (podem ser várias paradas)
    // formam o destino — juntamos todos, já que escolher "a mais longe" seria ambíguo e pouco confiável.
    const origem = cidades[0] ? paraNomeProprio(cidades[0].replace("/", " - ").toUpperCase()) : "";
    const destinoRoteiro = cidades.length > 1
      ? cidades.slice(1).map(c => paraNomeProprio(c.replace("/", " - ").toUpperCase())).join(", ")
      : "";
    const destinoLocal = localEvento ? paraNomeProprio(limparTextoExtraido(localEvento).toUpperCase()) : "";

    // A primeira data do roteiro é a saída; a última é o retorno ao município de origem.
    const datasRoteiro = [...roteiro.matchAll(/\b(\d{2}\/\d{2}\/\d{4})\b/g)].map(m => m[1]);
    const dataSaidaRoteiro = datasRoteiro[0] || "";
    const dataRetornoRoteiro = datasRoteiro[datasRoteiro.length - 1] || "";

    return {
      numeroSolicitacao: numero,
      nomeViajante: paraNomeProprio(limparTextoExtraido(nome).toUpperCase()),
      cargoFuncao: "",
      chefiaImediataScv: paraNomeProprio(limparTextoExtraido(chefia).toUpperCase()),
      origem,
      destino: destinoRoteiro || destinoLocal,
      dataSaida: dataBRparaISO(dataSaidaRoteiro || periodoEvento[1]),
      dataRetorno: dataBRparaISO(dataRetornoRoteiro || periodoEvento[3]),
      nomeEvento: paraFrase(limparTextoExtraido(descricao || nomeAtividade).toUpperCase()),
      nomeAtividadeScv: paraFrase(limparTextoExtraido(nomeAtividade).toUpperCase()),
      tipoViagemScv: paraFrase(limparTextoExtraido(tipoViagemScv).toUpperCase()),
      localEventoScv: paraNomeProprio(limparTextoExtraido(localEvento).toUpperCase()),
      periodoEventoScv: periodoEvento.length ? `${periodoEvento[1]} ${periodoEvento[2]} a ${periodoEvento[3]} ${periodoEvento[4]}` : "",
      transporte: mapearTransporteSCV(roteiro || texto),
    };
  }

  async function importarSolicitacaoSCV(origem) {
    const recebidoComoArquivo = typeof File !== "undefined" && origem instanceof File;
    const input = recebidoComoArquivo ? null : origem?.target;
    const file = recebidoComoArquivo ? origem : (input?.files && input.files[0]);
    if (input) input.value = "";
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") {
      setScvErro("Selecione o PDF gerado pelo SCV.");
      return;
    }
    setScvExtraindo(true);
    setScvErro("");
    setScvNaoRealizada(false);
    try {
      const dataUrl = await readFileAsDataURL(file);
      const fileId = uid();
      setAnexosContent(prev => ({ ...prev, [fileId]: dataUrl }));
      persistFile(fileId, dataUrl);
      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
      const partes = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        partes.push(reconstruirLinhasPdf(content.items));
      }
      const extraidos = interpretarTextoSCV(partes.join("\n"));
      setDadosScv(extraidos);
      setForm(f => ({ ...f, scvArquivo: { id:fileId, nome:file.name, tipo:file.type, tamanho:file.size }, scvImportado:true, dadosScvConfirmados:false }));
      setScvEtapaModal(1);
      setScvModal(true);
    } catch (e) {
      setScvErro("Não foi possível ler o PDF. Tente novamente com o arquivo original do SCV.");
    } finally {
      setScvExtraindo(false);
    }
  }

  function soltarPdfScv(event) {
    event.preventDefault();
    event.stopPropagation();
    setScvDragAtivo(false);
    const arquivos = Array.from(event.dataTransfer?.files || []);
    const arquivo = arquivos.find(f => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    if (!arquivo) {
      setScvErro("Arraste o PDF da solicitação de viagem gerado pelo SCV.");
      return;
    }
    importarSolicitacaoSCV(arquivo);
  }

  function aplicarDadosScv(confirmados) {
    if (!dadosScv || !form.tipoPrestacao) return;
    setForm(f => ({
      ...f,
      ...Object.fromEntries(Object.entries(dadosScv).filter(([,v]) => !!v)),
      scvImportado:true,
      dadosScvConfirmados:confirmados,
      precisaDevolucao: form.tipoPrestacao === "roteiro_reduzido" ? "sim" : "nao",
    }));
    setScvModal(false);
    setStep(1);
  }

  function cancelarImportacaoScv() {
    setScvModal(false);
    setScvEtapaModal(1);
    setScvNaoRealizada(false);
    setScvErro("");
    // Reabrindo dados já confirmados só para conferir de novo ("Revisar dados")?
    // Então cancelar apenas fecha a janela — nada foi importado agora, nada se apaga.
    if (form.dadosScvConfirmados) return;
    const fileId = form.scvArquivo?.id;
    setForm(f => ({ ...f, scvArquivo: null, scvImportado: false }));
    setDadosScv(null);
    if (fileId) {
      setAnexosContent(prev => { const n = { ...prev }; delete n[fileId]; return n; });
      deleteFileContent(fileId);
    }
  }

  function addTransladoItem() {
    setForm(f => ({ ...f, translados: [...(f.translados || []), { id: uid(), data: "", valor: "", de: "", para: "", arquivo: null }] }));
  }
  function updateTranslado(itemId, patch) {
    setForm(f => ({ ...f, translados: (f.translados || []).map(t => t.id === itemId ? { ...t, ...patch } : t) }));
  }
  function selecionarLocalTranslado(itemId, campo, valor) {
    updateTranslado(itemId, { [campo]: valor });
    if (valor === "Residência") {
      const item = (form.translados || []).find(t => t.id === itemId);
      if (item && item.arquivo && !item.arquivo.redigido) {
        setTimeout(() => openRedactForTranslado(itemId), 250);
      }
    }
  }
  function removeTransladoItem(itemId) {
    const item = (form.translados || []).find(t => t.id === itemId);
    if (item && item.arquivo) {
      deleteFileContent(item.arquivo.id);
    }
    setForm(f => ({ ...f, translados: (f.translados || []).filter(t => t.id !== itemId) }));
  }
  async function attachTransladoFile(itemId, file) {
    setFileWarnings(w => ({ ...w, [itemId]: null }));
    try {
      const resultado = await lerArquivoCorrigido(file);
      if (resultado.tamanho > MAX_ANEXO_BYTES) {
        setFileWarnings(w => ({ ...w, [itemId]: "Arquivo muito grande mesmo após o ajuste automático (máx. ~8 MB)." }));
        return;
      }
      const dataUrl = resultado.dataUrl;
      const fileId = uid();
      setAnexosContent(prev => ({ ...prev, [fileId]: dataUrl }));
      persistFile(fileId, dataUrl);
      const meta = { id: fileId, nome: file.name, tamanho: resultado.tamanho, tipo: resultado.comprimida ? "image/jpeg" : file.type };
      updateTranslado(itemId, { arquivo: meta });
    } catch (e) {
      setFileWarnings(w => ({ ...w, [itemId]: "Não foi possível ler este arquivo." }));
    }
  }
  function removeTransladoFile(itemId) {
    const item = (form.translados || []).find(t => t.id === itemId);
    if (item && item.arquivo) {
      deleteFileContent(item.arquivo.id);
      setAnexosContent(prev => { const n = { ...prev }; delete n[item.arquivo.id]; return n; });
    }
    updateTranslado(itemId, { arquivo: null });
  }

  const datasValidas = !form.dataSaida || !form.dataRetorno || form.dataRetorno >= form.dataSaida;
  const step1Valid = form.tipoPrestacao && form.numeroSolicitacao && form.nomeViajante && form.cargoFuncao && form.siglaSetor && form.origem && form.destino &&
    form.dataSaida && form.dataRetorno && form.nomeEvento && form.motivo && form.conclusao && datasValidas;

  const camposObrigatoriosEtapa1 = [
    { id: "campo-tipoPrestacao", label: "Tipo de prestação de contas", ok: !!form.tipoPrestacao },
    { id: "campo-numeroSolicitacao", label: "Número da solicitação de viagem", ok: !!form.numeroSolicitacao },
    { id: "campo-nomeViajante", label: "Nome completo do viajante", ok: !!form.nomeViajante },
    { id: "campo-cargoFuncao", label: "Cargo/Função", ok: !!form.cargoFuncao },
    { id: "campo-siglaSetor", label: "Unidade de lotação", ok: !!form.siglaSetor },
    { id: "campo-origem", label: "Origem", ok: !!form.origem },
    { id: "campo-destino", label: "Destino", ok: !!form.destino },
    { id: "campo-dataSaida", label: "Data de saída", ok: !!form.dataSaida },
    { id: "campo-dataRetorno", label: "Data de retorno", ok: !!form.dataRetorno && datasValidas },
    { id: "campo-nomeEvento", label: "Descrição do evento", ok: !!form.nomeEvento },
    { id: "campo-motivo", label: "Objetivo da participação", ok: !!String(form.motivo || "").trim() },
    { id: "campo-conclusao", label: "Conclusão", ok: !!String(form.conclusao || "").trim() },
  ];
  const camposFaltandoEtapa1 = camposObrigatoriosEtapa1.filter(c => !c.ok);
  const invalidos1 = tentouAvancarEtapa1 ? new Set(camposFaltandoEtapa1.map(c => c.id)) : new Set();

  function focarPrimeiroCampo(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => {
      const alvo = el.matches("input,select,textarea") ? el : el.querySelector("input,select,textarea");
      if (alvo) alvo.focus();
    }, 300);
  }

  function renderTransladoPreview(meta) {
    if (!meta) return null;
    const src = anexosContent[meta.id];
    const isPdf = meta.tipo === "application/pdf" || /\.pdf$/i.test(meta.nome || "");
    if (!src) {
      return <div className="translado-preview-placeholder"><Icon name="doc" size={28} /><strong>Pré-visualização indisponível</strong><small>Abra novamente o arquivo se precisar revisar este comprovante.</small></div>;
    }
    if (isPdf) {
      return <TransladoPdfThumb meta={meta} src={src} />;
    }
    return (
      <a href="#" onClick={e => { e.preventDefault(); abrirEmNovaGuia(src); }} title="Abrir em tamanho maior em outra guia">
        <img src={src} alt={meta.nome} />
      </a>
    );
  }

  function renderAnexoDireto(docId, titulo, orientacao) {
    const arquivos = form.anexos[docId] || [];
    const atendido = arquivos.length > 0;
    return (
      <div className="inline-doc-card" id={"doc-" + docId}>
        <div className="doc-item-head">
          <span className={"dot " + (atendido ? "ok" : "pend")}></span>
          <div className="doc-info">
            <div className="doc-name">{titulo} <span className="req">*</span></div>
          </div>
          {atendido && <div className="doc-status ok">✓ anexado</div>}
        </div>
        {orientacao && <div className="section-hint" style={{ margin: "9px 0 0" }}>{orientacao}</div>}
        {arquivos.length > 0 && (
          <ul className="file-chip-list">
            {arquivos.map(f => (
              <li className="file-chip" key={f.id}>
                <span className="file-chip-nome">{f.nome}</span>
                {f.redigido && <span className="redigido-tag">dados ocultados</span>}
                {!f.redigido && <button className="file-remove" style={{ color: "var(--azul)" }} onClick={() => openRedactForDoc(docId, f.id)}>Ocultar dados pessoais</button>}
                <button className="file-remove" onClick={() => removeFile(docId, f.id)}>Excluir arquivo</button>
              </li>
            ))}
          </ul>
        )}
        <label className={"file-btn " + (arquivos.length ? "plus" : "")}>
          {arquivos.length ? "+ Adicionar outro arquivo" : "Anexar comprovante"}
          <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png" className="file-input-hidden" onChange={e => { attachFiles(docId, e.target.files); e.target.value = ""; }} />
        </label>
        {fileWarnings[docId] && <div className="banner warn" style={{ marginTop: 10, marginBottom: 0 }}><Icon name="alert" size={16} /><span>{fileWarnings[docId]}</span></div>}
      </div>
    );
  }

  const step2Valid = form.transporte && (!mostraTranslado || !!form.usouTranslado) && pendingDocs.length === 0 && transladoOk && devolucaoOk;

  const itensFaltandoEtapa2 = [];
  if (!form.transporte) itensFaltandoEtapa2.push({ id: "campo-transporte", label: "Meio de transporte utilizado" });
  if (mostraTranslado && !form.usouTranslado) itensFaltandoEtapa2.push({ id: "campo-usouTranslado", label: "Resposta sobre uso de táxi/aplicativo" });
  if (mostraTranslado && form.usouTranslado === "sim" && !transladoOk) itensFaltandoEtapa2.push({ id: "campo-usouTranslado", label: "Dados do translado (trajeto, valor e comprovante)" });
  pendingDocs.forEach(d => itensFaltandoEtapa2.push({ id: "doc-" + d.id, label: d.nome }));
  const conferenciaCompleta = Object.values(conferencia).every(Boolean);
  const step3Valid = !!form.atesto && conferenciaCompleta;

  function percentualConcluido(itens) {
    if (!itens.length) return 0;
    const concluidos = itens.filter(Boolean).length;
    return Math.round((concluidos / itens.length) * 100);
  }

  const progressoEtapa1 = percentualConcluido([
    !!form.tipoPrestacao,
    !!form.numeroSolicitacao,
    !!form.nomeViajante,
    !!form.origem,
    !!form.destino,
    !!form.dataSaida,
    !!form.dataRetorno && datasValidas,
    !!form.nomeEvento,
    !!String(form.motivo || "").trim(),
    !!String(form.conclusao || "").trim(),
  ]);

  const tarefasEtapa2 = [!!form.transporte];
  if (mostraTranslado) tarefasEtapa2.push(!!form.usouTranslado);
  if (mostraTranslado && form.usouTranslado === "sim") {
    tarefasEtapa2.push(liberadoTranslado > 0, translados.length > 0);
    translados.forEach(t => {
      tarefasEtapa2.push(
        !!t.arquivo,
        !!t.data,
        parseMoeda(t.valor) > 0,
        !!t.de,
        !!t.para
      );
    });
  }
  docs.filter(d => d.obrig).forEach(d => {
    tarefasEtapa2.push(d.id === "saque" ? saqueOk : !!(form.anexos[d.id] && form.anexos[d.id].length));
  });
  if (form.precisaDevolucao === "sim") tarefasEtapa2.push(parseMoeda(form.valorDevolucao) > 0);
  const progressoEtapa2 = percentualConcluido(tarefasEtapa2);

  const progressoEtapa3 = percentualConcluido([
    conferencia.dados,
    conferencia.transporte,
    conferencia.documentos,
    conferencia.atesto,
    !!form.atesto,
  ]);

  const progressoEtapas = [progressoEtapa1, progressoEtapa2, progressoEtapa3];

  async function gerarPDF() {
    setPdfErro(null);
    if (!(window.jspdf && window.jspdf.jsPDF)) {
      setPdfErro("A biblioteca de geração de PDF ainda não carregou. Verifique sua conexão e tente novamente em instantes.");
      return;
    }
    setGerando(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const PAGE_W = 595.28, PAGE_H = 841.89;
      const margin = 48;
      const contentW = PAGE_W - margin * 2;

      // Paleta institucional (DETRAN/PR)
      const COR = {
        azul: [0, 81, 134],
        azulEscuro: [1, 58, 97],
        azulTint: [234, 241, 246],
        verde: [83, 175, 49],
        verdeTexto: [44, 90, 28],
        cinza: [107, 102, 100],
        cinzaClaro: [243, 245, 246],
        borda: [221, 226, 230],
        texto: [28, 36, 48],
      };

      let y = 0;
      let paginaAtual = 1;
      let paginaAtualJaTemRodape = false;

      function desenharTopo() {
        doc.setFillColor(...COR.azulEscuro);
        doc.rect(0, 0, PAGE_W, 5, "F");
      }

      function desenharCabecalho() {
        desenharTopo();
        const logoY = 28;
        const detranH = 42, detranW = detranH / (575 / 2123);
        const paranaH = 42, paranaW = paranaH / (129 / 297);
        try {
          doc.addImage(DETRAN_LOGO, "PNG", margin, logoY, detranW, detranH);
        } catch (e) { /* segue sem a imagem se algo falhar */ }
        try {
          doc.addImage(PARANA_LOGO, "PNG", PAGE_W - margin - paranaW, logoY + (detranH - paranaH) / 2, paranaW, paranaH);
        } catch (e) { /* segue sem a imagem se algo falhar */ }
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(...COR.cinza);
        doc.text(`Página ${paginaAtual}`, PAGE_W - margin, logoY + detranH + 10, { align: "right" });

        const barY = logoY + detranH + 16;
        const barH = 4.5;
        doc.setFillColor(...COR.azul);
        doc.rect(margin, barY, contentW, barH, "F");
        const cutStartX = margin + contentW * 0.80;
        doc.setFillColor(...COR.verde);
        doc.lines(
          [[contentW * 0.20, 0], [0, barH], [-(contentW * 0.14), 0]],
          cutStartX, barY, [1, 1], "F", true
        );
        y = barY + barH + 26;
      }

      function desenharRodape() {
        const enderecoTxt = "DETRAN-PR — Av. Victor Ferreira do Amaral, 2940 — Tarumã — 82800-900 — Curitiba — PR — 41 3361-1212";
        const siteTxt = "www.detran.pr.gov.br";
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.5);
        const enderecoW = doc.getTextWidth(enderecoTxt);
        const siteW = doc.getTextWidth(siteTxt);
        const cabeNaMesmaLinha = (enderecoW + siteW + 24) <= contentW;

        if (cabeNaMesmaLinha) {
          const textoY = PAGE_H - 38;
          doc.setTextColor(...COR.cinza);
          doc.text(enderecoTxt, margin, textoY);
          doc.setTextColor(...COR.azul);
          doc.text(siteTxt, PAGE_W - margin, textoY, { align: "right" });
        } else {
          const linha1Y = PAGE_H - 46;
          const linha2Y = PAGE_H - 35;
          doc.setTextColor(...COR.cinza);
          doc.text(enderecoTxt, margin, linha1Y);
          doc.setTextColor(...COR.azul);
          doc.text(siteTxt, margin, linha2Y);
        }

        const barY = PAGE_H - 26;
        const barH = 4.5;
        doc.setFillColor(...COR.azul);
        doc.rect(margin, barY, contentW, barH, "F");
        const cutStartX = margin + contentW * 0.80;
        doc.setFillColor(...COR.verde);
        doc.lines(
          [[contentW * 0.20, 0], [0, barH], [-(contentW * 0.14), 0]],
          cutStartX, barY, [1, 1], "F", true
        );
      }

      function desenharNumeroPagina() {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(...COR.cinza);
        doc.text(`Página ${paginaAtual}`, PAGE_W - margin, 24, { align: "right" });
      }

      function novaPagina(comCabecalho) {
        if (!paginaAtualJaTemRodape) desenharRodape();
        doc.addPage();
        paginaAtual += 1;
        paginaAtualJaTemRodape = false;
        if (comCabecalho) {
          desenharCabecalho();
        } else {
          desenharTopo();
          desenharNumeroPagina();
          y = 30;
        }
      }

      function garantirEspaco(altura) {
        if (y + altura > PAGE_H - 64) novaPagina(false);
      }

      function desenharIconeBadge(icone, cx, cy, r) {
        doc.setFillColor(...COR.azulTint);
        doc.circle(cx, cy, r, "F");
        doc.setDrawColor(...COR.azul);
        doc.setFillColor(...COR.azul);
        doc.setLineWidth(1);
        const s = r * 0.5;
        switch (icone) {
          case "pessoa":
            doc.circle(cx, cy - s * 0.4, s * 0.42, "F");
            doc.ellipse(cx, cy + s * 0.55, s * 0.68, s * 0.42, "F");
            break;
          case "pin":
            doc.circle(cx, cy - s * 0.15, s * 0.42, "S");
            doc.triangle(cx - s * 0.3, cy + s * 0.1, cx + s * 0.3, cy + s * 0.1, cx, cy + s * 0.8, "F");
            break;
          case "calendario":
            doc.roundedRect(cx - s * 0.6, cy - s * 0.45, s * 1.2, s * 0.95, 1, 1, "S");
            doc.line(cx - s * 0.6, cy - s * 0.12, cx + s * 0.6, cy - s * 0.12);
            doc.line(cx - s * 0.3, cy - s * 0.62, cx - s * 0.3, cy - s * 0.28);
            doc.line(cx + s * 0.3, cy - s * 0.62, cx + s * 0.3, cy - s * 0.28);
            break;
          case "maleta":
            doc.roundedRect(cx - s * 0.62, cy - s * 0.22, s * 1.24, s * 0.78, 1, 1, "S");
            doc.roundedRect(cx - s * 0.24, cy - s * 0.55, s * 0.48, s * 0.34, 1, 1, "S");
            break;
          case "doc":
            doc.roundedRect(cx - s * 0.46, cy - s * 0.68, s * 0.92, s * 1.36, 1, 1, "S");
            doc.line(cx - s * 0.22, cy - s * 0.2, cx + s * 0.22, cy - s * 0.2);
            doc.line(cx - s * 0.22, cy + s * 0.08, cx + s * 0.22, cy + s * 0.08);
            doc.line(cx - s * 0.22, cy + s * 0.36, cx + s * 0.1, cy + s * 0.36);
            break;
          case "alvo":
            doc.circle(cx, cy, s * 0.68, "S");
            doc.circle(cx, cy, s * 0.34, "S");
            doc.circle(cx, cy, s * 0.1, "F");
            break;
          case "check":
            doc.circle(cx, cy, s * 0.68, "S");
            doc.lines([[s * 0.24, -s * 0.26], [s * 0.42, s * 0.5]], cx - s * 0.36, cy + s * 0.06, [1, 1], "S");
            break;
          case "info":
            doc.circle(cx, cy, s * 0.68, "S");
            doc.circle(cx, cy - s * 0.32, 1, "F");
            doc.line(cx, cy - s * 0.02, cx, cy + s * 0.42);
            break;
          default:
            break;
        }
        doc.setLineWidth(0.75);
      }

      function tituloComIcone(icone, texto) {
        const cx0 = margin + 13, r = 13;
        const textX = cx0 + r + 11;
        const maxTextW = contentW - (r * 2 + 11) - 55;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13.5);
        const linhas = doc.splitTextToSize(texto, maxTextW);
        const altura = Math.max(34, 12 + linhas.length * 16);
        garantirEspaco(altura);
        const cy = y + 10;
        desenharIconeBadge(icone, cx0, cy, r);
        doc.setTextColor(...COR.texto);
        doc.text(linhas, textX, y + 14);
        if (linhas.length === 1) {
          const textW = doc.getTextWidth(linhas[0]);
          const lineStartX = textX + textW + 10;
          const lineEndX = margin + contentW - 16;
          if (lineEndX - lineStartX > 20) {
            doc.setDrawColor(...COR.borda);
            doc.setLineDashPattern([2, 1.5], 0);
            doc.setLineWidth(0.8);
            doc.line(lineStartX, cy, lineEndX, cy);
            doc.setLineDashPattern([], 0);
            doc.setFillColor(...COR.azul);
            doc.triangle(lineEndX + 3, cy - 5, lineEndX + 14, cy, lineEndX + 3, cy + 5, "F");
          }
        }
        y += altura;
      }

      function tabelaCampos(campos) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12.5);
        const alturas = campos.map(c => {
          const linhas = doc.splitTextToSize(String(c.valor || "—"), contentW - 56);
          return { linhas, altura: Math.max(38, 20 + linhas.length * 15) };
        });
        const alturaTotal = alturas.reduce((acc, a) => acc + a.altura, 0);
        garantirEspaco(alturaTotal + 12);
        const startY = y;
        doc.setDrawColor(...COR.borda);
        doc.setLineWidth(1);
        doc.roundedRect(margin, startY, contentW, alturaTotal, 6, 6, "S");
        let cursorY = startY;
        campos.forEach((c, i) => {
          const { linhas, altura } = alturas[i];
          if (i > 0) {
            doc.setDrawColor(...COR.borda);
            doc.setLineWidth(0.75);
            doc.line(margin, cursorY, margin + contentW, cursorY);
          }
          if (c.icone) desenharIconeBadge(c.icone, margin + 21, cursorY + altura / 2, 11);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(9.5);
          doc.setTextColor(...COR.cinza);
          doc.text(c.label.toUpperCase(), margin + 42, cursorY + 15);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(12.5);
          doc.setTextColor(...COR.texto);
          doc.text(linhas, margin + 42, cursorY + 30);
          cursorY += altura;
        });
        y = startY + alturaTotal + 12;
      }

      function caixaCampo(label, valor, icone) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12.5);
        const indent = icone ? 42 : 14;
        const linhas = doc.splitTextToSize(String(valor || "—"), contentW - indent - 14);
        const altura = Math.max(46, 28 + linhas.length * 15);
        garantirEspaco(altura + 9);
        doc.setFillColor(...COR.cinzaClaro);
        doc.roundedRect(margin, y, contentW, altura, 5, 5, "F");
        if (icone) desenharIconeBadge(icone, margin + 21, y + altura / 2, 12);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(...COR.cinza);
        doc.text(label.toUpperCase(), margin + indent, y + 16);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(13);
        doc.setTextColor(...COR.texto);
        doc.text(linhas, margin + indent, y + 32);
        y += altura + 9;
      }

      // ---- Renderização em HTML: todas as páginas do PDF usam o mesmo visual do sistema ----
      if (!window.html2canvas) throw new Error("Gerador visual indisponível");

      async function htmlParaImagem(elemento) {
        const container = document.createElement("div");
        container.style.cssText = "position:fixed;left:-12000px;top:0;width:794px;background:#ffffff;z-index:-1;";
        document.body.appendChild(container);
        const raiz = ReactDOM.createRoot(container);
        raiz.render(elemento);
        await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 70)));
        const imagens = Array.from(container.querySelectorAll("img"));
        await Promise.all(imagens.map(im => im.complete ? Promise.resolve() : new Promise(res => { im.onload = im.onerror = res; })));
        const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false, windowWidth: 794 });
        raiz.unmount();
        container.remove();
        return canvas.toDataURL("image/jpeg", 0.92);
      }

      function adicionarPaginaImagem(imgData, primeira) {
        if (!primeira) doc.addPage();
        const props = doc.getImageProperties(imgData);
        const prop = props.width / props.height;
        let w = PAGE_W, h = w / prop;
        if (h > PAGE_H) { h = PAGE_H; w = h * prop; }
        const fmt = imgData.startsWith("data:image/png") ? "PNG" : "JPEG";
        doc.addImage(imgData, fmt, (PAGE_W - w) / 2, (PAGE_H - h) / 2, w, h);
      }

      // ---- Páginas de comprovante (uma para cada arquivo anexado) ----
      async function obterPaginasComoImagens(meta, contentDataUrl) {
        const nomeArquivo = (meta.nome || "").toLowerCase();
        const isPdf = meta.tipo === "application/pdf" || nomeArquivo.endsWith(".pdf");
        if (!isPdf) {
          // Fotos de celular podem ter 10+ MB; reduzimos para no máx. 1600px e JPEG
          // comprimido — qualidade mais que suficiente para leitura, arquivo muito menor.
          try {
            const img = await loadImageEl(contentDataUrl);
            const maxDim = 1600;
            const escala = Math.min(1, maxDim / Math.max(img.width, img.height));
            const cnv = document.createElement("canvas");
            cnv.width = Math.round(img.width * escala);
            cnv.height = Math.round(img.height * escala);
            const ctx = cnv.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, cnv.width, cnv.height);
            ctx.drawImage(img, 0, 0, cnv.width, cnv.height);
            return [cnv.toDataURL("image/jpeg", 0.85)];
          } catch (e) {
            return [contentDataUrl];
          }
        }
        if (!window.pdfjsLib) throw new Error("Leitor de PDF indisponível");
        const bytes = dataUrlToBytes(contentDataUrl);
        const pdfDoc = await window.pdfjsLib.getDocument({ data: bytes }).promise;
        const paginas = [];
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const pagina = await pdfDoc.getPage(i);
          const viewport = pagina.getViewport({ scale: 1.5 });
          const cnv = document.createElement("canvas");
          cnv.width = viewport.width;
          cnv.height = viewport.height;
          const ctx = cnv.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, cnv.width, cnv.height);
          await pagina.render({ canvasContext: ctx, viewport }).promise;
          paginas.push(cnv.toDataURL("image/jpeg", 0.85));
        }
        return paginas;
      }

      // ---- Preparar anexos (converte cada arquivo em imagens de página) ----
      const anexosPreparados = [];
      async function prepararDocs(listaDocs) {
        for (const d of listaDocs) {
          const arquivos = form.anexos[d.id] || [];
          for (let i = 0; i < arquivos.length; i++) {
            const meta = arquivos[i];
            const titulo = arquivos.length > 1 ? `${d.nome} (${i + 1}/${arquivos.length})` : d.nome;
            let imagens = [];
            if (anexosContent[meta.id]) {
              try { imagens = await obterPaginasComoImagens(meta, anexosContent[meta.id]); } catch (e) { imagens = []; }
            }
            anexosPreparados.push({ tipo: "doc", titulo, imagens, redigido: !!meta.redigido });
          }
        }
      }
      await prepararDocs(docs.filter(d => d.id !== "comprobatorio"));
      const transladosParaAnexar = (mostraTranslado && form.usouTranslado === "sim") ? translados.filter(t => t.arquivo) : [];
      if (transladosParaAnexar.length) {
        const itens = [];
        for (const t of transladosParaAnexar) {
          let imgs = [];
          if (anexosContent[t.arquivo.id]) {
            try { imgs = await obterPaginasComoImagens(t.arquivo, anexosContent[t.arquivo.id]); } catch (e) { imgs = []; }
          }
          itens.push({ de: t.de, para: t.para, data: t.data, valor: t.valor, imagens: imgs, redigido: !!t.arquivo.redigido });
        }
        anexosPreparados.push({ tipo: "translados", itens });
      }
      await prepararDocs(docs.filter(d => d.id === "comprobatorio"));

      const totalAnexosPdf = anexosPreparados.length;
      let totalPaginasPdf = 1;
      anexosPreparados.forEach(a => {
        if (a.tipo === "doc") totalPaginasPdf += Math.max(1, a.imagens.length);
        else totalPaginasPdf += a.itens.reduce((acc, t) => acc + Math.max(1, Math.ceil((t.imagens.length || 1) / 2)), 0) + 1;
      });

      // ---- Página 1 ----
      const imgPagina1 = await htmlParaImagem(<ReportPreview form={form} modoPdf paginaTexto={`Página 1 de ${totalPaginasPdf}`} />);
      adicionarPaginaImagem(imgPagina1, true);

      // ---- Páginas de anexo (desenhadas diretamente no PDF — rápido) ----
      let paginaPdfAtual = 1; // a página 1 é o relatório técnico

      // Paleta aproximada do layout aprovado
      const MX = {
        navy: [2, 53, 110],
        verdeIcone: [63, 155, 47],
        verdeVivo: [100, 183, 69],
        verdeClaro: [243, 250, 238],
        verdeBorda: [191, 224, 174],
        verdeTexto: [44, 110, 28],
        verdeValor: [44, 138, 18],
        cinzaFundo: [242, 244, 246],
        cinzaBorda: [227, 232, 236],
        texto: [49, 66, 79],
        cinzaTxt: [106, 119, 130],
        azulPill: [0, 81, 134],
        azulPillFundo: [238, 244, 250],
        azulPillBorda: [216, 230, 242],
      };

      function cabecalhoAnexo() {
        doc.addPage();
        paginaPdfAtual += 1;
        const logoY = 30;
        const detranH = 30, detranW = detranH / (575 / 2123);
        const paranaH = 33, paranaW = paranaH / (129 / 297);
        try { doc.addImage(DETRAN_LOGO, "PNG", margin, logoY, detranW, detranH); } catch (e) {}
        try { doc.addImage(PARANA_LOGO, "PNG", PAGE_W - margin - paranaW, logoY + (detranH - paranaH) / 2, paranaW, paranaH); } catch (e) {}
        const barY = logoY + detranH + 14;
        doc.setFillColor(...MX.navy);
        doc.roundedRect(margin, barY, contentW, 3.5, 1.75, 1.75, "F");
        doc.setFillColor(...MX.verdeVivo);
        doc.roundedRect(margin + contentW * 0.86, barY, contentW * 0.14, 3.5, 1.75, 1.75, "F");
        y = barY + 3.5 + 24;
      }

      function desenharIconeCarroBranco(cx, cy, s) {
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cx - s * 0.30, cy - s * 0.28, s * 0.60, s * 0.26, s * 0.07, s * 0.07, "F");
        doc.roundedRect(cx - s * 0.46, cy - s * 0.10, s * 0.92, s * 0.30, s * 0.07, s * 0.07, "F");
        doc.circle(cx - s * 0.24, cy + s * 0.30, s * 0.10, "F");
        doc.circle(cx + s * 0.24, cy + s * 0.30, s * 0.10, "F");
      }

      function desenharIconeDocBranco(cx, cy, s) {
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(cx - s * 0.26, cy - s * 0.36, s * 0.52, s * 0.72, s * 0.05, s * 0.05, "F");
        doc.setDrawColor(...MX.verdeIcone);
        doc.setLineWidth(1.3);
        for (let li = -1; li <= 1; li++) doc.line(cx - s * 0.14, cy + li * s * 0.15, cx + s * 0.14, cy + li * s * 0.15);
      }

      function tituloAnexo(numero, titulo, tipoIcone) {
        const boxS = 38;
        doc.setFillColor(...MX.verdeIcone);
        doc.roundedRect(margin, y, boxS, boxS, 10, 10, "F");
        if (tipoIcone === "carro") desenharIconeCarroBranco(margin + boxS / 2, y + boxS / 2, 22);
        else desenharIconeDocBranco(margin + boxS / 2, y + boxS / 2, 21);
        const tx = margin + boxS + 13;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(...MX.verdeIcone);
        doc.text(`ANEXO ${String(numero).padStart(2, "0")}`, tx, y + 14);
        doc.setFontSize(15.5);
        doc.setTextColor(...MX.navy);
        const linhasTitulo = doc.splitTextToSize(String(titulo || "").toUpperCase(), contentW - boxS - 13);
        doc.text(linhasTitulo[0], tx, y + 32);
        y += boxS + 16;
      }

      function pilulaDadosOcultados(baseY) {
        const txt = "Documento com dados pessoais ocultados para publicação.";
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        const tw = doc.getTextWidth(txt);
        const pw = tw + 48, ph = 24;
        const px = (PAGE_W - pw) / 2;
        doc.setFillColor(...MX.azulPillFundo);
        doc.setDrawColor(...MX.azulPillBorda);
        doc.setLineWidth(1);
        doc.roundedRect(px, baseY, pw, ph, 9, 9, "FD");
        doc.setDrawColor(...MX.azulPill);
        doc.setLineWidth(1.1);
        doc.circle(px + 17, baseY + ph / 2, 6, "S");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(...MX.azulPill);
        doc.text("i", px + 17, baseY + ph / 2 + 2.6, { align: "center" });
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.text(txt, px + 30, baseY + ph / 2 + 3.2);
      }

      function rodapePaginaAnexo() {
        const linhaY = PAGE_H - 40;
        doc.setFillColor(...MX.navy);
        doc.roundedRect(margin, linhaY - 17, contentW * 0.84, 2.2, 1.1, 1.1, "F");
        doc.setFillColor(...MX.verdeVivo);
        doc.roundedRect(margin + contentW * 0.88, linhaY - 17, contentW * 0.12, 2.2, 1.1, 1.1, "F");
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(...MX.texto);
        doc.text("DETRAN/PR", margin, linhaY);
        const wDet = doc.getTextWidth("DETRAN/PR");
        doc.setFont("helvetica", "normal");
        doc.setTextColor(...MX.cinzaTxt);
        doc.text("  |  Sistema de Prestação de Contas de Viagem", margin + wDet, linhaY);
        doc.text(`Solicitação: ${form.numeroSolicitacao || "—"}`, PAGE_W / 2 + 46, linhaY, { align: "center" });
        doc.setTextColor(...MX.texto);
        doc.text(`Página ${paginaPdfAtual} de ${totalPaginasPdf}`, PAGE_W - margin, linhaY, { align: "right" });
        const bh = 12;
        doc.setFillColor(...MX.navy);
        doc.rect(0, PAGE_H - bh, PAGE_W, bh, "F");
        doc.setFillColor(...MX.verdeVivo);
        doc.rect(PAGE_W * 0.86, PAGE_H - bh, PAGE_W * 0.14, bh, "F");
      }

      function paginaAnexoDoc(numero, titulo, imagem, continuacao, redigido, tipoIcone) {
        cabecalhoAnexo();
        tituloAnexo(numero, titulo + (continuacao ? " (CONTINUAÇÃO)" : ""), tipoIcone);
        const pilulaH = redigido ? 34 : 0;
        const frameTop = y;
        const frameBottom = PAGE_H - 72 - pilulaH;
        const frameH = frameBottom - frameTop;
        doc.setDrawColor(...MX.cinzaBorda);
        doc.setLineWidth(1);
        doc.roundedRect(margin, frameTop, contentW, frameH, 10, 10, "S");
        if (!imagem) {
          doc.setFont("helvetica", "italic");
          doc.setFontSize(10.5);
          doc.setTextColor(...MX.cinzaTxt);
          doc.text("Conteúdo do arquivo não disponível nesta sessão — reanexe o documento.", PAGE_W / 2, frameTop + frameH / 2, { align: "center" });
        } else {
          try {
            const props = doc.getImageProperties(imagem);
            const maxW = contentW - 28, maxH = frameH - 28;
            const esc = Math.min(maxW / props.width, maxH / props.height);
            const w = props.width * esc, h = props.height * esc;
            doc.addImage(imagem, margin + (contentW - w) / 2, frameTop + (frameH - h) / 2, w, h);
          } catch (e) {}
        }
        if (redigido) pilulaDadosOcultados(frameBottom + 6);
        rodapePaginaAnexo();
      }

      function camposDoTranslado(t, topoY) {
        const camposT = [["Origem", t.de], ["Destino", t.para], ["Data do translado", formatDateBR(t.data)], ["Valor do comprovante", t.valor]];
        const colW = (contentW - 28) / 4;
        camposT.forEach(([rotulo, valor], i) => {
          const x0 = margin + 14 + colW * i;
          if (i > 0) { doc.setDrawColor(...MX.cinzaBorda); doc.line(x0, topoY, x0, topoY + 25); }
          const tx = i > 0 ? x0 + 10 : x0;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.setTextColor(...MX.texto);
          doc.text(rotulo, tx, topoY + 8);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(...MX.cinzaTxt);
          const vv = doc.splitTextToSize(String(valor || "—"), colW - 14)[0] || "—";
          doc.text(vv, tx, topoY + 20);
        });
        doc.setDrawColor(...MX.cinzaBorda);
        doc.line(margin + 14, topoY + 31, PAGE_W - margin - 14, topoY + 31);
        return topoY + 39;
      }

      function desenharPaginaTranslado(numeroAnexo, seqTranslado, t, imagensPar, indicePrimeira, totalPaginasArquivo) {
        cabecalhoAnexo();
        tituloAnexo(numeroAnexo, "COMPROVANTE DE TRANSLADO", "carro");
        const pilulaH = t.redigido ? 34 : 0;
        const areaBottom = PAGE_H - 72 - pilulaH;
        // Card único do translado ocupando a área útil da página
        doc.setDrawColor(...MX.cinzaBorda);
        doc.setLineWidth(1);
        doc.roundedRect(margin, y, contentW, areaBottom - y, 10, 10, "S");
        const seq = String(seqTranslado + 1).padStart(2, "0");
        const hx = margin + 14, hy = y + 13;
        doc.setFillColor(...MX.verdeIcone);
        doc.roundedRect(hx, hy, 20, 20, 5, 5, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(255, 255, 255);
        doc.text(seq, hx + 10, hy + 13.5, { align: "center" });
        doc.setFontSize(11.5);
        doc.setTextColor(...MX.navy);
        doc.text(`TRANSLADO ${seq}`, hx + 28, hy + 14);
        const imgTop = camposDoTranslado(t, y + 44);
        const imgBottom = areaBottom - 26; // reserva espaço para a legenda "Página X de Y"
        const areaH = imgBottom - imgTop;
        const validas = imagensPar.filter(Boolean);
        if (!validas.length) {
          doc.setFont("helvetica", "italic");
          doc.setFontSize(9.5);
          doc.setTextColor(...MX.cinzaTxt);
          doc.text("Comprovante não disponível nesta sessão — reanexe o documento.", PAGE_W / 2, (imgTop + imgBottom) / 2, { align: "center" });
        } else {
          const lado = validas.length; // 1 ou 2 imagens lado a lado
          const gapImg = 16;
          const larguraCol = lado === 1 ? contentW * 0.62 : (contentW - 28 - gapImg) / 2;
          validas.forEach((img, i) => {
            try {
              const props = doc.getImageProperties(img);
              const esc = Math.min(larguraCol / props.width, areaH / props.height);
              const w = props.width * esc, h = props.height * esc;
              const cx = lado === 1
                ? margin + contentW / 2
                : margin + 14 + larguraCol * i + gapImg * i + larguraCol / 2;
              const ix = cx - w / 2;
              const iy = imgTop + (areaH - h) / 2;
              doc.addImage(img, ix, iy, w, h);
              if (totalPaginasArquivo > 1) {
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8.5);
                doc.setTextColor(...MX.cinzaTxt);
                doc.text(`Página ${indicePrimeira + i + 1} de ${totalPaginasArquivo}`, cx, areaBottom - 10, { align: "center" });
              }
            } catch (e) {}
          });
        }
        if (t.redigido) pilulaDadosOcultados(areaBottom + 6);
        rodapePaginaAnexo();
      }

      function desenharPaginaResumoTranslados(numeroAnexo, qtd, valorTotal) {
        cabecalhoAnexo();
        tituloAnexo(numeroAnexo, "COMPROVANTE DE TRANSLADO — RESUMO", "carro");
        const h = 56;
        doc.setFillColor(...MX.verdeClaro);
        doc.setDrawColor(...MX.verdeBorda);
        doc.setLineWidth(1.2);
        doc.roundedRect(margin, y, contentW, h, 10, 10, "FD");
        doc.setFillColor(...MX.verdeIcone);
        doc.roundedRect(margin + 14, y + h / 2 - 16, 32, 32, 8, 8, "F");
        desenharIconeDocBranco(margin + 30, y + h / 2, 18);
        const tx = margin + 58;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(...MX.verdeTexto);
        doc.text("Resumo dos translados", tx, y + 18);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.setTextColor(...MX.texto);
        doc.text(`${qtd} comprovante${qtd > 1 ? "s" : ""} apresentado${qtd > 1 ? "s" : ""}`, tx, y + 32);
        doc.setFont("helvetica", "bold");
        doc.text("Valor total: ", tx, y + 45);
        const wl = doc.getTextWidth("Valor total: ");
        doc.setTextColor(...MX.verdeValor);
        doc.text(moedaBR(valorTotal), tx + wl, y + 45);
        rodapePaginaAnexo();
      }

      for (let n = 0; n < anexosPreparados.length; n++) {
        const a = anexosPreparados[n];
        const numero = n + 1;
        if (a.tipo === "doc") {
          const tipoIcone = /ve[íi]cul|di[áa]rio/i.test(a.titulo) ? "carro" : "doc";
          const paginas = a.imagens.length ? a.imagens : [null];
          for (let pi = 0; pi < paginas.length; pi++) {
            paginaAnexoDoc(numero, a.titulo, paginas[pi], pi > 0, a.redigido, tipoIcone);
          }
        } else {
          const valorTotal = a.itens.reduce((acc, t) => acc + parseMoeda(t.valor), 0);
          for (let i = 0; i < a.itens.length; i++) {
            const t = a.itens[i];
            const imgs = t.imagens.length ? t.imagens : [null];
            for (let p = 0; p < imgs.length; p += 2) {
              desenharPaginaTranslado(numero, i, t, imgs.slice(p, p + 2), p, t.imagens.length);
            }
          }
          desenharPaginaResumoTranslados(numero, a.itens.length, valorTotal);
        }
      }

      const finalBytes = doc.output("arraybuffer");
      downloadBytes(new Uint8Array(finalBytes), `prestacao_contas_${form.numeroSolicitacao || "sem_numero"}.pdf`);
      setPdfGeradoUmaVez(true);
      setPdfConcluido(true);
    } catch (e) {
      setPdfErro("Não foi possível gerar o PDF (" + (e && e.message ? e.message : "erro desconhecido") + "). Tente novamente ou reduza o tamanho dos anexos.");
    } finally {
      setGerando(false);
    }
  }

  const steps = [
    { title: "Solicitação e dados", desc: "Informações da viagem e do solicitante", icon: "pessoa" },
    { title: "Transporte e comprovantes", desc: "Detalhes dos gastos e anexos", icon: "maleta" },
    { title: "Revisão e PDF", desc: "Confira e gere seu relatório final", icon: "doc" },
  ];
  const totalArquivos = Object.values(form.anexos).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0) + translados.filter(t => t.arquivo).length;
  const arquivosRevisao = [];
  docs.filter(d => d.id !== "comprobatorio").forEach(d => {
    const arquivos = form.anexos[d.id] || [];
    arquivos.forEach(f => arquivosRevisao.push({ categoria: d.nome, nome: f.nome }));
    if (d.id === "saque" && !arquivos.length && form.saqueComprovante === "nao" && form.justificativas.saque) {
      arquivosRevisao.push({ categoria: d.nome, nome: "Justificativa registrada no sistema" });
    }
  });
  translados.forEach((t, i) => {
    if (mostraTranslado && t.arquivo) arquivosRevisao.push({ categoria: `Comprovante de translado ${i + 1}: ${t.de || "origem"} → ${t.para || "destino"}`, nome: t.arquivo.nome });
  });
  docs.filter(d => d.id === "comprobatorio").forEach(d => (form.anexos[d.id] || []).forEach(f => arquivosRevisao.push({ categoria: d.nome, nome: f.nome })));

  function irParaMinhasPrestacoes() {
    const url = new URL(window.location.href);
    url.searchParams.delete("rascunho");
    window.location.href = url.toString();
  }

  function salvarRascunhoLocal({ silencioso = false } = {}) {
    try {
      const conteudo = JSON.stringify({ versao: 3, salvoEm: new Date().toISOString(), form, anexosContent });
      const blob = new Blob([conteudo], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `prestacao_contas_${form.numeroSolicitacao || "sem_numero"}_editavel.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1800);
      if (!silencioso) setDraftMessage("Arquivo de edição baixado com sucesso.");
      return true;
    } catch (e) {
      if (!silencioso) setDraftMessage("Não foi possível criar o arquivo para edição. Tente novamente.");
      return false;
    }
  }

  function carregarRascunhoLocal(event) {
    const arquivo = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!arquivo) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const dados = JSON.parse(reader.result);
        if (!dados || !dados.form) throw new Error("inválido");
        setForm({ ...emptyForm, ...dados.form });
        setAnexosContent(dados.anexosContent || {});
        setConferencia({ dados: false, transporte: false, documentos: false, atesto: false });
        setStep(1);
        setModoInicio("editar");
        setArquivoEdicaoCarregado(true);
        setDraftMessage("Prestação aberta para edição. Confira as informações antes de continuar.");
      } catch (e) {
        setDraftMessage("Este não é um arquivo de edição válido do Sistema de Prestação de Contas.");
      }
    };
    reader.readAsText(arquivo);
  }

      form.scvImportado || form.numeroSolicitacao || form.nomeViajante || form.transporte ||
      Object.values(form.anexos || {}).some(lista => (lista || []).length) ||
      (form.translados || []).length

      const continuar = window.confirm("Ao começar uma nova prestação, os dados atuais serão apagados. Deseja continuar?");
      if (!continuar) return;
    }
    setForm(emptyForm);
    setAnexosContent({});
    setFileWarnings({});
    setDadosScv(null);
    setScvErro("");
    setScvNaoRealizada(false);
    setConferencia({ dados: false, transporte: false, documentos: false, atesto: false });
    setArquivoEdicaoCarregado(false);
    setDraftMessage("");
    setStep(1);
    setModoInicio("nova");
    importarSolicitacaoSCV(file);
  }

                {step === 3 && <ul><li>A conferência é feita item por item, sem pressa.</li><li>Depois de gerar o PDF, ainda dá para corrigir usando o arquivo de rascunho baixado.</li></ul>}
              </div>

              <div className="side-card">
                <h3><Icon name="check" size={16} /> Situação do preenchimento</h3>
                <div className="check-row"><span className={"dot " + (step1Valid ? "ok" : "pend")}></span> Dados da viagem</div>
                <div className="check-row"><span className={"dot " + (form.transporte ? "ok" : "pend")}></span> Meio de transporte</div>
                {mostraTranslado && <div className="check-row"><span className={"dot " + (form.usouTranslado ? "ok" : "pend")}></span> Pergunta sobre translado</div>}
                {mostraTranslado && <div className="check-row"><span className={"dot " + (transladoOk ? "ok" : "pend")}></span> Comprovantes de translado</div>}
                <div className="check-row"><span className={"dot " + (pendingDocs.length === 0 && form.transporte ? "ok" : "pend")}></span> Documentos obrigatórios</div>
                <div className="check-row"><span className={"dot " + (devolucaoOk ? "ok" : "pend")}></span> Devoluções aplicáveis</div>
                <div className="check-row"><span className={"dot " + (form.atesto && conferenciaCompleta ? "ok" : "pend")}></span> Conferência e atesto</div>
              </div>
            </aside>
          </div>
            </div>
          </div>
        </div>
      </div>

      <div className="band footer-links-bar">
        <div className="band-inner">
          <span className="footer-pill"><Icon name="doc" size={14} /> Manual de Procedimentos</span>
        </div>
      </div>

      <div className="band site-footer">
        <div className="band-inner">
          <img className="gov-logo-footer" src={PARANA_LOGO} alt="Governo do Estado do Paraná" />
          <div className="footer-divider" />
          <div className="endereco">
            <b>Departamento de Trânsito do Paraná — DETRAN/PR</b>
            Av. Victor Ferreira do Amaral, 2940 — Tarumã — 82800-900 — Curitiba/PR
            <div className="endereco-contato">Central de Viagens — Ramal 1124 · Passagens Aéreas — Ramal 1312</div>
          </div>
        </div>
      </div>

      <a
        className="whatsapp-float"
        href={WHATSAPP_CENTRAL ? `https://wa.me/${WHATSAPP_CENTRAL}?text=${encodeURIComponent("Olá! Preciso de ajuda com a prestação de contas de viagem do DETRAN/PR.")}` : "#"}
        target={WHATSAPP_CENTRAL ? "_blank" : undefined}
        rel="noreferrer"
        aria-label="Falar com a Central de Viagens pelo WhatsApp"
        title="Central de Viagens — Fale conosco no WhatsApp"
        onClick={e => { if (!WHATSAPP_CENTRAL) { e.preventDefault(); alert("O número do WhatsApp da Central de Viagens ainda será fornecido pela TI."); } }}
      >
        <span className="whatsapp-float-icon"><Icon name="whatsapp" size={28} /></span>
        <span className="whatsapp-float-text"><strong>Central de Viagens</strong><small>Fale conosco no WhatsApp</small></span>
      </a>

      {scvModal && (
        <div className="redact-overlay">
          <div className="preview-modal" style={{ width:"min(760px,100%)" }}>
            <div className="redact-head">
              <h3>{scvEtapaModal === 1 ? "Passo 1 de 2 — Confira os dados do PDF" : "Passo 2 de 2 — Tipo de prestação de contas"}</h3>
              <button className="redact-close" onClick={cancelarImportacaoScv}><Icon name="close" size={18} /></button>
            </div>
            <div className="preview-modal-body">
              {scvEtapaModal === 1 && dadosScv && (
                <>
                  <div className="scv-review-grid">
                    {[['Solicitação',dadosScv.numeroSolicitacao],['Viajante',dadosScv.nomeViajante],['Tipo da viagem',dadosScv.tipoViagemScv],['Descrição do evento',dadosScv.nomeEvento],['Origem',dadosScv.origem],['Destino',dadosScv.destino],['Saída',formatDateBR(dadosScv.dataSaida)],['Retorno',formatDateBR(dadosScv.dataRetorno)],['Transporte',TRANSPORTES.find(t=>t.id===dadosScv.transporte)?.label]].map(([l,v]) => <div className="scv-review-item" key={l}><span>{l}</span><strong>{v || 'Não identificado'}</strong></div>)}
                  </div>
                  <div className="banner info" style={{ marginTop:14, marginBottom:0 }}><Icon name="info" size={17}/><span>Confira os dados acima. O leitor automático pode não reconhecer algum campo quando o PDF tiver formato diferente. Você poderá editar qualquer informação no formulário.</span></div>
                </>
              )}
              {scvEtapaModal === 2 && (
                <>
                  <p className="section-hint" style={{ marginTop:0 }}>Esta escolha define o fluxo da prestação de contas.</p>
                  <div className="scv-type-grid">
                    <button type="button" className={"scv-type-card " + (form.tipoPrestacao === "roteiro_sem_alteracao" ? "selected" : "")} onClick={() => { update({ tipoPrestacao:"roteiro_sem_alteracao", precisaDevolucao:"nao", valorDevolucao:"" }); setScvNaoRealizada(false); }}><strong>Roteiro sem alteração</strong><span>A viagem aconteceu conforme o período e o roteiro autorizados.</span></button>
                    <button type="button" className={"scv-type-card " + (form.tipoPrestacao === "roteiro_reduzido" ? "selected" : "")} onClick={() => { update({ tipoPrestacao:"roteiro_reduzido", precisaDevolucao:"sim" }); setScvNaoRealizada(false); }}><strong>Roteiro reduzido</strong><span>O viajante retornou antes ou realizou período menor que o autorizado.</span></button>
                    <button type="button" className="scv-type-card disabled" onClick={() => setScvNaoRealizada(true)}><strong>Viagem não realizada</strong><span>Não utiliza este relatório. A justificativa deve ser registrada no sistema oficial da Central de Viagens.</span></button>
                  </div>
                  {scvNaoRealizada && <div className="banner warn" style={{ marginTop:14 }}><Icon name="alert" size={17}/><span>Feche esta janela e continue diretamente no SCV.</span></div>}
                </>
              )}
            </div>
            <div className="redact-actions">
              <div className="left-group">
                {scvEtapaModal === 1 ? (
                  <button className="btn btn-ghost" onClick={cancelarImportacaoScv}>Cancelar</button>
                ) : (
                  <button className="btn btn-ghost" onClick={() => setScvEtapaModal(1)}>Voltar</button>
                )}
              </div>
              <div className="right-group">
                {scvEtapaModal === 1 ? (
                  <button className="btn btn-primary" onClick={() => setScvEtapaModal(2)}>Continuar</button>
                ) : (
                  <button className="btn btn-primary" disabled={!form.tipoPrestacao || scvNaoRealizada} onClick={() => aplicarDadosScv(true)}>Confirmar informações</button>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {mostrarConferencia && (
        <div className="redact-overlay" onClick={e => { if (e.target === e.currentTarget) setMostrarConferencia(false); }}>
          <div className="redact-modal" style={{ width: "min(650px, 100%)" }}>
            <div className="redact-head"><h3>Conferência rápida antes do atesto</h3><button className="redact-close" onClick={() => setMostrarConferencia(false)}><Icon name="close" size={18} /></button></div>
            <div style={{ padding: "18px 24px 4px", color: "var(--cinza)", fontSize: 14.5 }}>Confirme cada declaração. Leia com atenção antes de marcar.</div>
            <div style={{ padding: "0 24px 20px", overflowY: "auto" }}>
              <div className="conference-list">
                <label className="conference-item"><input type="checkbox" checked={conferencia.dados} onChange={e => setConferencia(c => ({ ...c, dados: e.target.checked }))} /><span>Conferi os dados da viagem, as datas, a origem, o destino e as informações do relatório técnico.</span></label>
                <label className="conference-item"><input type="checkbox" checked={conferencia.transporte} onChange={e => setConferencia(c => ({ ...c, transporte: e.target.checked }))} /><span>Conferi o meio de transporte, os deslocamentos de translado e os valores informados.</span></label>
                <label className="conference-item"><input type="checkbox" checked={conferencia.documentos} onChange={e => setConferencia(c => ({ ...c, documentos: e.target.checked }))} /><span>Conferi os nomes dos arquivos e confirmo que os comprovantes correspondem a esta viagem.</span></label>
                <label className="conference-item"><input type="checkbox" checked={conferencia.atesto} onChange={e => setConferencia(c => ({ ...c, atesto: e.target.checked }))} /><span>Atesto que as informações demonstram a realização da viagem e que os documentos apresentados são verdadeiros e pertinentes à prestação de contas.</span></label>
              </div>
            </div>
            <div className="redact-actions" style={{ justifyContent: "flex-end" }}><button className="btn btn-ghost" onClick={() => setMostrarConferencia(false)}>Voltar</button><button className="btn btn-primary" disabled={!Object.values(conferencia).every(Boolean)} onClick={confirmarConferencia}>Confirmar atesto</button></div>
          </div>
        </div>
      )}

      <div className="pdf-preview-source" ref={pdfPreviewRef}><ReportPreview form={form} /></div>

      {redactTarget && (
        <RedactModal
          meta={redactTarget.meta}
          dataUrl={redactTarget.dataUrl}
          onSave={redactTarget.onSave}
          onClose={redactTarget.onClose}
        />
      )}

      {mostrarPreview && (
        <div className="redact-overlay" onClick={e => { if (e.target === e.currentTarget) setMostrarPreview(false); }}>
          <div className="preview-modal">
            <div className="redact-head">
              <h3>Pré-visualização do relatório</h3>
              <button className="redact-close" onClick={() => setMostrarPreview(false)}><Icon name="close" size={18} /></button>
            </div>
            <div className="preview-modal-body">
              <ReportPreview form={form} />
            </div>
            <div className="redact-actions" style={{ justifyContent: "flex-end" }}>
              <button className="btn btn-ghost" onClick={() => setMostrarPreview(false)}>Fechar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);



</script>
</body>
</html>
