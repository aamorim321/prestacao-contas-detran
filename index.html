<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sistema de Prestação de Contas — DETRAN/PR</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

  :root{
    --azul: #005186;
    --azul-escuro: #013a61;
    --azul-tint: #eaf1f6;
    --azul-info: #6ec3ec;
    --navy: #02356e;
    --institucional: #3f4e55;
    --verde: #2c5a1c;
    --verde-vivo: #64b745;
    --verde-escuro: #2c5a1c;
    --verde-tint: #eef6ea;
    --grafite: #1a2429;
    --cinza: #4d5860;
    --papel: #f5f6f4;
    --linha: #d7dedc;
    --branco: #ffffff;
    --amarelo: #7a5600;
    --amarelo-bg: #fbf3df;
    --vermelho: #96222f;
    --vermelho-bg: #fbebec;

    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;
    --shadow-card: 0 1px 2px rgba(16,24,32,.04), 0 10px 26px -14px rgba(16,24,32,.18);
    --shadow-lift: 0 2px 4px rgba(16,24,32,.05), 0 18px 36px -18px rgba(16,24,32,.24);

    --container-max: 1500px;
    --font-titulo: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-corpo: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-dado: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; background: var(--papel); height: 100%; -webkit-text-size-adjust: 100%; }
  body{ font-family: var(--font-corpo); color: var(--grafite); }
  ::selection{ background: var(--azul); color: #fff; }

  #app-root{ font-family: var(--font-corpo); color: var(--grafite); line-height: 1.65; min-height: 100vh; display: flex; flex-direction: column; font-size: 17px; }
  .page-wrap{ display:flex; flex-direction:column; min-height: 100vh; }
  .band{ width: 100%; }
  .band-inner{ max-width: var(--container-max); margin: 0 auto; padding: 0 36px; }

  .proto-flag{ background: var(--grafite); color: #dbe3e0; font-size: 12.5px; text-align:center; padding: 7px 10px; letter-spacing: .02em; }

  /* ================= HEADER ================= */
  .institucional-bar{ background: var(--institucional); color: #dde3e1; }
  .institucional-bar .band-inner{ padding-top: 9px; padding-bottom: 9px; display:flex; align-items:center; justify-content:space-between; font-size: 13px; font-weight: 500; }
  .institucional-bar .gov-logo{ height: 16px; display:block; filter: brightness(0) invert(1) opacity(.9); }

  .topbar{ background: #fff; border-bottom: 1px solid var(--linha); }
  .topbar .band-inner{ padding-top: 18px; padding-bottom: 18px; display:flex; align-items:center; gap: 18px; flex-wrap: wrap; }
  .topbar .detran-logo{ height: 42px; display:block; flex-shrink: 0; }
  .topbar .lockup{ line-height: 1.35; }
  .topbar .lockup-title{ font-size: 19px; font-weight: 700; color: var(--grafite); }
  .topbar .lockup-sub{ font-size: 14.5px; color: var(--cinza); }

  .hero{ background: var(--azul); }
  .hero .band-inner{ padding-top: 28px; padding-bottom: 26px; display:flex; align-items:center; gap: 18px; }
  .hero-icon{ width: 52px; height: 52px; border-radius: var(--r-md); background: rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; flex-shrink:0; color: #fff; }
  .hero h1{ font-family: var(--font-titulo); font-weight: 700; font-size: clamp(24px, 3vw, 30px); margin: 0 0 8px; color: #fff; }
  .hero p{ margin: 0; font-size: 16px; color: rgba(255,255,255,.88); max-width: 72ch; }

  .main-wrap{ flex: 1 0 auto; background: var(--papel); }
  .main-wrap .band-inner{ padding-top: 28px; padding-bottom: 48px; }

  /* ================= STEPPER ================= */
  .stepper{ display:flex; align-items:flex-start; margin-bottom: 28px; }
  .step-node{ display:flex; flex-direction:column; align-items:center; gap: 10px; flex: 0 0 auto; width: 150px; }
  .step-circle{
    width: 40px; height: 40px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 15px; font-weight: 700; background: #fff; border: 2px solid var(--linha); color: var(--cinza);
    transition: border-color .15s, color .15s, background .15s;
  }
  .step-node.active .step-circle{ border-color: var(--azul); color: var(--azul); background: var(--azul-tint); box-shadow: 0 0 0 4px var(--azul-tint); }
  .step-node.done .step-circle{ border-color: var(--verde); color: #fff; background: var(--verde); }
  .step-label{ font-size: 13.5px; font-weight: 600; color: var(--cinza); text-align:center; }
  .step-node.active .step-label{ color: var(--azul); }
  .step-node.done .step-label{ color: var(--verde); }
  .step-connector{ flex: 1; height: 2px; background: var(--linha); margin-top: 20px; min-width: 16px; }
  .step-connector.done{ background: var(--verde); }

  /* ================= BANNERS ================= */
  .banner{ border-radius: var(--r-md); padding: 16px 18px; font-size: 15.5px; display:flex; gap: 12px; align-items:flex-start; margin-bottom: 22px; }
  .final-steps-list{ margin: 8px 0 0; padding-left: 20px; }
  .final-steps-list li{ margin-bottom: 4px; }
  .banner svg{ flex-shrink: 0; margin-top: 2px; width: 20px; height: 20px; }
  .banner.info{ background: var(--azul-tint); color: var(--azul-escuro); }
  .banner.warn{ background: var(--amarelo-bg); color: var(--amarelo); }
  .banner.error{ background: var(--vermelho-bg); color: var(--vermelho); }
  .banner b{ font-weight: 700; }

  /* ================= GRID / CARDS ================= */
  .app-grid{ display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 28px; align-items: start; }
  .app-grid.preview-mode{ grid-template-columns: minmax(0, 1.3fr) minmax(380px, 1fr); }
  @media (max-width: 980px){
    .app-grid, .app-grid.preview-mode{ grid-template-columns: 1fr; }
    .sidebar{ order: 2; position: static; }
  }

  .card{ background: #fff; border: 1px solid var(--linha); border-radius: var(--r-lg); padding: 34px 36px 30px; box-shadow: var(--shadow-card); }

  h2.section-title{ font-family: var(--font-titulo); font-size: 23px; font-weight: 700; margin: 0 0 6px; color: var(--grafite); display:flex; align-items:center; gap: 10px; }
  h2.section-title svg{ color: var(--verde); }
  .section-hint{ font-size: 15px; color: var(--cinza); margin: 0 0 24px; }
  .col-header{ font-size: 13.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--azul); margin: 0 0 13px; display:flex; align-items:center; gap:8px; }
  .subsection-label{ font-size: 13px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--cinza); margin: 4px 0 16px; border-bottom: 1px dashed var(--linha); padding-bottom: 10px; }

  /* ================= FIELDS ================= */
  .field-row{ display:flex; gap: 16px; margin-bottom: 18px; }
  .field-row .field{ flex: 1; min-width: 0; }
  .field{ position: relative; }
  .field label{ display:block; font-size: 15px; font-weight: 600; color: #24313a; margin-bottom: 7px; }
  .req{ color: var(--vermelho); }
  .field .req{ color: var(--vermelho); }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width: 100%; padding: 13px 15px; border: 1.5px solid var(--linha); border-radius: var(--r-sm);
    font-family: var(--font-corpo); font-size: 16.5px; background: #fff; color: var(--grafite);
    transition: border-color .12s, box-shadow .12s;
  }
  .field input[type=date]{ min-width: 0; max-width: 100%; box-sizing: border-box; }
  @media (max-width: 480px){ .field input[type=date]{ font-size: 14.5px; padding: 13px 10px; } }
  .field input:focus, .field textarea:focus, .field select:focus{ outline: none; border-color: var(--azul); box-shadow: 0 0 0 3.5px rgba(0,81,134,.13); }
  .field textarea{ resize: vertical; min-height: 76px; }
  .field .char-hint{ font-size: 13px; color: var(--cinza); margin-top: 6px; }

  .field-invalido input, .field-invalido select, .field-invalido textarea{ border-color: var(--vermelho) !important; box-shadow: 0 0 0 3.5px rgba(150,34,47,.1) !important; }
  .campo-erro-msg{ color: var(--vermelho); font-size: 13.5px; font-weight: 600; margin-top: 6px; }
  .erro-resumo ul.erro-resumo-lista{ margin: 8px 0 0; padding-left: 0; list-style: none; }
  .erro-resumo-lista li{ margin-bottom: 2px; }
  .erro-resumo-link{ background: none; border: none; padding: 5px 0; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; text-align: left; }
  .erro-resumo-link:hover{ opacity: .8; }

  .localidade-select{ display:flex; gap: 10px; }
  .localidade-select select{ flex: 1; min-width: 0; }
  @media (max-width: 480px){ .localidade-select{ flex-direction: column; } }

  @media (max-width: 620px){ .field-row{ flex-direction: column; gap: 0; } }

  /* ================= TRANSPORT PICKER ================= */
  .transport-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 8px; }
  @media (max-width: 720px){ .transport-grid{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 720px){ .translado-item-layout{ grid-template-columns: 1fr; } }
  .transport-opt{
    border: 1.5px solid var(--linha); border-radius: var(--r-md); padding: 17px 10px;
    cursor: pointer; font-size: 15px; font-weight: 600; color: #384555;
    display:flex; flex-direction: column; align-items:center; gap: 10px; text-align:center;
    transition: border-color .12s, background .12s, box-shadow .12s; min-height: 96px; justify-content:center;
  }
  .transport-opt svg{ color: var(--azul); opacity: .55; }
  .transport-opt:hover{ border-color: #a9c2d1; }
  .transport-opt.selected{ border-color: var(--azul); background: var(--azul-tint); color: var(--azul-escuro); box-shadow: 0 0 0 3px rgba(0,81,134,.09); }
  .transport-opt.selected svg{ color: var(--verde); opacity: 1; }
  .transport-opt input{ display:none; }

  /* ================= DOCUMENTS ================= */
  .doc-list{ margin-top: 24px; border-top: 1px dashed var(--linha); padding-top: 22px; }
  .doc-item-block{ padding: 16px 0; border-bottom: 1px solid #eef1ef; }
  .doc-item-block:last-child{ border-bottom: none; }
  .doc-item-head{ display:flex; align-items:center; gap: 13px; }
  .doc-icon{ width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--azul-tint); display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--azul); }
  .doc-info{ flex: 1; min-width: 0; }
  .doc-name{ font-size: 16px; font-weight: 600; color: var(--grafite); }
  .doc-tag{ font-size: 13px; color: var(--cinza); }
  .doc-status{ font-size: 13.5px; font-weight: 700; white-space: nowrap; display:flex; align-items:center; gap:5px; }
  .doc-status.pend{ color: var(--vermelho); }
  .doc-status.ok{ color: var(--verde); }
  .file-chip-list{ list-style:none; margin: 12px 0 0; padding: 0; display:flex; flex-direction:column; gap: 7px; }
  .file-chip{ display:flex; align-items:center; gap: 9px; background: var(--papel); border-radius: var(--r-sm); padding: 10px 13px; font-size: 15px; color: #384555; flex-wrap: wrap; }
  .file-chip-nome{ word-break: break-all; overflow-wrap: anywhere; min-width: 0; flex: 1 1 auto; }
  .file-chip .file-remove{ margin-left:auto; border:none; background:none; color: var(--vermelho); cursor:pointer; font-size: 14px; font-weight:700; padding: 6px 4px; }
  .file-btn{
    font-size: 14.5px; font-weight: 600; padding: 10px 18px; border-radius: var(--r-sm);
    border: 1.5px solid var(--linha); background: #fff; cursor: pointer; color: #384555;
    white-space: nowrap; display: inline-flex; align-items:center; gap:7px; margin-top: 13px;
    transition: border-color .12s, color .12s;
  }
  .file-btn:hover{ border-color: var(--azul); color: var(--azul); }
  .file-btn.plus{ border-color: var(--verde); color: var(--verde); }
  .file-input-hidden{ display:none; }

  /* ================= TRANSLADO ================= */
  .translado-block{ margin-top: 26px; border-top: 1px dashed var(--linha); padding-top: 22px; }
  .translado-block h3{ font-size: 17px; font-weight: 700; color: var(--grafite); margin: 0 0 13px; }
  .toggle-row{ display:flex; gap: 10px; margin-bottom: 6px; }
  .toggle-btn{ padding: 12px 24px; border-radius: var(--r-sm); border: 1.5px solid var(--linha); background:#fff; font-size: 15px; font-weight: 700; cursor:pointer; color:#384555; min-height: 46px; transition: border-color .12s; }
  .toggle-btn.on{ border-color: var(--azul); background: var(--azul-tint); color: var(--azul-escuro); }
  .translado-item{ background: var(--papel); border-radius: var(--r-md); padding: 17px 19px; margin-top: 14px; }
  .translado-row{ display:flex; gap: 14px; }
  @media (max-width: 560px){ .translado-row{ flex-direction: column; gap: 0; } }
  .translado-row .field{ flex: 1; }
  .translado-anexo{ display:flex; align-items:center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .translado-anexo .file-chip{ margin: 0; }
  .btn-link-danger{ border:none; background:none; color: var(--vermelho); font-size: 14px; font-weight:600; cursor:pointer; padding: 6px 0; }
  .translado-delete-action{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; line-height:1.2; }
  .translado-delete-action svg{ flex-shrink:0; }

  .checkline{ display:flex; gap: 12px; align-items:flex-start; background: var(--papel); border-radius: var(--r-md); padding: 18px 20px; margin-top: 24px; font-size: 15.5px; color: #384555; }
  .checkline input{ margin-top: 2px; accent-color: var(--azul); width: 17px; height: 17px; flex-shrink: 0; }

  /* ================= BUTTONS ================= */
  .nav-row{ display:flex; justify-content: space-between; align-items:center; margin-top: 26px; }
  .btn{ font-family: var(--font-corpo); font-size: 16px; font-weight: 700; padding: 14px 28px; border-radius: var(--r-pill); cursor: pointer; border: none; min-height: 50px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: background .12s, box-shadow .12s, transform .05s; }
  .btn-primary{ background: var(--verde-escuro); color: #fff; box-shadow: 0 2px 8px -2px rgba(44,90,28,.4); }
  .btn-primary:hover{ background: #234a16; }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-primary:disabled{ background: #c3ccd2; box-shadow: none; cursor: not-allowed; }
  .btn-ghost{ background: transparent; color: var(--cinza); border: 1.5px solid var(--linha); }
  .btn-ghost:hover{ border-color: var(--cinza); color: var(--grafite); }

  .save-indicator{ margin-top: 22px; text-align:center; font-size: 13.5px; color: var(--cinza); display:flex; align-items:center; justify-content:center; gap: 7px; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background: var(--verde); }
  .save-dot.saving{ background: var(--amarelo); }
  .save-dot.off{ background: #b7bec4; }

  .link-box{ display:flex; gap: 9px; margin-top: 12px; }
  .link-box input{ flex:1; font-family: var(--font-dado); font-size: 14px; padding: 12px 14px; border: 1.5px solid var(--linha); border-radius: var(--r-sm); background: var(--papel); color: #384555; }

  .summary-block{ background: var(--papel); border-radius: var(--r-md); padding: 20px 22px; margin-bottom: 18px; }
  .summary-block dt{ font-size: 13px; color: var(--cinza); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .summary-block dd{ margin: 4px 0 15px; font-size: 16.5px; color: var(--grafite); }
  .summary-block dd:last-child{ margin-bottom: 0; }
  .summary-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  @media (max-width: 480px){ .summary-grid{ grid-template-columns: 1fr; } }

  .expiry-note{ font-size: 13.5px; color: var(--cinza); text-align:center; margin-top: 16px; }

  /* ================= SIDEBAR ================= */
  .sidebar{ display:flex; flex-direction:column; gap: 20px; position: sticky; top: 20px; }
  .side-card{ background:#fff; border: 1px solid var(--linha); border-radius: var(--r-lg); padding: 24px 24px 22px; box-shadow: var(--shadow-card); }
  .side-card h3{ font-family: var(--font-titulo); font-size: 19px; font-weight: 700; color: var(--grafite); margin: 0 0 15px; display:flex; align-items:center; gap: 9px; }
  .side-card h3 svg{ color: var(--verde); }
  .side-card ul{ margin: 0; padding-left: 20px; font-size: 15.5px; color: #384555; line-height: 1.8; }
  .side-card ul li{ margin-bottom: 8px; }
  .check-row{ display:flex; align-items:center; gap: 10px; font-size: 15.5px; color: #384555; padding: 9px 0; border-bottom: 1px solid #f0f2f0; }
  .check-row:last-child{ border-bottom: none; }
  .dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink:0; display:inline-block; }
  .dot.ok{ background: var(--verde); }
  .dot.pend{ background: #d8dde1; }
  .check-row .dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink:0; }
  .check-row .dot.ok{ background: var(--verde); }
  .check-row .dot.pend{ background: #d8dde1; }

  /* ================= REPORT PREVIEW ================= */
  .report-preview{ background: #fff; border: 1px solid var(--linha); border-radius: var(--r-lg); padding: 32px 32px 30px; font-family: var(--font-corpo); box-shadow: var(--shadow-card); }
  .rp-logos{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 22px; }
  .rp-logos img:first-child{ height: 46px; }
  .rp-logo-col{ display:flex; flex-direction:column; align-items:flex-end; gap: 6px; }
  .rp-logo-col img{ height: 50px; }
  .rp-pagina{ font-size: 10.5px; color: var(--cinza); }
  .rp-title{ text-align:center; font-family: var(--font-titulo); font-weight: 700; font-size: 25px; letter-spacing: .01em; color: var(--grafite); margin-bottom: 6px; }
  .rp-kicker{ text-align:center; font-size: 13.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--verde); margin-bottom: 6px; }
  .rp-subtitle{ text-align:center; font-family: var(--font-dado); font-size: 14.5px; color: var(--cinza); margin-bottom: 24px; }

  .rp-section-title{ display:flex; align-items:center; gap: 11px; margin: 4px 0 16px; }
  .rp-section-title .rp-icon-badge{ width: 34px; height: 34px; }
  .rp-section-title span{ font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--grafite); white-space: nowrap; }
  .rp-section-title .rp-dash{ flex: 1; border-top: 2px dashed var(--linha); margin: 0 2px; }
  .rp-section-title svg.rp-send{ color: var(--azul); flex-shrink: 0; }

  .rp-icon-badge{ width: 30px; height: 30px; border-radius: 50%; display:flex; align-items:center; justify-content:center; flex-shrink: 0; }
  .rp-icon-badge.azul{ background: var(--azul-tint); color: var(--azul); }
  .rp-icon-badge.verde{ background: var(--verde-tint); color: var(--verde); }

  .rp-table{ border: 1px solid var(--linha); border-radius: var(--r-sm); margin-bottom: 22px; overflow:hidden; }
  .rp-row{ display:flex; align-items:center; gap: 12px; font-size: 15px; border-bottom: 1px solid var(--linha); padding: 10px 14px; }
  .rp-row:last-child{ border-bottom: none; }
  .rp-label{ font-weight: 700; color: var(--grafite); flex-shrink: 0; }
  .rp-value{ color: var(--cinza); word-break: break-word; }

  .rp-block{ display:flex; align-items:flex-start; gap: 12px; border: 1px solid var(--linha); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 14px; background: #fff; }
  .rp-block-content{ flex: 1; min-width: 0; }
  .rp-block-label{ font-size: 14.5px; font-weight: 700; color: var(--grafite); margin-bottom: 4px; }
  .rp-block-value{ font-size: 14.5px; color: var(--cinza); white-space: pre-wrap; word-break: break-word; }

  .rp-divider{ display:flex; align-items:center; gap: 10px; margin: 22px 0 16px; color: var(--azul); }
  .rp-divider .rp-dash{ flex: 1; border-top: 2px dashed var(--linha); }

  .rp-sign{ text-align:center; }
  .rp-sign-note{ font-size: 13.5px; font-style: italic; color: var(--azul-escuro); margin-bottom: 10px; }
  .rp-sign-name{ font-size: 17px; font-weight: 700; color: var(--grafite); border-top: 1px solid var(--linha); padding-top: 8px; display: inline-block; margin-top: 4px; }
  .rp-sign-role{ font-size: 14px; color: var(--cinza); margin-top: 2px; }

  .rp-footer{ margin-top: 28px; }

  /* Wrapper enxuto usado só na geração do PDF: mesma tipografia do relatório,
     mas sem borda/padding própria — o único espaçamento da página passa a
     vir da moldura vetorial (cabeçalho/rodapé/margem), sem duplicar. */
  .rp-captura{ font-family: var(--font-corpo); background: #fff; color: var(--grafite); }
  .rp-corpo{ display: flex; flex-direction: column; }
  .rp-titleblock{ }
  .rp-decl-assin{ }

  .rp-declaracao{ border: 1.5px solid var(--verde); border-radius: 12px; background: #f6fbf3; padding: 16px 18px; display: flex; gap: 14px; margin: 20px 0 18px; align-items: flex-start; }

  .rp-text-paragraph{

  /* ===== Páginas de anexo (renderizadas em HTML, mesmo estilo da página 1) ===== */

  /* ===== Ajustes finos aprovados (página 1) ===== */

  /* ===== Tela "Minhas prestações" ===== */
  .mp-card{ background:#fff; border:1px solid var(--linha); border-radius:16px; padding:26px 28px; }
  .mp-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .mp-head-title{ display:flex; gap:14px; align-items:center; }

  /* ================= REDACTION EDITOR ================= */
  .redact-overlay{ position: fixed; inset: 0; background: rgba(8,14,18,.68); z-index: 100; display:flex; align-items:center; justify-content:center; padding: 20px; }

  .preview-modal .redact-head{ background: #fff; }

  .demo-mask{ position:absolute; left:110px; height:18px; background:#111; border-radius:4px; animation:redactPulse 2.8s ease-in-out infinite; }
  .demo-mask-1{ top:14px; width:136px; }
  .demo-mask-2{ top:42px; width:176px; animation-delay:.35s; }
  .demo-cursor{ position:absolute; width:18px; height:18px; border-radius:50%; background:var(--azul); box-shadow:0 0 0 4px rgba(11,111,174,.18); top:55px; left:86px; animation:cursorMove 2.8s ease-in-out infinite; }

  /* ================= AJUDA DISCRETA E PROGRESSO DINÂMICO V22 ================= */
  .lotacao-field{ position:relative; }
  .lotacao-label-row{ display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .lotacao-label-row label{ margin:0; }
  .field-help-icon{
    width:22px;
    height:22px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--azul);
    background:var(--azul-tint);
    cursor:help;
    flex:0 0 22px;
  }
  .field-tooltip{
    position:absolute;
    left:0;
    top:calc(100% + 8px);
    z-index:40;
    max-width:390px;
    padding:10px 12px;
    border-radius:10px;
    background:#183447;
    color:#fff;
    font-size:13px;
    line-height:1.4;
    box-shadow:0 10px 24px rgba(14,38,54,.22);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s ease;
  }
  .field-tooltip::before{
    content:"";
    position:absolute;
    left:16px;
    top:-6px;
    width:12px;
    height:12px;
    background:#183447;
    transform:rotate(45deg);
  }
  .lotacao-field:hover .field-tooltip,
  .lotacao-field:focus-within .field-tooltip,
  .field-help-icon:focus + .field-tooltip{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }

  .premium-stepper .step-node{
    --progress:0%;
  }
  .premium-stepper .step-node::after{
    background:
      linear-gradient(#2f7d2e,#2f7d2e) left center / var(--progress) 100% no-repeat,
      #d9e0e6;
    transition:background-size .28s ease;
  }
  .premium-stepper .step-node.done::after,
  .premium-stepper .step-node.active:first-child::after{
    background:
      linear-gradient(#2f7d2e,#2f7d2e) left center / var(--progress) 100% no-repeat,
      #d9e0e6;
  }
  .premium-stepper .step-node.complete .step-circle,
  .premium-stepper .step-node.complete.active .step-circle{
    background:#2f7d2e;
    border-color:#2f7d2e;
    color:#fff;
  }
  .premium-stepper .step-node.complete .step-iconbox,
  .premium-stepper .step-node.complete.active .step-iconbox{
    background:#edf6e7;
    color:#3a7b24;
  }

  @media (max-width:720px){
    .field-tooltip{
      position:static;
      max-width:none;
      margin-top:8px;
      display:none;
      transform:none;
    }
    .field-tooltip::before{ display:none; }
    .lotacao-field:focus-within .field-tooltip,
    .lotacao-field:hover .field-tooltip{
      display:block;
    }
  }

  /* =============================================================
     REFINAMENTO RESPONSIVO APROVADO — PATCH SEGURO
     Somente CSS: não altera React, JavaScript ou funções do sistema.
     ============================================================= */

  /* Ajuda da unidade de lotação: texto auxiliar discreto e permanente */
  .lotacao-field .field-tooltip{
    position: static !important;
    display: block !important;
    width: auto !important;
    max-width: none !important;
    margin-top: 7px !important;
    padding: 0 !important;
    background: transparent !important;
    color: var(--cinza) !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    font-size: 13px !important;
    line-height: 1.45 !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    pointer-events: none !important;
  }
  .lotacao-field .field-tooltip::before{ display:none !important; }
  .lotacao-field .field-tooltip b{ color:var(--grafite); }

  /* Nas etapas 2 e 3, remove o painel introdutório repetido */
  .dashboard-main:has(.premium-stepper .step-node:nth-child(3).active) .hero-panel,
  .dashboard-main:has(.premium-stepper .step-node:nth-child(5).active) .hero-panel{
    display:none !important;
  }

  .workflow-shell{

    border-radius:14px;
    padding:18px 22px;
    box-shadow:var(--shadow-card);

  .premium-stepper .step-circle{ width:34px; height:34px; }
  .premium-stepper .step-iconbox{ width:38px; height:38px; border-radius:10px; }
  .premium-stepper .step-label{ font-size:14px; }
  .premium-stepper .step-desc{ font-size:12px; margin-top:2px; }
  .premium-stepper .step-connector{ height:3px; margin-top:17px; }

  /* Documentos: cards individuais e hierarquia visual mais leve */
  .doc-list{ border-top:0; padding-top:8px; }
  .doc-item-block{
    border:1px solid #dfe5e8 !important;
    border-radius:12px;
    background:#fff;
    padding:16px 18px !important;
    margin:12px 0;
    box-shadow:0 4px 14px rgba(16,24,32,.04);

    .premium-stepper .step-connector{ width:3px; height:10px; min-width:3px; margin:0 0 0 16px; }

    .doc-item-block{ padding:14px 13px !important; margin:10px 0; }
    .doc-item-head{ align-items:flex-start; }
    .doc-status{ margin-left:auto; padding:4px 9px; font-size:11px; }
    .file-chip{ display:grid; grid-template-columns:1fr auto; gap:6px 10px; padding:11px 12px; }
    .file-chip-nome{ grid-column:1 / -1; font-size:13px; }
    .file-chip .file-remove{ font-size:12px; }
    .file-chip .file-remove:first-of-type{ margin-left:0; }
    .doc-item-block > .file-btn{ width:100%; }

  }

/* ==================================================
   AJUDA COMPACTA E CONTEÚDO EM LARGURA TOTAL
   ================================================== */
.app-grid,
.app-grid.preview-mode{

.sidebar.compact-help{
  position: absolute;
  top: 18px;
  right: 18px;
  width: auto;
  display: block;
  z-index: 40;
}
.help-details{
  position: relative;
}
.help-trigger{
  list-style: none;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid #bfd3df;
  border-radius: 50%;
  background: #fff;
  color: var(--azul);
  box-shadow: 0 5px 16px rgba(16,24,32,.13);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.help-trigger::-webkit-details-marker{ display:none; }
.help-trigger::marker{ display:none; content:""; }
.help-trigger:hover{
  border-color: var(--azul);
  background: var(--azul-tint);
  transform: translateY(-1px);
}
.help-trigger:focus-visible{
  outline: 3px solid rgba(11,111,174,.25);
  outline-offset: 2px;
}
.help-details[open] .help-trigger{
  background: var(--azul);
  color: #fff;
  border-color: var(--azul);
}
/* Abre ao passar o mouse (e ao focar pelo teclado), fechando sozinho ao sair.
   O clique continua funcionando — é o que vale no celular/tablet, onde não
   existe "passar o mouse". Mesmo padrão já usado na ajuda dos campos. */
.help-details:hover .help-trigger{
  background: var(--azul);
  color: #fff;
  border-color: var(--azul);
}
.help-popover{
  display: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .14s ease, transform .14s ease, visibility .14s ease;
}
.help-details:hover .help-popover,
.help-details:focus-within .help-popover,
.help-details[open] .help-popover{
  display: block;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.help-popover{
  position: absolute;
  top: 50px;
  right: 0;
  width: 330px;
  max-width: calc(100vw - 48px);
  margin: 0;
  padding: 20px 22px;
  box-shadow: 0 18px 42px rgba(16,24,32,.20);
  border-color: #cbd8df;
  animation: helpOpen .14s ease-out;
}
.help-popover::before{
  content:"";
  position:absolute;
  top:-7px;
  right:13px;
  width:12px;
  height:12px;
  background:#fff;
  border-left:1px solid #cbd8df;
  border-top:1px solid #cbd8df;
  transform:rotate(45deg);
}
.help-popover h3{
  margin-bottom: 12px;
  font-size: 17px;
}
.help-popover ul{
  font-size: 14px;
  line-height: 1.65;
}
@keyframes helpOpen{
  from{ opacity:0; transform:translateY(-5px); }
  to{ opacity:1; transform:translateY(0); }
}

   sem atravessar o ícone ou o texto. */
@media (max-width: 600px){
  .premium-stepper .step-node{
    position:relative;
    padding-bottom:8px;
  }
  .premium-stepper .step-node::after{
    top:auto !important;
    bottom:0;
    left:82px !important;
    right:10px !important;
    height:3px !important;
    z-index:0;
  }
  .premium-stepper .step-circle,
  .premium-stepper .step-card-meta{
    position:relative;
    z-index:1;
  }
}

/* Tablet estreito: mantém a linha afastada dos ícones. */
@media (min-width: 601px) and (max-width: 900px){
  .premium-stepper .step-node::after{
    left:96px;
    right:14px;
  }
}



/* ==================================================
   RELATÓRIO FINAL — TIPOGRAFIA SEGURA
   Textos preenchidos pelo viajante ficam alinhados à esquerda.
   Somente a declaração institucional permanece justificada.
   ================================================== */
.rp-captura .rp-sec-body{
  word-spacing:normal !important;
  letter-spacing:normal !important;
  word-break:normal !important;
  overflow-wrap:anywhere;
}
.rp-captura .rp-text-paragraph{
  text-align:justify !important;
  text-align-last:left !important;
  text-justify:inter-word !important;
}
.rp-captura .rp-sec-body.sem-recuo .rp-text-paragraph,
.rp-captura .rp-text-bullet{
  text-align:left !important;
}
.rp-captura .rp-declaracao-text{
  text-align:justify !important;
  text-justify:inter-word !important;
  word-spacing:normal !important;
  letter-spacing:normal !important;
  hyphens:none;
}



/* =============================================================
   DESIGN SYSTEM FINAL — PADRÃO FIFA
   Uma única camada para botões, orientações contextuais, tooltips
   e os refinamentos responsivos aprovados.
   ============================================================= */
:root{
  --action-height:44px;
  --action-radius:9px;
  --action-border:#cfd8dc;
  --action-shadow:0 1px 2px rgba(16,24,32,.04);
}

/* Orientações aparecem somente enquanto ajudam no preenchimento. */
.field-guidance{
  animation:fieldGuideIn .16s ease-out;
}
@keyframes fieldGuideIn{
  from{ opacity:0; transform:translateY(-2px); }
  to{ opacity:1; transform:translateY(0); }
}

/* O tooltip da unidade abre apenas pelo ícone de ajuda — nunca pelo foco do select. */
.lotacao-field:hover .field-tooltip,
.lotacao-field:focus-within .field-tooltip{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(-4px);
}
.field-help-icon:hover + .field-tooltip,
.field-help-icon:focus + .field-tooltip,
.field-help-icon:focus-visible + .field-tooltip{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* Base visual compartilhada pelas ações principais e secundárias. */
.btn,
.file-btn,
.toggle-btn,
.translado-action{
  min-height:var(--action-height);
  padding:10px 18px;
  border:1.5px solid var(--action-border);
  border-radius:var(--action-radius);
  background:#fff;
  color:#344550;
  box-shadow:var(--action-shadow);
  font-family:var(--font-corpo);
  font-size:14.5px;
  font-weight:700;
  line-height:1.2;
  text-align:center;
  text-decoration:none;
  white-space:normal;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:color .15s ease, background .15s ease, border-color .15s ease,
             box-shadow .15s ease, transform .05s ease;
}
.btn:hover,
.btn-ghost:hover{
  color:var(--azul);
  border-color:var(--azul);
  background:var(--azul-tint);
  box-shadow:0 4px 12px rgba(0,81,134,.10);
}
.btn:active,
.file-btn:active,
.toggle-btn:active,
.translado-action:active{
  transform:translateY(1px);
}
.btn:focus-visible,
.file-btn:focus-visible,
.toggle-btn:focus-visible,
.translado-action:focus-visible,
.file-remove:focus-visible,
.btn-link-danger:focus-visible{
  outline:3px solid rgba(11,111,174,.24);
  outline-offset:2px;
}
.btn:disabled,
.toggle-btn:disabled,
.translado-action:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* Hierarquia: uma ação principal preenchida por bloco; demais contornadas. */
.btn-primary{
  color:#fff;
  background:var(--verde-escuro);
  border-color:var(--verde-escuro);
  box-shadow:0 3px 10px rgba(44,90,28,.22);
}
.btn-primary:hover{
  color:#fff;
  background:#234a16;
  border-color:#234a16;
  box-shadow:0 5px 14px rgba(44,90,28,.28);
}
.btn-secondary{
  color:#fff;
  background:var(--azul);
  border-color:var(--azul);
  box-shadow:0 3px 10px rgba(0,81,134,.22);
}
.btn-secondary:hover{
  color:#fff;
  background:var(--azul-escuro);
  border-color:var(--azul-escuro);
}
.btn-ghost{
  color:#40515c;
  background:#fff;
  border-color:var(--action-border);
  box-shadow:var(--action-shadow);
}

/* Anexar/adicionar: mesmo modelo do comprovante de translado. */
.file-btn{
  color:#365442;
  border-color:#b9c9bf;
  background:#fff;
}
.file-btn:hover{
  color:var(--verde-escuro);
  border-color:var(--verde-escuro);
  background:var(--verde-tint);
  box-shadow:0 4px 12px rgba(44,90,28,.10);
}
.file-btn.plus{
  color:var(--azul);
  border-style:dashed;
  border-color:#9dbfe8;
  background:#fbfdff;
}
.file-btn.plus:hover{
  color:var(--azul-escuro);
  border-color:var(--azul);
  background:var(--azul-tint);
}

/* Escolhas binárias mantêm o mesmo corpo visual e estado selecionado claro. */
.toggle-btn{
  color:#344550;
  border-color:var(--action-border);
  background:#fff;
}
.toggle-btn:hover{
  color:var(--azul);
  border-color:var(--azul);
  background:var(--azul-tint);
}
.toggle-btn.on{
  color:var(--azul-escuro);
  border-color:var(--azul);
  background:var(--azul-tint);
  box-shadow:inset 0 0 0 1px rgba(0,81,134,.08);
}

/* Links de ação também seguem o mesmo padrão visual compacto. */
.btn-link,
.pinch-fit{
  min-height:36px;
  padding:7px 12px;
  border:1px solid #b8cfdd;
  border-radius:8px;
  background:#fff;
  color:var(--azul);
  font-family:var(--font-corpo);
  font-size:13px;
  font-weight:700;
  line-height:1.2;
  text-decoration:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:color .15s, background .15s, border-color .15s, box-shadow .15s;
}
.btn-link:hover,
.pinch-fit:hover{
  color:var(--azul-escuro);
  background:var(--azul-tint);
  border-color:var(--azul);
  box-shadow:0 4px 12px rgba(0,81,134,.10);
}
.btn-link:focus-visible,
.pinch-fit:focus-visible{
  outline:3px solid rgba(11,111,174,.24);
  outline-offset:2px;
}

/* Ações compactas dentro dos cards de arquivo. */
.file-chip .file-remove,
.btn-link-danger{
  min-height:36px;
  margin:0;
  padding:7px 10px;
  border:1px solid var(--action-border);
  border-radius:8px;
  background:#fff;
  font-family:var(--font-corpo);
  font-size:12.5px;
  font-weight:700;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  cursor:pointer;
  transition:color .15s, background .15s, border-color .15s, box-shadow .15s;
}
.file-remove-redact{
  color:var(--azul) !important;
  border-color:#b8cfdd !important;
}
.file-remove-redact:hover{
  background:var(--azul-tint) !important;
  border-color:var(--azul) !important;
}
.file-remove-delete,
.btn-link-danger{
  color:var(--vermelho) !important;
  border-color:#dfbbc0 !important;
}
.file-remove-delete:hover,
.btn-link-danger:hover{
  background:var(--vermelho-bg) !important;
  border-color:var(--vermelho) !important;
}

/* Ações abaixo da miniatura do translado. */
.translado-file-actions{
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:8px !important;
  width:100%;
  margin-top:10px !important;
}
.translado-action{
  width:min(100%,220px);
}
.translado-action-redact{
  color:var(--azul);
  border-color:#9fbfd3;
}
.translado-action-redact:hover{
  color:var(--azul-escuro);
  background:var(--azul-tint);
  border-color:var(--azul);
}
.translado-action-delete{
  color:var(--vermelho);
  border-color:#dfb6bc;
}
.translado-action-delete:hover{
  color:var(--vermelho);
  background:var(--vermelho-bg);
  border-color:var(--vermelho);
}

/* Anexos diretos: ponto de status sempre ao lado do título. */
.inline-doc-card .doc-item-head{
  display:flex !important;
  align-items:center !important;
  flex-wrap:nowrap !important;
  gap:12px !important;
  width:100%;
}
.inline-doc-card .doc-item-head .dot{
  position:static !important;
  display:inline-block !important;
  flex:0 0 9px !important;
  width:9px !important;
  height:9px !important;
  margin:0 !important;
  align-self:center !important;
  grid-column:auto !important;
  grid-row:auto !important;
}
.inline-doc-card .doc-item-head .doc-info{
  flex:1 1 auto !important;
  min-width:0 !important;
  grid-column:auto !important;
  grid-row:auto !important;
  padding:0 !important;
}
.inline-doc-card .doc-item-head .doc-name{
  margin:0 !important;
  line-height:1.35;
}
.inline-doc-card .doc-item-head .doc-status{
  flex:0 0 auto;
  margin-left:auto !important;
  grid-column:auto !important;
  grid-row:auto !important;
  align-self:center !important;
}

@media (max-width:720px){
  .field-tooltip{
    position:absolute;
    top:30px;
    left:0;
    max-width:min(390px, calc(100vw - 44px));
    margin:0;
    display:block;
  }
  .field-help-icon:hover + .field-tooltip,
  .field-help-icon:focus + .field-tooltip,
  .field-help-icon:focus-visible + .field-tooltip{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .btn,
  .file-btn,
  .toggle-btn,
  .translado-action{
    min-height:46px;
    font-size:14px;
  }
  .inline-doc-card .doc-item-head{
    align-items:flex-start !important;
  }
  .inline-doc-card .doc-item-head .dot{
    margin-top:.45em !important;
  }
  .translado-action{
    width:100%;
  }
  .file-chip .file-remove,
  .btn-link-danger{
    min-height:40px;
    white-space:normal;
  }
}

@media (prefers-reduced-motion:reduce){
  .btn,
  .file-btn,
  .toggle-btn,
  .translado-action,
  .file-remove,
  .field-guidance{
    transition:none !important;
    animation:none !important;
  }
}



/* ==================================================
   AJUDA CONTEXTUAL DA UNIDADE — PADRÃO ÚNICO
   Hover no computador; toque/clique no celular; foco pelo teclado.
   ================================================== */
.field-help-details{
  position:static;
  display:inline-flex;
  align-items:center;
  margin:0;
}
.field-help-icon{
  list-style:none;
  width:30px;
  height:30px;
  padding:0;
  border:1px solid #bfd3df;
  border-radius:50%;
  background:#fff;
  color:var(--azul);
  box-shadow:0 3px 10px rgba(16,24,32,.10);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
}
.field-help-icon::-webkit-details-marker{ display:none; }
.field-help-icon::marker{ display:none; content:""; }
.field-help-icon:hover{
  border-color:var(--azul);
  background:var(--azul-tint);
  transform:translateY(-1px);
}
.field-help-icon:focus-visible{
  outline:3px solid rgba(11,111,174,.24);
  outline-offset:2px;
}
.field-help-details[open] .field-help-icon{
  border-color:var(--azul);
  background:var(--azul);
  color:#fff;
}
.field-help-details .field-tooltip{
  position:absolute;
  top:36px;
  left:0;
  right:auto;
  z-index:220;
  display:none;
  width:min(390px, calc(100vw - 48px));
  max-width:100%;
  margin:0;
  padding:14px 16px;
  border:1px solid #cbd8df;
  border-radius:12px;
  background:#fff;
  color:#31424f;
  font-size:13.5px;
  line-height:1.5;
  box-shadow:0 16px 36px rgba(16,24,32,.18);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(-5px);
  transition:opacity .14s ease, transform .14s ease, visibility .14s ease;
}
.field-help-details .field-tooltip::before{
  display:none;
}
.field-help-details:hover .field-tooltip,
.field-help-details:focus-within .field-tooltip,
.field-help-details[open] .field-tooltip{
  display:block;
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0);
}
.field-help-details .field-tooltip b{
  color:var(--grafite);
}
@media (max-width:720px){
  .field-help-icon{
    width:28px;
    height:28px;
  }
  .field-help-details .field-tooltip{
    top:34px;
    width:100%;
    max-width:none;
    padding:13px 14px;
  }
}



/* =============================================================

@keyframes pdfPreviewSpin{ to{ transform: rotate(360deg); } }

}

function formatarMoedaDigitada(valor) {
  const digitos = String(valor || "").replace(/\D/g, "");
  if (!digitos) return "";
  return (Number(digitos) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function parseMoeda(valor) {
  if (typeof valor === "number") return Number.isFinite(valor) ? valor : 0;
  const limpo = String(valor || "").replace(/\s/g, "").replace("R$", "").replace(/\./g, "").replace(",", ".").replace(/[^0-9.-]/g, "");
  const numero = Number(limpo);
  return Number.isFinite(numero) ? numero : 0;
}

function moedaBR(valor) {
  return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function docsFor(transporte, incluirDevolucaoTranslado, incluirDevolucaoRoteiro) {
  const docs = [];
  if (transporte === "aereo") docs.push({ id: "embarque", nome: "Cartão de embarque ou declaração de embarque", obrig: true });
  if (transporte === "onibus") docs.push({ id: "bilhete", nome: "Bilhete, BPE ou declaração/certificado de embarque", obrig: true });
  if (transporte === "veiculo_oficial") {
    docs.push({ id: "solicitacao_veiculo", nome: "Solicitação de veículo", obrig: true });
    docs.push({ id: "diario_bordo", nome: "Diário de bordo", obrig: true });
  }
  if (transporte === "meios_proprios") docs.push({ id: "termo_ciencia", nome: "Termo de Ciência e Responsabilidade", obrig: true });
  docs.push({ id: "saque", nome: "Comprovante de saque ou transferência da diária", obrig: true });
  if (incluirDevolucaoRoteiro) {
    docs.push({ id: "devolucao_roteiro", nome: "Comprovante de devolução de diária — roteiro reduzido", obrig: true });
  }
  if (incluirDevolucaoTranslado) {
    docs.push({ id: "devolucao_translado", nome: "Comprovante de devolução do saldo de translado", obrig: true });
  }
  docs.push({ id: "comprobatorio", nome: "Outros documentos comprobatórios (certificado, declaração, lista de presença ou ata)", obrig: false });
  return docs;
}

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function comprimirImagemDataUrl(dataUrl, maxDimensao, qualidade) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDimensao || height > maxDimensao) {
        const escala = maxDimensao / Math.max(width, height);
        width = Math.round(width * escala);
        height = Math.round(height * escala);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", qualidade));
    };
    img.onerror = () => reject(new Error("Falha ao carregar imagem para compressão"));
    img.src = dataUrl;
  });
}

function tamanhoAproximadoBase64(dataUrl) {
  const virgula = dataUrl.indexOf(",");
  const base64 = virgula >= 0 ? dataUrl.slice(virgula + 1) : dataUrl;
  return Math.round(base64.length * 0.75);
}

const LIMITE_PARA_COMPRIMIR_BYTES = 900 * 1024;

async function lerArquivoCorrigido(file) {
  const dataUrl = await readFileAsDataURL(file);
  const isImagem = file.type === "image/jpeg" || file.type === "image/png" || /\.(jpe?g|png)$/i.test(file.name || "");
  if (!isImagem || file.size <= LIMITE_PARA_COMPRIMIR_BYTES) {
    return { dataUrl, tamanho: file.size, comprimida: false };
  }
  try {
    const comprimida = await comprimirImagemDataUrl(dataUrl, 1800, 0.84);
    const tamanhoComprimido = tamanhoAproximadoBase64(comprimida);
    if (tamanhoComprimido < file.size) {
      return { dataUrl: comprimida, tamanho: tamanhoComprimido, comprimida: true };
    }
    return { dataUrl, tamanho: file.size, comprimida: false };
  } catch (e) {
    return { dataUrl, tamanho: file.size, comprimida: false };
  }
}

function dataUrlToBytes(dataUrl) {
  const base64 = dataUrl.split(",")[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function abrirEmNovaGuia(dataUrl) {
  try {
    const match = dataUrl.match(/^data:([^;]+);base64,/);
    const mime = match ? match[1] : "application/octet-stream";
    const bytes = dataUrlToBytes(dataUrl);
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank", "noopener,noreferrer");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { /* se falhar, simplesmente não abre nada */ }
}

function downloadBytes(bytes, filename) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function formatDateBR(isoDate) {
  if (!isoDate) return "";
  const partes = isoDate.split("-");
  if (partes.length !== 3) return isoDate;
  const [ano, mes, dia] = partes;
  return `${dia}/${mes}/${ano}`;
}

function daysLeft(createdAt) {
  const created = new Date(createdAt);
  const deadline = new Date(created.getTime() + 15 * 24 * 60 * 60 * 1000);
  const diff = Math.ceil((deadline - new Date()) / (24 * 60 * 60 * 1000));
  return Math.max(diff, 0);
}

// ---- Conversão de MAIÚSCULAS para escrita normal (regras do português) ----
// Só converte quando o texto está TODO em maiúsculas (típico de dados importados do SCV);
// texto digitado pela pessoa é preservado exatamente como ela escreveu.
const CONECTIVOS_NOME = new Set(["da", "de", "do", "das", "dos", "e", "di", "du"]);
function estaTodoMaiusculo(texto) {
  const letras = String(texto || "").replace(/[^A-Za-zÀ-ÿ]/g, "");
  return letras.length > 1 && letras === letras.toUpperCase();
}
function paraNomeProprio(texto) {
  if (!texto || !estaTodoMaiusculo(texto)) return texto;
  const partes = String(texto).toLowerCase().split(/\s+/);
  return partes.map((p, i) => {
    if (/^[a-z]{2}$/.test(p) && partes[i - 1] === "-") return p.toUpperCase(); // UF: "Curitiba - PR"
    if (i > 0 && CONECTIVOS_NOME.has(p)) return p;
    return p.charAt(0).toUpperCase() + p.slice(1);
  }).join(" ");
}
function paraFrase(texto) {
  if (!texto || !estaTodoMaiusculo(texto)) return texto;
  const t = String(texto).toLowerCase();
  return t.replace(/(^\s*[a-zà-ÿ])|([.!?]\s+[a-zà-ÿ])/g, m => m.toUpperCase());
}

  const [mostrarLista, setMostrarLista] = useState(false);
  useEffect(() => {
    const url = new URL(window.location.href);

    setMostrarLista(true);

function bytesToBase64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Falha ao carregar imagem"));
    img.src = src;
  });
}

// Prefixo único de chave de rascunho — usado em TODO lugar que salva, lê ou
// exclui um rascunho no IndexedDB. Nunca escreva "rascunho:" na mão em outro
// ponto do código; use sempre esta função, para nunca mais haver duas chaves
// diferentes apontando para o mesmo rascunho.
const PREFIXO_RASCUNHO = "rascunho:";
function criarChaveRascunho(token) {
  return token ? `${PREFIXO_RASCUNHO}${token}` : null;
}

const DraftDB = {
  dbName: "detran-prestacao-contas",
  storeName: "rascunhos",
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("IndexedDB indisponível")); return; }
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(this.storeName)) db.createObjectStore(this.storeName);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.storeName, "readonly");
      const req = tx.objectStore(this.storeName).get(key);
      req.onsuccess = () => resolve(req.result == null ? null : { value: req.result });
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => db.close();
    });
  },
  async set(key, value) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.storeName, "readwrite");
      tx.objectStore(this.storeName).put(value, key);
      tx.oncomplete = () => { db.close(); resolve(true); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  },
  async delete(key) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.storeName, "readwrite");
      tx.objectStore(this.storeName).delete(key);
      tx.oncomplete = () => { db.close(); resolve(true); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }
};

function TransladoPdfThumb({ meta, src, onOpen }) {
  const [thumb, setThumb] = useState(null);
  const [erro, setErro] = useState(false);
  useEffect(() => {
    let cancelado = false;
    (async () => {
      try {
        if (!window.pdfjsLib) { setErro(true); return; }
        const bytes = dataUrlToBytes(src);
        const pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1.7 });
        const cnv = document.createElement("canvas");
        cnv.width = viewport.width;
        cnv.height = viewport.height;
        await page.render({ canvasContext: cnv.getContext("2d"), viewport }).promise;
        if (!cancelado) setThumb(cnv.toDataURL("image/png"));
      } catch (e) {
        if (!cancelado) setErro(true);
      }
    })();
    return () => { cancelado = true; };
  }, [src]);

  if (erro) {
    return <div className="translado-preview-placeholder"><Icon name="doc" size={28} /><strong>{meta.nome}</strong><small>Não foi possível gerar a pré-visualização. Baixe e confira o arquivo original se precisar.</small></div>;
  }
  if (!thumb) {
    return <div className="translado-preview-placeholder"><Icon name="doc" size={28} /><strong>Carregando pré-visualização...</strong></div>;
  }
  return (
    <button type="button" className="translado-thumb-button" onClick={onOpen} title="Visualizar arquivo em tamanho maior">
      <img src={thumb} alt={`Pré-visualização de ${meta.nome}`} />
      <span className="translado-thumb-caption">Visualizar arquivo</span>
    </button>
  );
}

function RedactModal({ meta, dataUrl, onSave, onClose }) {
  const nomeArquivo = (meta.nome || "").toLowerCase();
  const isPdf = meta.tipo === "application/pdf" || nomeArquivo.endsWith(".pdf");

  const [pageUrls, setPageUrls] = useState(null);
  const [pageIndex, setPageIndex] = useState(0);
  const [rectsByPage, setRectsByPage] = useState({});
  const [previewRect, setPreviewRect] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [girando, setGirando] = useState(false);
  const [zoom, setZoom] = useState(100);
  const [modo, setModo] = useState("tarja"); // "tarja" = pintar de preto · "corte" = manter só a área selecionada
  const canvasRef = useRef(null);
  const dragRef = useRef(null);

  async function aplicarCorte(rect) {
    try {
      const img = await loadImageEl(pageUrls[pageIndex]);
      const cnv = document.createElement("canvas");
      cnv.width = Math.max(1, Math.round(rect.w));
      cnv.height = Math.max(1, Math.round(rect.h));
      const ctx = cnv.getContext("2d");
      ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, cnv.width, cnv.height);
      const novaUrl = cnv.toDataURL("image/png");
      setPageUrls(prev => { const n = [...prev]; n[pageIndex] = novaUrl; return n; });
      setRectsByPage(prev => ({ ...prev, [pageIndex]: [] })); // tarjas antigas perdem a referência após o corte
    } catch (e) { /* mantém como está se algo falhar */ }
  }

  async function girar90() {
    if (!pageUrls) return;
    setGirando(true);
    try {
      const img = await loadImageEl(pageUrls[pageIndex]);
      const cnv = document.createElement("canvas");
      cnv.width = img.naturalHeight;
      cnv.height = img.naturalWidth;
      const ctx = cnv.getContext("2d");
      ctx.translate(cnv.width / 2, cnv.height / 2);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
      const novaUrl = cnv.toDataURL("image/png");
      setPageUrls(prev => { const n = [...prev]; n[pageIndex] = novaUrl; return n; });
      setRectsByPage(prev => ({ ...prev, [pageIndex]: [] }));
    } catch (e) { /* mantém como está se algo falhar */ }
    setGirando(false);
  }

  useEffect(() => {
    let cancelado = false;
    (async () => {
      try {
        if (isPdf) {
          if (!window.pdfjsLib) { setLoadError("A biblioteca de leitura de PDF não carregou. Verifique sua conexão."); return; }
          const bytes = dataUrlToBytes(dataUrl);
          const pdf = await window.pdfjsLib.getDocument({ data: bytes }).promise;
          const urls = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.7 });
            const cnv = document.createElement("canvas");
            cnv.width = viewport.width;
            cnv.height = viewport.height;
            await page.render({ canvasContext: cnv.getContext("2d"), viewport }).promise;
            urls.push(cnv.toDataURL("image/png"));
          }
          if (!cancelado) setPageUrls(urls);
        } else {
          if (!cancelado) setPageUrls([dataUrl]);
        }
      } catch (e) {
        if (!cancelado) setLoadError("Não foi possível carregar este arquivo para edição.");
      }
    })();
    return () => { cancelado = true; };
  }, []);

  useEffect(() => {
    if (!pageUrls) return;
    let cancelado = false;
    loadImageEl(pageUrls[pageIndex]).then(img => {
      if (cancelado) return;
      const canvas = canvasRef.current;
      if (!canvas) return;
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      ctx.fillStyle = "#000";
      (rectsByPage[pageIndex] || []).forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));
      if (previewRect) {
        if (modo === "corte") {
          // Escurece o que será descartado e contorna a área que vai FICAR
          ctx.fillStyle = "rgba(0,0,0,.45)";
          ctx.fillRect(0, 0, canvas.width, previewRect.y);
          ctx.fillRect(0, previewRect.y + previewRect.h, canvas.width, canvas.height - previewRect.y - previewRect.h);
          ctx.fillRect(0, previewRect.y, previewRect.x, previewRect.h);
          ctx.fillRect(previewRect.x + previewRect.w, previewRect.y, canvas.width - previewRect.x - previewRect.w, previewRect.h);
          ctx.strokeStyle = "#64b745";
          ctx.lineWidth = Math.max(2, canvas.width / 300);
          ctx.setLineDash([10, 7]);
          ctx.strokeRect(previewRect.x, previewRect.y, previewRect.w, previewRect.h);
          ctx.setLineDash([]);
        } else {
          ctx.fillStyle = "rgba(0,0,0,.55)";
          ctx.fillRect(previewRect.x, previewRect.y, previewRect.w, previewRect.h);
        }
      }
    }).catch(() => setLoadError("Não foi possível desenhar a página."));
    return () => { cancelado = true; };
  }, [pageUrls, pageIndex, rectsByPage, previewRect, modo]);

  function posFromEvent(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function handleDown(e) {
    e.preventDefault();
    const p = posFromEvent(e);
    if (modo === "tarja") {
      const existentes = rectsByPage[pageIndex] || [];
      const indiceClicado = existentes.findIndex(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
      if (indiceClicado !== -1) {
        setRectsByPage(prev => ({ ...prev, [pageIndex]: prev[pageIndex].filter((_, i) => i !== indiceClicado) }));
        return;
      }
    }
    dragRef.current = p;
    setPreviewRect({ x: p.x, y: p.y, w: 0, h: 0 });
  }
  function handleMove(e) {
    if (!dragRef.current) return;
    const p = posFromEvent(e);
    const s = dragRef.current;
    setPreviewRect({ x: Math.min(s.x, p.x), y: Math.min(s.y, p.y), w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y) });
  }
  function handleUp() {
    if (!dragRef.current) return;
    dragRef.current = null;
    setPreviewRect(pr => {
      if (pr && modo === "corte") {
        if (pr.w > 24 && pr.h > 24) {
          const temTarjas = (rectsByPage[pageIndex] || []).length > 0;
          const aviso = temTarjas
            ? "Cortar a imagem, mantendo somente a área destacada?\n\nAtenção: as tarjas já feitas nesta página serão removidas — refaça depois do corte, se precisar."
            : "Cortar a imagem, mantendo somente a área destacada?";
          if (window.confirm(aviso)) aplicarCorte(pr);
        }
        return null;
      }
      if (pr && pr.w > 6 && pr.h > 6) {
        setRectsByPage(prev => ({ ...prev, [pageIndex]: [...(prev[pageIndex] || []), pr] }));
      }
      return null;
    });
  }

  function desfazerUltima() {
    setRectsByPage(prev => ({ ...prev, [pageIndex]: (prev[pageIndex] || []).slice(0, -1) }));
  }
  function limparPagina() {
    setRectsByPage(prev => ({ ...prev, [pageIndex]: [] }));
  }

  async function concluir() {
    setSaving(true);
    setLoadError(null);
    try {
      const achatadas = [];
      for (let i = 0; i < pageUrls.length; i++) {
        const img = await loadImageEl(pageUrls[i]);
        const cnv = document.createElement("canvas");
        cnv.width = img.naturalWidth;
        cnv.height = img.naturalHeight;
        const ctx = cnv.getContext("2d");
        ctx.drawImage(img, 0, 0);
        ctx.fillStyle = "#000";
        (rectsByPage[i] || []).forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));
        achatadas.push(cnv.toDataURL("image/png"));
      }
      if (achatadas.length === 1 && !isPdf) {
        onSave(achatadas[0], { tipo: "image/png", nome: meta.nome.replace(/\.(jpe?g)$/i, ".png"), redigido: Object.values(rectsByPage).some(arr => arr && arr.length) });
      } else {
        const { PDFDocument } = window.PDFLib;
        const novoDoc = await PDFDocument.create();
        for (const png of achatadas) {
          const bytes = dataUrlToBytes(png);
          const img = await novoDoc.embedPng(bytes);
          const page = novoDoc.addPage([img.width, img.height]);
          page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
        }
        const pdfBytes = await novoDoc.save();
        const newDataUrl = "data:application/pdf;base64," + bytesToBase64(pdfBytes);
        onSave(newDataUrl, { tipo: "application/pdf", nome: meta.nome, redigido: Object.values(rectsByPage).some(arr => arr && arr.length) });
      }
    } catch (e) {
      setLoadError("Não foi possível aplicar a ocultação (" + (e && e.message ? e.message : "erro") + ").");
    } finally {
      setSaving(false);
    }
  }

  const totalRects = Object.values(rectsByPage).reduce((a, arr) => a + (arr ? arr.length : 0), 0);

  return (
    <div className="redact-overlay" onMouseUp={handleUp}>
      <div className="redact-modal">
        <div className="redact-head">
          <h3>Ocultar dados pessoais — {meta.nome}</h3>
          <button className="redact-close" onClick={onClose}><Icon name="close" size={18} /></button>
        </div>
        <div className="redact-workspace">
          <aside className="redact-guide-panel">
            <div className="redact-hint">
              <div className="lgpd-callout">
                <div className="lgpd-badge">LGPD</div>
                <div>
                  <strong>Oculte os dados pessoais deste comprovante.</strong>
                  <div className="lgpd-text">Cubra com a tarja preta: endereço residencial, CPF, RG, dados bancários, QR Code e outros dados pessoais. No CPF, deixe visíveis apenas os <b>seis números do meio</b> (ex.: XXX.698.789-XX).</div>
                </div>
              </div>
              <strong>Como fazer:</strong>
              <ol className="redact-steps">
                <li>Se o documento estiver de lado, clique em <b>“Girar 90°”</b>.</li>
                <li>Clique e arraste sobre o dado até cobri-lo com uma <b>tarja preta</b>.</li>
                <li>Para apagar uma tarja, clique sobre ela ou use <b>“Desfazer última marcação”</b>.</li>
                <li>Para <b>cortar a imagem</b> (ex.: remover um rodapé com dados desnecessários), clique em <b>“✂ Cortar”</b> e desenhe a área que deve <b>ficar</b> — o resto é descartado.</li>
                <li>Confira o documento e clique em <b>“Concluir e aplicar”</b>.</li>
              </ol>
              <div className="redact-demo" aria-hidden="true">
                <div className="redact-demo-title">Exemplo</div>
                <div className="redact-demo-card">
                  <div className="demo-line">CPF: 123.698.789-10</div>
                  <div className="demo-line">Endereço: Rua Exemplo, 123</div>
                  <div className="demo-mask demo-mask-1"></div>
                  <div className="demo-mask demo-mask-2"></div>
                  <div className="demo-cursor"></div>
                </div>
                <div className="redact-demo-caption">Arraste sobre o dado para aplicar a tarja.</div>
              </div>
            </div>
          </aside>
          <section className="redact-document-panel">
            {loadError && (
              <div className="banner error" style={{ margin: "12px 16px 0" }}>
                <Icon name="alert" size={16} /><span>{loadError}</span>
              </div>
            )}
            {!pageUrls && !loadError && <div className="redact-loading">Carregando documento...</div>}
            {pageUrls && (
              <>
                <div className="redact-zoom">
                  <button className="btn btn-ghost" onClick={() => setZoom(z => Math.max(45, z - 15))}>− Reduzir</button>
                  <button className="btn btn-ghost" onClick={() => setZoom(100)}>Ajustar</button>
                  <button className="btn btn-ghost" onClick={() => setZoom(z => Math.min(200, z + 15))}>+ Ampliar</button>
                  <span>{zoom}%</span>
                  <button className="btn btn-ghost" style={{ marginLeft: 10, paddingLeft: 14, borderLeft: "1px solid var(--linha)" }} onClick={girar90} disabled={!pageUrls || girando}>{girando ? "Girando..." : "↻ Girar 90°"}</button>
                  <button className={"btn " + (modo === "tarja" ? "btn-primary" : "btn-ghost")} style={{ marginLeft: 10, paddingLeft: 14, borderLeft: "1px solid var(--linha)" }} onClick={() => setModo("tarja")} disabled={!pageUrls} aria-pressed={modo === "tarja"}>Tarja preta</button>
                  <button className={"btn " + (modo === "corte" ? "btn-primary" : "btn-ghost")} onClick={() => setModo("corte")} disabled={!pageUrls} aria-pressed={modo === "corte"}>✂ Cortar</button>
                </div>
                {pageUrls.length > 1 && (
                  <div className="redact-pager">
                    <button className="btn btn-ghost" disabled={pageIndex === 0} onClick={() => setPageIndex(i => Math.max(0, i - 1))}>◀ Página anterior</button>
                    <span>Página {pageIndex + 1} de {pageUrls.length}</span>
                    <button className="btn btn-ghost" disabled={pageIndex === pageUrls.length - 1} onClick={() => setPageIndex(i => Math.min(pageUrls.length - 1, i + 1))}>Próxima página ▶</button>
                  </div>
                )}
                <div className="redact-canvas-wrap">
                  <canvas
                    ref={canvasRef}
                    style={{ width: `${zoom}%` }}
                    onMouseDown={handleDown}
                    onMouseMove={handleMove}
                    onMouseUp={handleUp}
                    onMouseLeave={handleUp}
                    onTouchStart={handleDown}
                    onTouchMove={handleMove}
                    onTouchEnd={handleUp}
                  />
                </div>
              </>
            )}
          </section>
        </div>

        <div className="redact-actions">
          <div className="left-group">
            <button className="btn btn-ghost" onClick={desfazerUltima} disabled={!pageUrls || !(rectsByPage[pageIndex] || []).length}>Desfazer última marcação</button>
            <button className="btn btn-ghost" onClick={limparPagina} disabled={!pageUrls || !(rectsByPage[pageIndex] || []).length}>Limpar página</button>
          </div>
          <div className="right-group">
            <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
            <button className="btn btn-primary" onClick={concluir} disabled={!pageUrls || saving}>
              {saving ? "Aplicando..." : `Concluir e aplicar${totalRects ? " (" + totalRects + ")" : ""}`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// Input/textarea que preserva a posição do cursor mesmo quando o valor é ajustado
// no onChange (ex.: se algum dia precisarmos aplicar uma máscara/formatação). Hoje
// não aplicamos nenhuma transformação — o texto fica exatamente como a pessoa digitou.
function CampoTexto({ as: Tag = "input", value, onChange, ...props }) {
  const ref = useRef(null);
  const posicaoPendente = useRef(null);

  useLayoutEffect(() => {
    if (posicaoPendente.current !== null && ref.current) {
      const { inicio, fim } = posicaoPendente.current;
      ref.current.setSelectionRange(inicio, fim);
      posicaoPendente.current = null;
    }
  });

  function handleChange(e) {
    const campo = e.target;
    posicaoPendente.current = { inicio: campo.selectionStart, fim: campo.selectionEnd };
    onChange(campo.value);
  }

  return <Tag ref={ref} value={value} onChange={handleChange} {...props} />;
}

function FieldGuide({ show = true, children, className = "" }) {
  if (!show) return null;

function LocalidadeSelect({ value, onChange, estados, estadosErro, municipiosCache, garantirMunicipios }) {
  const partes = (value || "").split(" - ");
  const municipioDoValor = partes.length === 2 ? partes[0] : "";
  const ufDoValor = partes.length === 2 ? partes[1] : "";

  const [uf, setUf] = useState(ufDoValor);
  const [carregandoMunicipios, setCarregandoMunicipios] = useState(false);
  const [erroMunicipios, setErroMunicipios] = useState(false);

  useEffect(() => {
    if (ufDoValor && ufDoValor !== uf) setUf(ufDoValor);
  }, [ufDoValor]);

  useEffect(() => {
    if (!uf || municipiosCache[uf]) return;
    let cancelado = false;
    setCarregandoMunicipios(true);
    setErroMunicipios(false);
    garantirMunicipios(uf).then(ok => {
      if (cancelado) return;
      setCarregandoMunicipios(false);
      if (!ok) setErroMunicipios(true);
    });
    return () => { cancelado = true; };
  }, [uf]);

  function selecionarUF(novaUF) {
    setUf(novaUF);
    onChange("");
  }

  function selecionarMunicipio(nomeMunicipio) {
    if (!nomeMunicipio) { onChange(""); return; }
    onChange(`${nomeMunicipio} - ${uf}`);
  }

  const municipios = municipiosCache[uf] || [];
  const municipioSelecionado = municipioDoValor ? (municipios.find(m => m.toUpperCase() === municipioDoValor.toUpperCase()) || "") : "";

  if (estadosErro) {
    return <CampoTexto type="text" value={value} onChange={onChange} placeholder="Ex: Curitiba - PR" />;
  }

  return (
    <div className="localidade-select">
      <select value={uf} onChange={e => selecionarUF(e.target.value)} disabled={!estados.length}>
        <option value="">{estados.length ? "Estado (UF)" : "Carregando estados..."}</option>
        {estados.map(e => <option key={e.sigla} value={e.sigla}>{e.nome}</option>)}
      </select>
      <select
        value={municipioSelecionado}
        onChange={e => selecionarMunicipio(e.target.value)}
        disabled={!uf || carregandoMunicipios || erroMunicipios}
      >
        <option value="">
          {!uf ? "Selecione o estado primeiro" : carregandoMunicipios ? "Carregando municípios..." : erroMunicipios ? "Falha ao carregar" : "Município"}
        </option>
        {municipios.map(m => <option key={m} value={m}>{m}</option>)}
      </select>
      {erroMunicipios && (
        <button type="button" className="file-btn" style={{ marginTop: 8 }} onClick={() => selecionarUF(uf)}>Tentar novamente</button>
      )}
    </div>
  );
}

function dadosRelatorioPreview(form, numeracaoAnexos) {
  const periodo = form.dataSaida && form.dataRetorno
    ? `${formatDateBR(form.dataSaida)} a ${formatDateBR(form.dataRetorno)}`
    : (formatDateBR(form.dataSaida) || formatDateBR(form.dataRetorno) || "—");
  const tipoViagem = TRANSPORTES.find(t => t.id === form.transporte)?.label || "—";
  const cargoLinha = [form.cargoFuncao, form.siglaSetor].filter(Boolean).join(" — ");
  const tipoPrestacao = form.tipoPrestacao === "roteiro_reduzido" ? "ROTEIRO REDUZIDO" : form.tipoPrestacao === "roteiro_sem_alteracao" ? "ROTEIRO SEM ALTERAÇÃO" : "—";
  const transladosComArquivo = (form.translados || []).filter(t => t.arquivo);
  const totalTranslados = transladosComArquivo.reduce((a, t) => a + parseMoeda(t.valor), 0);
  const liberadoTranslado = parseMoeda(form.valorTransladoLiberado);
  const valorRetiradoTranslado = form.retiradaTransladoIntegral === "sim"
    ? liberadoTranslado
    : parseMoeda(form.valorTransladoRetirado);
  const saldoTransladoDevolver = form.usouTranslado === "sim" && form.valorTransladoLiberado
    ? Math.max(0, valorRetiradoTranslado - totalTranslados)
    : 0;
  const comPag = (nome, docId, idx = 0) => {
    const p = numeracaoAnexos?.paginaPorDocId?.[docId]?.[idx];
    return p ? `${nome} — pág. ${p}` : nome;
  };
  const docsPreview = [];
  if (form.anexos?.solicitacao_veiculo?.length) docsPreview.push({ nome: comPag("Solicitação de veículo", "solicitacao_veiculo") });
  if (form.anexos?.diario_bordo?.length) docsPreview.push({ nome: comPag("Diário de bordo", "diario_bordo") });
  if (form.anexos?.embarque?.length) docsPreview.push({ nome: comPag("Cartão de embarque ou declaração de embarque", "embarque") });
  if (form.anexos?.bilhete?.length) docsPreview.push({ nome: comPag("Bilhete, BPE ou declaração de embarque", "bilhete") });
  if (form.anexos?.termo_ciencia?.length) docsPreview.push({ nome: comPag("Termo de Ciência e Responsabilidade", "termo_ciencia") });
  if (form.anexos?.saque?.length) docsPreview.push({ nome: comPag("Comprovante de saque ou transferência", "saque") });
  else if (form.saqueComprovante === "nao" && form.justificativas?.saque) docsPreview.push({ nome: "Justificativa registrada por não ter inserido o comprovante de saque/transferência", detalhe: form.justificativas.saque });
  if (form.anexos?.devolucao_roteiro?.length) docsPreview.push({ nome: comPag("Devolução de diária — roteiro reduzido", "devolucao_roteiro") });
  if (transladosComArquivo.length) {
    const pSintese = numeracaoAnexos?.paginaSinteseTranslado;
    docsPreview.push({ nome: pSintese ? `Comprovantes de translado — pág. ${pSintese}` : "Comprovantes de translado", detalhe: `${transladosComArquivo.length} comprovante(s) — Total: ${moedaBR(totalTranslados)}` });
  }
  if (saldoTransladoDevolver > 0.009 && form.anexos?.devolucao_translado?.length) docsPreview.push({ nome: comPag("Devolução do saldo de translado", "devolucao_translado") });
  if (form.anexos?.comprobatorio?.length) docsPreview.push({ nome: comPag("Outros documentos comprobatórios", "comprobatorio") });
  const totalTransladoGasto = (form.translados || []).reduce((a, t) => a + parseMoeda(t.valor), 0);
  const saldoRoteiroDevolver = (form.tipoPrestacao === "roteiro_reduzido" && form.precisaDevolucao === "sim") ? parseMoeda(form.valorDevolucao) : 0;
  const saldoADevolver = saldoRoteiroDevolver + saldoTransladoDevolver;
  const atestoPreview = "Atesto e certifico que as informações constantes no presente documento demonstram efetivamente a realização e a efetividade da viagem, e que os comprovantes de despesa anexos a esta prestação de contas foram efetivamente realizados no estrito interesse da administração pública, conforme o Decreto Estadual n.º 6.358/2024.";
  return { periodo, tipoViagem, cargoLinha, tipoPrestacao, docsPreview, atestoPreview, saldoADevolver };
}

// Converte o texto digitado pelo viajante em blocos semânticos.
// Linhas com marcador viram itens de lista; linhas comuns consecutivas
// formam um parágrafo. A mesma estrutura é usada na prévia e no PDF.
function criarBlocosTextoRelatorio(textoOriginal) {
  const texto = String(textoOriginal ?? "").replace(/\r/g, "").trim();
  if (!texto) return [{ tipo: "paragrafo", texto: "—" }];

  const blocos = [];
  let paragrafo = [];
  const descarregarParagrafo = () => {
    if (!paragrafo.length) return;
    blocos.push({ tipo: "paragrafo", texto: paragrafo.join(" ").replace(/\s+/g, " ").trim() });
    paragrafo = [];
  };

  texto.split("\n").forEach(linhaOriginal => {
    const linha = linhaOriginal.trim();
    if (!linha) {
      descarregarParagrafo();
      return;
    }

    const item = linha.match(/^([•●▪◦‣⁃*\-–—]|\d+[.)])\s*(.+)$/);
    if (item) {
      descarregarParagrafo();
      blocos.push({ tipo: "lista", marcador: item[1], texto: item[2].replace(/\s+/g, " ").trim() });
      return;
    }

    paragrafo.push(linha);
  });
  descarregarParagrafo();

  return blocos.length ? blocos : [{ tipo: "paragrafo", texto: "—" }];
}

// ---- Lista de rascunhos deste navegador (tela "Minhas prestações") ----
const CHAVE_LISTA_RASCUNHOS = "prestacao:listaRascunhos";
function lerListaRascunhos() {
  try { return JSON.parse(localStorage.getItem(CHAVE_LISTA_RASCUNHOS)) || []; } catch (e) { return []; }
}
function gravarListaRascunhos(lista) {
  try { localStorage.setItem(CHAVE_LISTA_RASCUNHOS, JSON.stringify(lista)); } catch (e) {}
}
function atualizarRascunhoNaLista(tokenRascunho, dados) {
  if (!tokenRascunho) return;
  const lista = lerListaRascunhos();
  const i = lista.findIndex(r => r.token === tokenRascunho);
  const item = { ...(i >= 0 ? lista[i] : { token: tokenRascunho }), ...dados };
  if (i >= 0) lista[i] = item; else lista.unshift(item);
  lista.sort((a, b) => String(b.atualizadoEm || "").localeCompare(String(a.atualizadoEm || "")));
  gravarListaRascunhos(lista);
}
function removerRascunhoDaLista(tokenRascunho) {
  gravarListaRascunhos(lerListaRascunhos().filter(r => r.token !== tokenRascunho));
}
function abrirRascunho(tokenRascunho) {
  const url = new URL(window.location.href);
  url.searchParams.set("rascunho", tokenRascunho);
  window.location.href = url.toString();
}

function dataHoraBR(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return ""; }
}
